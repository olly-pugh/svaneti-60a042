neti cash here. Use a TBC ATM — TBC charges no access fee and lets you take up to 2,000 GEL, while Bank of Georgia adds 3 GEL and other machines charge 2–20 GEL. There is one working ATM in Mestia and none at all in Ushguli or the villages, and guesthouses are cash-only. Budget generously and take it in 50s and 20s — nobody in the mountains can change a 200.","links":[{"t":"TBC ATM fees","u":"https://www.tbcbank.ge/web/en/atm-withdrawal-fee"},{"t":"ATM fees in Georgia — full breakdown","u":"https://atmfeesaver.com/cash-atms-in-georgia/"}],"dy":[3]},{"id":"leghvtakhevi","n":"Leghvtakhevi Waterfall","n2":"ლეღვთახევის ჩანჩქერი","k":"nature","ll":[41.68681,44.809],"price":"Free","gbp":"Free","open":"Always open (walkway lit at night)","win":"either","mins":20,"d":"A 22 m waterfall in a narrow gorge two minutes' walk behind the bathhouses — the Tsavkisistskali river dropping into the middle of the Old Town. Absurdly easy to reach and most people miss it entirely.","go":"Walk to the end of Abano Street past Chreli Abano and keep going up the gorge on the boardwalk. Signposted from Gorgasali Square.","dist":"2.6 km · ~44 min walk from Fabrika; 3 min from the baths","tip":"Do it before the baths, not after — the walk up the gorge is a 15-minute round trip and you will not want to move afterwards.","links":[{"t":"Georgia Travel (official)","u":"https://georgia.travel/family-attractions/leghvtakhevi"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d13079450-Reviews-Legvachtahvi_Gorge-Tbilisi.html"}],"dy":[3]},{"id":"narikala-cable-car","n":"Rike–Narikala cable car","k":"view","ll":[41.6932,44.80999],"price":"2.5 GEL each way · Metromoney card 2 GEL if you don't have one","gbp":"≈£0.70 each way","open":"Roughly 10:00–24:00 in summer (10:00–22:00 winter)","win":"either","mins":25,"d":"A two-minute glass gondola from Rike Park up over the river and the Old Town roofs to the Narikala ridge. Cheap, quick, and the best-value view in the city.","go":"Lower station is inside Rike Park by the Peace Bridge. Pay with a white Metromoney card (the same one as the metro) or a contactless bank card — the newer blue transport subscription card often does not work here.","dist":"1.9 km · ~32 min walk from Fabrika, or 5–8 GEL by Bolt","tip":"Go up on the cable car, walk the ridge west to Kartlis Deda, then come down the Betlemi stairs into Sololaki on foot — that way you only pay 2.5 GEL and get the whole ridge.","links":[{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/cable-car/"},{"t":"Sakhva — price & hours 2026","u":"https://sakhva-travel.com/en/blog/tbilisi-cable-car/"}],"dy":[3]},{"id":"betlemi-sololaki","n":"Betlemi stairs & Sololaki","n2":"ბეთლემის ქუჩა","k":"view","ll":[41.68927,44.80711],"price":"Free","gbp":"Free","open":"Always open","win":"D3 day","mins":45,"d":"The stepped lane that climbs from Lado Asatiani Street up through the oldest surviving houses in Tbilisi to the ridge — carved wooden balconies, vines, cats, and terrace views back over the Old Town at every landing. Sololaki below it is the crumbling art-nouveau quarter with the painted stairwells.","go":"Start at the bottom of Betlemi St off Lado Asatiani St and climb. About 20 minutes up to the Mother of Georgia viewpoint.","dist":"2.3 km · ~39 min walk from Fabrika to the bottom of the stairs","tip":"Do it downhill: cable car up, ridge walk, then descend Betlemi into Sololaki and you land right by the wine bars.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/narikala-fortress-tbilisi-georgia/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.68927&mlon=44.80711#map=18/41.68927/44.80711"}],"dy":[3]},{"id":"mtatsminda-funicular","n":"Mtatsminda funicular & park","n2":"მთაწმინდის ფუნიკულიორი","k":"view","ll":[41.69493,44.79235],"price":"Funicular 10 GEL one way + 2 GEL for the required Mtatsminda card · park entry free · rides 3–10 GEL","gbp":"≈£2.80 one way + £0.55 card","open":"Funicular 09:45–23:30 in summer · park 12:00–23:00 (11:00 weekends)","win":"either","mins":120,"d":"The 1905 funicular hauls you 8 minutes up the holy mountain to a Soviet amusement park with a ferris wheel on the edge of a 700 m drop. The view is the biggest in Tbilisi. It stops halfway at the Mtatsminda Pantheon, where Georgia's writers are buried around the Mamadaviti church.","go":"Lower station on Daniel Chonkadze St, above Rustaveli. Metro Marjanishvili → Rustaveli (1 stop, 1 GEL) then 12 min uphill walk, or 6–9 GEL by Bolt from Fabrika.","dist":"1.8 km · ~31 min walk to the lower station, or 1 metro stop + 12 min uphill","tip":"Only worth the 24 GEL round trip for two if you go up for sunset and stay. Otherwise Kartlis Deda gives you a comparable view for the price of a 2.5 GEL cable car.","links":[{"t":"Wander-Lush — Mtatsminda guide","u":"https://wander-lush.org/mtatsminda-tbilisi-tv-tower-hike/"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/mtatsminda-park/"}],"dy":[3]},{"id":"machakhela-samikitno","n":"Machakhela Samikitno (Old Town, 24h)","n2":"მაჭახელა სამიკიტნო","k":"eat","ll":[41.68975,44.80888],"price":"~45–60 GEL for two with beer — khinkali 2–2.5 GEL each, khachapuri ~14–18 GEL","gbp":"≈£13–£17 for two","open":"24 hours, every day","win":"either","mins":60,"d":"The reliable, cheap, always-open Georgian canteen on the corner of Gorgasali Square looking straight at Metekhi Church. Not a secret and not a discovery, but the khinkali and khachapuri are properly good, the portions are large and it is open at 03:00 when nothing else is.","go":"23 Hovhannes Tumanyan St, at Gorgasali Square by Metekhi Bridge — two minutes from the sulphur baths.","dist":"2.2 km · ~38 min walk from Fabrika, or 8–11 GEL by Bolt","tip":"Check the bill — reviewers report a 15% service charge being added. Order khinkali by the count (five each is a meal), grip the topknot, bite, drink the broth, leave the knot on the plate.","links":[{"t":"Red Fedora Diary — khinkali guide","u":"https://www.redfedoradiary.com/best-khinkali-in-tbilisi/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.68975&mlon=44.80888#map=19/41.68975/44.80888"}],"dy":[3]},{"id":"salobie-bia","n":"Salobie Bia","n2":"სალობიე ბია","k":"eat","ll":[41.6996,44.79743],"price":"~50–70 GEL for two with wine — lobio in a clay pot with pickles and mchadi is the dish","gbp":"≈£14–£20 for two","open":"Daily 11:00–23:00 (some sources Mon–Fri only)","win":"D3 day","mins":75,"d":"Giorgi Iosava's small basement room under the Rustaveli Theatre doing plain, precise versions of the peasant classics — lobio beans stewed in a clay pot with pickles and cornbread, shkmeruli chicken, kharcho. Cheap, and the best cooking on this list by some distance.","go":"17 Shota Rustaveli Ave, down the stairs in the theatre basement — easy to walk past. Metro Marjanishvili → Rustaveli (1 stop, 1 GEL), 5 min walk.","dist":"1.2 km · ~20 min walk from Fabrika, or 1 metro stop","tip":"The lobio-and-mchadi combination is about 15 GEL and is genuinely a meal. Good the day before a trek.","links":[{"t":"Culinary Backstreets","u":"https://culinarybackstreets.com/stories/tbilisi/salobie-bia-2"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g294195-d12671087-Reviews-Salobie_Bia-Tbilisi.html"},{"t":"Wander-Lush restaurants guide","u":"https://wander-lush.org/tbilisi-georgia-food-best-restaurants-cafes-guide/"}],"dy":[3]},{"id":"tone-bakery-sioni","n":"Tone bakery, Sioni Street","n2":"თონე","k":"eat","ll":[41.69089,44.8074],"price":"Shoti bread ~1.5–2.5 GEL a loaf · lobiani or khachapuri ~4–7 GEL","gbp":"≈£0.50 a loaf · ≈£1.20–£2 for a filled bread","open":"Roughly 08:00 until the dough runs out, most days","win":"D3 day","mins":15,"d":"A hole-in-the-wall clay-oven bakery on Sioni Street where a man slaps dough onto the wall of a sunken tone oven and hooks out canoe-shaped shoti loaves. This is Tbilisi's real cheap-lunch culture: hot bread straight from the wall, plus lobiani (bean bread) and khachapuri for a couple of lari.","go":"Sioni St in the Old Town, near the cathedral. Look for the open doorway with the oven glowing in the floor — these places are almost never signposted in English.","dist":"2.1 km · ~36 min walk from Fabrika","tip":"Bread + cheese + tomatoes from any corner shop is a 10 GEL lunch for two, and shoti is the single best thing to eat in Georgia. Cash only, exact-ish change appreciated.","links":[{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69089&mlon=44.80740#map=19/41.69089/44.80740"},{"t":"Wander-Lush restaurants guide","u":"https://wander-lush.org/tbilisi-georgia-food-best-restaurants-cafes-guide/"}],"dy":[3]},{"id":"cafe-leila","n":"Cafe Leila","k":"cafe","ll":[41.69548,44.80649],"price":"Cappuccino ~9 GEL · light vegetarian plates ~15–25 GEL","gbp":"≈£2.50 a coffee","open":"Daily, roughly 10:00–23:00","win":"D3 day","mins":45,"d":"A former candy shop on Shavteli Street painted floor-to-ceiling with copies of Persian and Georgian miniatures — the prettiest room in the Old Town and one of the few historic cafes that hasn't been ruined. Barista coffee, a good vegetarian menu, decent cake.","go":"18 Shavteli St, 30 seconds from Anchiskhati and the Gabriadze clock tower. Straight down the right bank from Fabrika.","dist":"1.6 km · ~27 min walk from Fabrika","tip":"Perfect first stop when you walk into the Old Town — it is the closest good café to Fabrika on this side.","links":[{"t":"Wander-Lush cafes guide","u":"https://wander-lush.org/best-cafes-in-tbilisi-coffee-shops/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69548&mlon=44.80649#map=19/41.69548/44.80649"}],"dy":[3]},{"id":"karalashvili-marani","n":"Karalashvili Wine Cellar","n2":"ყარალაშვილის ღვინის მარანი","k":"drink","ll":[41.69419,44.80438],"price":"Tastings from 5 GEL a glass","gbp":"≈£1.40 a glass","open":"Roughly 12:00–22:00, Mon–Sat","win":"either","mins":60,"d":"A 600-year-old brick cellar near Freedom Square where the family pours its own Kakheti wine straight from the qvevri. The cheapest serious wine tasting in Tbilisi by a wide margin, and the most atmospheric room to do it in.","go":"19 Vertskhli St, in the lanes between Freedom Square and Sioni. Metro Marjanishvili → Liberty Square (2 stops, 1 GEL) then 5 min.","dist":"1.7 km · ~29 min walk, or 2 metro stops + 5 min","tip":"This is the answer if you want to try amber/qvevri wine without paying tasting-room prices. Two of you can drink well for 30 GEL total. Compare: 8000 Vintages does a proper sit-down four-wine degustation with cheese from 45 GEL a head, and DADI near Freedom Square does one for around 20 GEL a head.","links":[{"t":"Wander-Lush Tbilisi wine guide","u":"https://wander-lush.org/tbilisi-wine-guide-bars-shops/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69419&mlon=44.80438#map=19/41.69419/44.80438"}],"dy":[3]},{"id":"vino-underground","n":"Vino Underground","n2":"ღvino Underground","k":"drink","ll":[41.69086,44.80114],"price":"Glasses roughly 10–20 GEL · cheese and bread plates ~15–25 GEL","gbp":"≈£3–£6 a glass","open":"Daily 11:00–23:00","win":"either","mins":75,"d":"The cellar in Sololaki that started Georgia's natural wine revival — co-founded by John Wurdeman of Pheasant's Tears, exclusively organic and low-intervention qvevri wine from small growers. Not a tourist wine bar; the people behind the counter actually know the vineyards.","go":"15 Galaktion Tabidze St, Sololaki — at the bottom of the Betlemi descent, so it lands neatly after the ridge walk. Metro Marjanishvili → Liberty Square (1 GEL) then 8 min.","dist":"2.1 km · ~35 min walk from Fabrika","tip":"Ask for a flight rather than bottles — you will learn more and spend less. Amber (skin-contact) rkatsiteli is the thing to try.","links":[{"t":"Wander-Lush bars guide","u":"https://wander-lush.org/best-bars-in-tbilisi-georgia/"},{"t":"Wander-Lush wine guide","u":"https://wander-lush.org/tbilisi-wine-guide-bars-shops/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69086&mlon=44.80114#map=19/41.69086/44.80114"}],"dy":[3]},{"id":"bassiani-khidi","n":"Bassiani & KHIDI — the reality check","k":"night","ll":[41.72277,44.79082],"price":"Bassiani 20–50 GEL · KHIDI 15–40 GEL","gbp":"≈£6–£14 · ≈£4–£11","open":"BOTH FRIDAY AND SATURDAY ONLY — closed Monday to Thursday. Bassiani doors ~23:59, runs to 10:00+; KHIDI to 08:00+","win":"D3 night","mins":60,"d":"The two clubs that made Tbilisi's name. Bassiani is in the drained swimming pool under Dinamo Arena, 1,200 capacity, strict-but-fair door; KHIDI is under the Vakhushti Bagrationi bridge on the river doing darker, harder industrial techno. Both are worth the trip. Neither of them opens on a Thursday, and no amount of showing up will change that.","go":"Bassiani: 2 Akaki Tsereteli Ave under Dinamo Arena — 30 min walk or 5–8 GEL by Bolt from Fabrika. KHIDI: right bank at the Vakhushti Bagrationi bridge, ~43 min walk or 7–10 GEL by Bolt.","dist":"Bassiani 1.8 km · ~31 min walk. KHIDI 2.5 km · ~43 min walk","tip":"If a Friday or Saturday ever appears in this trip: buy a Bassiani ticket online at bassiani.com for the specific event days ahead, or get on the guest list. At the door you get an interview — how you heard about the club, who is playing tonight, why you came — so read the Resident Advisor lineup first. Bring a passport (18+), have a real social media account they can look at, do not turn up loudly drunk. Phone cameras get stickered over; no photos inside. Russian passport holders are refused.","links":[{"t":"Bassiani on Resident Advisor","u":"https://ra.co/clubs/109137"},{"t":"KHIDI on Resident Advisor","u":"https://ra.co/clubs/119878"},{"t":"Bassiani door policy explained","u":"https://thefabryk.com/blog/bassiani"},{"t":"Georgia Expats nightlife guide (opening nights)","u":"https://georgiaexpats.com/guides/nightlife/"}],"dy":[3]},{"id":"cafe-gallery","n":"Cafe Gallery","k":"night","ll":[41.70252,44.79187],"price":"Cover typically 10–25 GEL · drinks ~10–18 GEL","gbp":"≈£3–£7 door","open":"Café by day, open 24h — becomes a club from midnight Thursday through Sunday, running to about 09:00","win":"D3 night","mins":240,"d":"This is the Thursday answer. Tbilisi's oldest surviving club, going since 2008: café and bar by day, and from midnight Thursday to Sunday the back room turns into a proper house-and-techno floor with local and touring DJs. No serious face control, no advance registration, and it is 20 minutes' walk from Fabrika.","go":"48 Rustaveli Ave / 34 Griboedov St — the block right behind Rustaveli metro. Metro Marjanishvili → Rustaveli (1 stop, 1 GEL) or 20 min walk from Fabrika; 4–7 GEL by Bolt on the way home.","dist":"1.2 km · ~20 min walk from Fabrika, or 1 metro stop","tip":"The honest maths: the floor does not fill until 01:00–02:00 and it runs to 09:00. If you stay for the good part you will be getting back to Fabrika around the time your train leaves. Either go for one hour at midnight and leave, or accept you are sleeping on the Zugdidi train.","links":[{"t":"Resident Advisor","u":"https://ra.co/clubs/56971"},{"t":"In Your Pocket","u":"https://www.inyourpocket.com/georgia/tbilisi/venues/cafe-gallery"},{"t":"Facebook","u":"https://www.facebook.com/cafegallery.ge/"}],"dy":[3]},{"id":"dedaena-bar","n":"Dedaena Bar","k":"night","ll":[41.70115,44.80453],"price":"Usually free entry, occasionally a small ticket · beer ~7–10 GEL","gbp":"Free–£3 · beer ≈£2–£3","open":"Thu 19:00–02:00 (Tue–Thu 19:00–02:00, Fri 19:00–03:00, closed Mon)","win":"D3 night","mins":150,"d":"The bar in the Mother Language Garden under the bridge — outdoor tables, skaters, a small stage, and a different thing on every night of the week (jam sessions, live bands, local DJs). Cheap, friendly, no door policy, and the closest good night out to Fabrika: 16 minutes on foot.","go":"Dedaena Park, on the right bank by the Dochanashvili footbridge. Straight down the riverside from Fabrika — 15–16 min walk, no transport needed.","dist":"0.9 km · ~16 min walk from Fabrika","tip":"This is the sensible Thursday: it shuts at 02:00, which is exactly the right time to stop if you are on the 08:15 train. Check their Instagram in the afternoon for what's on.","links":[{"t":"Resident Advisor","u":"https://ra.co/clubs/182926"},{"t":"Facebook","u":"https://www.facebook.com/dedaenabar/"},{"t":"Spotted by Locals","u":"https://www.spottedbylocals.com/tbilisi/dedaena-bar/"}],"dy":[3]},{"id":"success-bar","n":"Success Bar","k":"night","ll":[41.70612,44.78869],"price":"Free entry · drinks ~8–15 GEL","gbp":"Free · drinks ≈£2–£4","open":"Thu–Sun 20:00–03:00 (closed Mon–Wed)","win":"D3 night","mins":180,"d":"A small courtyard bar-club off Rustaveli that is the heart of Tbilisi's queer scene — no cover, no judgement, DJs most nights, and in summer the party spills out into the yard. One of the very few genuinely good club-ish rooms in the city that opens on a Thursday.","go":"Vashlovani St, in the lanes off Rustaveli near Pikris Gora. Metro Marjanishvili → Rustaveli (1 stop, 1 GEL) then 8 min, or 21 min walk from Fabrika. 5–8 GEL by Bolt back.","dist":"1.2 km · ~21 min walk from Fabrika","tip":"Free door and a 03:00 close makes this the best-value Thursday night on the list. Small room — go before 23:00 if you want a table.","links":[{"t":"Resident Advisor","u":"https://ra.co/clubs/181693"},{"t":"Facebook","u":"https://www.facebook.com/successbartbilisi/"},{"t":"Travel Gay","u":"https://www.travelgay.com/venue/success-bar"}],"dy":[3]},{"id":"dezerter-bazaar","n":"Dezerter Bazaar (trail food + the train)","n2":"დეზერტირების ბაზრობა","k":"market","ll":[41.7212,44.7942],"price":"Free to enter · churchkhela ~5–8 GEL each · walnuts, dried fruit and cheese by the kilo","gbp":"Free · churchkhela ≈£1.40–£2.30","open":"Daily 07:00–17:00 · liveliest before 12:00, vendors packing up from 15:00","win":"D3 day","mins":75,"d":"Tbilisi's great chaotic food market, sprawling from Station Square down Tsinamdzgvrishvili Street: dried fruit, walnuts, churchkhela, Tusheti guda cheese, honey, spices, cured Rachan pork, shoti bread. This is where you buy three days of trek food for a fraction of supermarket prices.","go":"Metro Marjanishvili → Station Square (Line 1, 1 stop, 1 GEL), then walk one block west. Or a flat 25 min walk from Fabrika. Buses 306 and 308 from Freedom Square also stop at Tsinamdzgvrishvili St 135.","dist":"1.5 km · ~25 min walk, or 1 metro stop (1 GEL)","tip":"Do this errand first thing — Tbilisi Central railway station is at the same Station Square metro stop, so you can confirm the 08:15 Zugdidi train at the ticket hall and buy your trail food in one trip and be back by 10:00. Bring small notes and a bag; almost nobody takes card. Churchkhela, walnuts and dried apricots are the classic Georgian trek calories.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/dezerter-bazaar-tbilisi-market/"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d12002363-Reviews-The_Dezerter_Bazaar-Tbilisi.html"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/tbilisi-dezerter-bazaar/"}],"dy":[3]},{"id":"bazari-orbeliani","n":"Bazari Orbeliani food hall","n2":"ბაზარი ორბელიანი","k":"market","ll":[41.69746,44.80411],"price":"Free to enter · plates 12–25 GEL · Coffee Lab cappuccino ~9 GEL","gbp":"Free · plates ≈£3.40–£7 · coffee ≈£2.50","open":"Roughly 09:00–23:00 daily","win":"D3 day","mins":50,"d":"A restored 1930s market hall between Freedom Square and Rustaveli, now a covered food court with about twenty counters — Georgian, Middle Eastern, bakery, a good wine counter, and Coffee Lab, which has a strong claim to the best coffee in the city.","go":"3 Vekua St, just off Freedom Square. Metro Marjanishvili → Liberty Square (2 stops, 1 GEL), 4 min walk.","dist":"1.3 km · ~23 min walk, or 2 metro stops (1 GEL)","tip":"Useful when you want a decent flat white and a cheap lunch in the same building without walking into a tourist trap on Shardeni Street.","links":[{"t":"Wander-Lush cafes guide (Coffee Lab)","u":"https://wander-lush.org/best-cafes-in-tbilisi-coffee-shops/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69746&mlon=44.80411#map=19/41.69746/44.80411"}],"dy":[3]}]},"mestia":{"n":"Mestia","anchor":[43.04268,42.72621],"anchorName":"Mestiatour Guesthouse","days":[4,5,8],"win":"Fri eve · Sat 07:00–09:00 · Tue 09:30–10:30","note":"Everything worth doing in Mestia is within 1 km of the guesthouse, which is the only reason these three slivers work at all. D4 (Fri, arrive 18:15): sunset is 19:36, so you get ~80 minutes of golden light — spend it walking up into the Lanchvali/Khergiani tower district rather than sitting down, then eat late at Laila (folk music from ~20:30) or Lushnu Qor, both open to midnight. D5 (Sat 07:00–09:00): the takeaway coffee kiosk by the bus stand opens 06:45 and the Spar and two Nikoras are 24/7, so buy trail food first; Erti Kava (08:00) and Restaurant Lile (08:00) are the only proper sit-down breakfasts open in time. D8 (Tue 09:30–10:30): the Svaneti Museum opens at 10:00 and closes at 18:00 — it fits none of your three windows, so write it off rather than gambling on the 10:30 bus; use the hour for a real meal at Lile (open 08:00) plus coffee at Erti Kava (08:00), both 3 minutes from the bus stand. CASH IS THE ONE THING YOU CANNOT GET WRONG: Mestia is the last ATM before Ushguli and nothing on the trek takes cards. There is a Basis Bank ATM 83 m from the guesthouse and a bank of 24/7 Bank of Georgia machines on Seti Square; Basisbank is the one to use — reportedly no foreign-card fee and a 2,000 GEL per-withdrawal limit against 400 GEL at most others. Draw ~500–600 GEL for two on the Friday evening, not on Saturday morning. Give up on: the Svaneti Museum, the Margiani House Museum (also 10:00), the Hatsvali chairlift (11:00-ish start) and the Mestia Cross (4 hours). None of them fit and pretending otherwise will cost you the bus. ONE CORRECTION to the Friday plan: the brief hoped for sunset light on Ushba, and that is not available. Ushba is 14 km north-west and Mestia's north-west valley wall rises to 1,900-2,000 m within 1-2 km of town, so the mountain is below the horizon from the valley floor — verified by terrain line-of-sight from six separate candidate spots including the airport (2.6 km, 35 min each way, also blocked). Ushba is a Mazeri/Becho mountain, or a reward for climbing the Cross. What Mestia does give you in 80 minutes is the tower district in low light plus the snow peaks up the Mestiachala and Mulkhra valleys, best seen from the rise above the Svaneti Museum, six minutes south.","items":[{"id":"seti-square","n":"Seti Square & the Queen Tamar statue","n2":"სეტის მოედანი / Setis Moedani","k":"monument","ll":[43.0439,42.72524],"price":"Free","gbp":"Free","open":"Always open; the Tourist Information Centre on the square is daily 10:00–18:00","win":"D4 evening · D5 early · D8 hour","mins":20,"d":"The flat paved heart of Mestia — town hall, tourist office, the Queen Tamar statue and a ring of cafe terraces, with snow peaks closing off both ends of the street. It is also the official start of the Mestia–Ushguli trek, which begins at the Tamar statue.","go":"Walk north-west from the guesthouse to the main street (Tamar Mepe / Betlemi) and turn left; the square opens out after about two minutes.","dist":"200 m · 3 min walk","tip":"Everything in the three windows radiates from here: bus stand, ATMs, Spar and Erti Kava are all within 100 m of the square.","links":[{"t":"Wander-Lush · 21 Things to Do in Mestia","u":"https://wander-lush.org/things-to-do-in-mestia-georgia/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04390,42.72524"}],"dy":[4,5,8]},{"id":"lanchvali-tower-district","n":"Lanchvali & Khergiani tower district (golden-hour walk)","n2":"ლანჩვალი / Lanchvali","k":"sight","ll":[43.04749,42.73093],"price":"Free","gbp":"Free","open":"Anytime — it is a residential neighbourhood, not a site","win":"D4 evening — the single best use of the Friday sliver","mins":60,"d":"The lanes climbing north-east out of the centre are where the Svan defensive towers actually still stand in numbers, staggered up the hillside among machubi (the old byre-houses), woodpiles, hay and cattle. It is a working village, not a monument park, and the low evening light on the stone is the whole point.","go":"From Seti Square walk about 450 m east along the main street, then take the lane up to the left (Khergiani St, which becomes Lanchvali St) and keep taking the uphill option at every junction; you pass under a stone arch after ~350 m. Uphill but on tarmac. This is the one thing that genuinely fits the Friday window — sunset on 4 Sept 2026 is 19:36, so leaving the guesthouse by 18:45 gives you the best of the light.","dist":"≈900 m · 15 min walk, uphill","tip":"Ushba Street, the elevated road running above and parallel to the main street, is the classic vantage point — towers in the foreground, Ushba behind.","links":[{"t":"Wander-Lush · 21 Things to Do in Mestia","u":"https://wander-lush.org/things-to-do-in-mestia-georgia/"},{"t":"Google Maps (Khergiani Tower)","u":"https://www.google.com/maps/search/?api=1&query=43.04749,42.73093"}],"dy":[4]},{"id":"niguriani-tower-museum","n":"Niguriani Tower Museum","n2":"ნიგურიანების საცხოვრებელი კომპლექსი","k":"museum","ll":[43.04604,42.72999],"price":"5–6 GEL per person, cash only","gbp":"≈£1.40–1.70","open":"Posted as daily 09:00–23:00 (OpenStreetMap survey) — the late close is unusual and worth treating as approximate, but the 09:00 opening is the earliest of any tower in town","win":"D4 evening (best) · D8 hour (tight but the only tower open before 10:00)","mins":30,"d":"A Svan tower you can actually climb, with a small family house-museum of antiques at the base and a ladder route up four or five floors to a roof hatch with a full panorama over Mestia's rooftops. Widely rated the best all-rounder of Mestia's several tower museums.","go":"From Seti Square head east along the main street and turn up Beknu Khergiani St; the tower is on the right after a short climb. If you attempt it in the D8 hour, go straight there at 09:30, allow 10 minutes each way, and be back at the bus stand by 10:20.","dist":"≈650 m · 10 min walk, uphill at the end","tip":"The final ladder to the roof is steep and the hatch is narrow — skip the top section if either of you dislikes heights, the lower floors are still worth the 5 GEL.","links":[{"t":"Trip.com · Niguriani Tower Museum","u":"https://www.trip.com/travel-guide/attraction/mestia/niguriani-tower-museum-139696197/"},{"t":"Wander-Lush (tower museums, 5–15 GEL)","u":"https://wander-lush.org/things-to-do-in-mestia-georgia/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04604,42.72999"}],"dy":[4,8]},{"id":"museum-rise-viewpoint","n":"The rise above the Svaneti Museum (short viewpoint)","k":"view","ll":[43.03926,42.72582],"price":"Free","gbp":"Free","open":"Anytime, but it is an open hillside with no lighting — daylight only","win":"D4 evening (golden hour) · D8 hour if you skip a sit-down meal","mins":30,"d":"A mapped viewpoint on the open slope just south of town, 39 m above the rooftops. It is the one spot within a six-minute walk that gets you far enough back from the northern valley wall to see Mestia whole — the tower district stacked up the far hillside, the church knoll, and the snow peaks 9-18 km up the Mestiachala and Mulkhra valleys catching the last light. Ushba is NOT visible from here, or from anywhere else in or immediately above Mestia (see tip).","go":"Head south from the guesthouse past the Svaneti Museum and keep going up the slope for another 200 m until the ground opens out and you can see back over the town. Straight-line 380 m due south, about 6 minutes on a gentle climb. On D4 leave by 19:00 for the 19:36 sunset; on D8 it is a 12-minute round trip of walking, so it fits the hour only if you are eating something quick rather than sitting down.","dist":"380 m · 6 min walk, +39 m","tip":"Honest framing: this is a viewpoint node on OpenStreetMap on an open hillside, not a built platform with a railing and a sign — expect a grassy slope and possibly livestock. And do not come here hoping for Ushba. I ran a terrain line-of-sight test from six candidate spots (the square, this rise, the Lanchvali towers, the two mapped viewpoints north of town and the airport): Mestia's north-west valley wall reaches 1,900-2,000 m within 1-2 km, putting the horizon at +15° to +21°, while Ushba's summit sits at only +13°. A peak would have to top 5,100 m at Ushba's distance to clear that wall and Ushba is 4,710 m. It is geometrically invisible from the valley floor, which is precisely why the Cross hike climbs 762 m. Ushba is a Mazeri/Becho view, or a Cross/Koruldi/Zuruldi view — not a Mestia one.","links":[{"t":"OpenStreetMap viewpoint node","u":"https://www.openstreetmap.org/node/10572938356"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.03926,42.72582"}],"dy":[4,8]},{"id":"restaurant-lile","n":"Restaurant Lile","n2":"ლილე","k":"eat","ll":[43.0444,42.72567],"price":"Mains 12–25 GEL, kubdari around 15 GEL, beer 5–10 GEL; ≈70–90 GEL for two with drinks","gbp":"≈£20–25 for two","open":"Daily 08:00–24:00","win":"D4 evening · D5 early · D8 hour — the only place that works in all three","mins":60,"d":"Cosy wood-panelled Svan restaurant with an outdoor terrace, a favourite for traditional folk music in the evenings, and — crucially — the only proper restaurant in Mestia that opens its doors at 08:00 and stays open to midnight. Full Svan menu: kubdari, chvishtari, tashmijabi.","go":"250 m north-west on the main street, just past Seti Square towards the bus stand. On D8 this is the obvious call: sit down at 09:35, eat a real meal, and the marshrutka stand is 60 m away.","dist":"250 m · 4 min walk","tip":"Order kubdari (spiced beef in bread), tashmijabi (potato mashed with stretchy mountain cheese) and ask for Svan salt on the table. A 10% service charge is standard in Mestia restaurants.","links":[{"t":"Packing Up The Pieces · Things to do in Mestia","u":"https://packing-up-the-pieces.com/things-to-do-in-mestia-and-what-to-skip"},{"t":"OpenStreetMap (hours, phone +995 551 77 76 22)","u":"https://www.openstreetmap.org/node/7003810555"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04440,42.72567"}],"dy":[4,5,8]},{"id":"cafe-laila","n":"Cafe Laila","n2":"კაფე ლაილა","k":"eat","ll":[43.04345,42.72486],"price":"≈80–110 GEL for two with beer or wine; a khachapuri and a beer is about 15 GEL","gbp":"≈£23–31 for two","open":"Tue–Sun 10:00–24:00, Mon 10:00–21:30","win":"D4 evening","mins":90,"d":"The institution on Seti Square — walls covered in visitors' signatures, a big patio, an English menu, and live Svan folk music most evenings from around 20:30. Packed with locals as well as trekkers, and it has kept its prices sane despite that.","go":"Three minutes north-west, on the square. For a Friday that lands at 18:15 this is the default: walk the towers first, eat here at 20:00, catch the music.","dist":"200 m · 3 min walk","tip":"It fills up in the evening — worth putting your head in on the way past to the towers and asking them to hold a table. Reservations: 577 577 677.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g1902860-d5003911-Reviews-Cafe_Laila-Mestia_Upper_Svaneti_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"Facebook","u":"https://www.facebook.com/cafebarLaila.official/"},{"t":"Food Fun Travel · Svaneti cuisine","u":"https://foodfuntravel.com/svaneti-cuisine-what-to-eat-in-mestia-ushguli-mestia-restaurants/"}],"dy":[4]},{"id":"lushnu-qor","n":"Lushnu Qor Restaurant & Beer Garden","n2":"ლუშნუ ქორ","k":"eat","ll":[43.04564,42.73109],"price":"≈70–100 GEL for two with beer","gbp":"≈£20–28 for two","open":"Daily 11:00–24:00","win":"D4 evening only (11:00 opening rules out D5 and D8)","mins":90,"d":"Rustic wood-and-stone place in the upper town with a beer garden, widely called the best kubdari in Mestia — baked in a traditional oven rather than a pan. Also does fetvraal, the green-millet Svan khachapuri you will not find outside the region.","go":"Ten minutes uphill east-north-east, in the Lanchvali direction. It sits neatly on the way back down from the tower walk, so you can chain the two on the Friday evening.","dist":"≈700 m · 10 min walk, uphill","tip":"The oven-baked kubdari takes a while — order it as soon as you sit down.","links":[{"t":"Facebook","u":"https://www.facebook.com/lushnuqor"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04564,42.73109"}],"dy":[4,5,8]},{"id":"erti-kava","n":"ERTI KAVA Coffee Room","n2":"ერთი ყავა","k":"cafe","ll":[43.04331,42.72459],"price":"Coffee 8–10 GEL, breakfast plates roughly 15–25 GEL; ≈50–60 GEL for two with coffee and food","gbp":"≈£14–17 for two","open":"Daily 08:00–21:00 (TripAdvisor; one OSM record says 09:00, but the venue's own listing and reviews agree on 08:00 — worth a glance through the window on the Friday to confirm)","win":"D5 early (from 08:00) · D8 hour","mins":45,"d":"Mestia's specialty coffee bar, on Seti Square itself, ranked #1 of 8 coffee places in town at 4.6/5 from 230+ reviews. Proper espresso, bagels, scrambles, omelettes and a full English, plus a much-praised carrot cake. Reviewers rate the coffee against Tbilisi's best.","go":"Three minutes from the guesthouse, on the west side of Seti Square at No. 5. For D5 it is the sensible 08:00 breakfast; for D8 it is 200 m from where the 4×4 drops you and 100 m from the bus stand, so you can eat and still see the marshrutka arrive.","dist":"200 m · 3 min walk","tip":"Order the bagel and take a second coffee away — it is the last decent coffee before Ushguli.","links":[{"t":"TripAdvisor (#1 coffee in Mestia)","u":"https://www.tripadvisor.com/Restaurant_Review-g1902860-d12310667-Reviews-ERTI_KAVA_Coffee_Room-Mestia_Upper_Svaneti_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"Facebook","u":"https://www.facebook.com/ertikavamestia/"},{"t":"Instagram","u":"https://www.instagram.com/ertikava_coffeeroom/"}],"dy":[5,8]},{"id":"early-coffee-kiosk","n":"Takeaway coffee kiosk by the bus stand (06:45)","k":"cafe","ll":[43.04433,42.7255],"price":"Coffee roughly 5–8 GEL","gbp":"≈£1.40–2.30","open":"Daily 06:45–18:00, takeaway only (OpenStreetMap, surveyed 1 Jan 2025)","win":"D5 early — the only coffee open before 08:00","mins":10,"d":"A small takeaway-only coffee window a few doors from the bus stand and the Spar. Not a destination, but it is the answer to 'what is actually open at 07:00 in Mestia' — nothing else pours coffee for another hour and a quarter.","go":"250 m north-west, on the main street between the Spar and Lile. It is unnamed in the mapping data I could verify, so look for the hatch rather than a sign; if it is shut, Erti Kava and Lile both open at 08:00.","dist":"250 m · 3 min walk","tip":"Honest caveat: the 06:45 opening comes from a surveyed OSM record, not from the business itself. Treat it as likely rather than certain, and have the 08:00 options as plan B.","links":[{"t":"OpenStreetMap node","u":"https://www.openstreetmap.org/node/12467111164"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04433,42.72550"}],"dy":[5]},{"id":"krk-bar","n":"KRK Bar","k":"drink","ll":[43.04447,42.72626],"price":"Beer 8–15 GEL, cocktails 20–30 GEL","gbp":"≈£2.30–8.50 a drink","open":"Evening hours — not verifiable from any source I could confirm, so check the door on the way past","win":"D4 evening","mins":60,"d":"The nearest thing Mestia has to an actual bar rather than a restaurant that serves beer: cocktails, wine and craft beer in a small warm room just off the main street. Be realistic — Mestia's nightlife is three or four rooms, and most drinking happens at restaurant tables with folk musicians in the corner.","go":"250 m north-west on the main street, near the bus stand. A sensible last stop after dinner before an early start.","dist":"250 m · 3 min walk","tip":"If KRK is shut, The Wood (43.04521, 42.72955, ~400 m east) and the Tetnuldi pub further up the valley road are the other two options. None of them is late by British standards and you have a 16.5 km day at 09:00.","links":[{"t":"Evendo · KRK Bar","u":"https://evendo.com/locations/georgia/samegrelo-zemo-svaneti/bar/krk-bar"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04447,42.72626"}],"dy":[4]},{"id":"spar-mestia","n":"Spar supermarket (24 hours) — trail food","n2":"სპარი","k":"market","ll":[43.04433,42.72521],"price":"Two days of trail food for two ≈40–60 GEL","gbp":"≈£11–17","open":"24/7 (a second Spar at 43.04338, 42.72350 and two Nikoras are also 24/7; the Nikora on the square is 08:00–23:00)","win":"D4 late evening · D5 early — buy the night before if you can","mins":25,"d":"Full supermarket on the main street: bread, local sulguni and Svan cheese, cured meat, nuts, dried fruit, chocolate, tinned fish, water. This is where you provision for the trek — beyond Mestia the villages have a shed with biscuits and not much else.","go":"250 m north-west, main street, between Seti Square and the bus stand. Being 24/7 it solves the 07:00 problem outright.","dist":"250 m · 3 min walk","tip":"Buy a bag of Svan salt here as a souvenir — it is a couple of lari and travels better than anything else in Svaneti. Note the general mini-markets in town keep 10:00–20:00 hours; the 24/7 tag applies to Spar and Nikora specifically.","links":[{"t":"SPAR Georgia","u":"https://spargeorgia.com"},{"t":"Facebook · SPAR Georgia","u":"https://facebook.com/SPARGeorgia"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04433,42.72521"}],"dy":[4,5]},{"id":"mestia-atms","n":"ATMs — Basisbank (nearest) and the Seti Square bank row","k":"market","ll":[43.04338,42.72585],"price":"Draw 500–600 GEL for two to cover the whole trek","gbp":"≈£141–170","open":"ATMs 24/7. Branches: Basisbank Mon–Fri 10:00–18:00, Sat 10:00–14:30; Bank of Georgia Mon–Fri 10:00–17:30, Sat 10:00–14:00","win":"D4 evening · D5 early — do it Friday night, not Saturday","mins":15,"d":"The last reliable ATMs before Ushguli. Nothing on the Mestia–Ushguli trek takes cards: guesthouses, the Adishi river crossing horseman and every khachapuri between here and Ushguli are cash only, in small notes. There is a Basis Bank machine 83 m from the guesthouse, a cluster of three 24/7 Bank of Georgia ATMs on the west side of Seti Square (43.04323, 42.72448), Liberty machines nearby and a TBC ATM at 43.04368, 42.72285.","go":"The Basisbank ATM is one minute away, on the main street just north of the guesthouse; the Bank of Georgia row is on Seti Square, three minutes. The staffed Basisbank branch is at 43.04365, 42.72328, about four minutes west.","dist":"100 m · 1 min walk","tip":"Use Basisbank if it is working: it is reported not to charge a withdrawal fee on foreign cards and allows up to 2,000 GEL per withdrawal, against roughly 400 GEL and a 2–5 GEL fee at most other Georgian ATMs. Ask for small notes — nobody in Adishi can change a 200.","links":[{"t":"Caucasus Trekking · Mestia to Ushguli (cash advice)","u":"https://www.caucasus-trekking.com/treks/trek-mestia-to-ushguli"},{"t":"Travelness · Mestia to Ushguli trek (Basis Bank, no foreign-card fee)","u":"https://travelness.com/mestia-to-ushguli-trek"},{"t":"Wander-Lush · Georgia travel budget & ATM limits","u":"https://wander-lush.org/georgia-travel-budget-costs/"}],"dy":[4,5]},{"id":"marshrutka-stand","n":"Marshrutka stand — buses to Zugdidi, Kutaisi, Tbilisi, Batumi","k":"market","ll":[43.04416,42.72593],"price":"Mestia → Zugdidi 40 GEL per person, about 4 hours. A shared taxi is ~300 GEL per car, roughly 3 hours.","gbp":"≈£11.30 pp","open":"Departures through the morning and early afternoon; the Zugdidi services commonly quoted are around 08:00, 10:00–10:30 and early afternoon","win":"D8 hour — this is where the sliver ends","mins":10,"d":"A kerbside stand rather than a station: minibuses for Zugdidi, Kutaisi, Tbilisi and Batumi line up on the main street just north of Seti Square, with a small ticket kiosk at 43.04442, 42.72576 selling seats for all of them. The Ushguli shared taxis and jeeps use the adjacent spot at 43.04418, 42.72563, which is also where your 4×4 from Ushguli will most likely drop you.","go":"200 m north-west of the guesthouse on the main street — a three-minute walk, which is what makes the D8 hour workable at all. Everything you might do in that hour (Erti Kava, Lile, the Spar) is within 100 m of this spot.","dist":"200 m · 3 min walk","tip":"Buy the Zugdidi ticket at the kiosk as soon as the 4×4 drops you at 09:30, then eat. Seats on the Zugdidi run fill up, and having it in hand means you can relax over the meal instead of hovering.","links":[{"t":"Caucasus Trekking · Mestia to Ushguli (transport)","u":"https://www.caucasus-trekking.com/treks/trek-mestia-to-ushguli"},{"t":"OpenStreetMap (surveyed Aug 2025)","u":"https://www.openstreetmap.org/node/6681014751"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=43.04416,42.72593"}],"dy":[8]},{"id":"svaneti-museum","n":"Svaneti Museum of History and Ethnography","n2":"სვანეთის ისტორიისა და ეთნოგრაფიის მუზეუმი","k":"museum","ll":[43.04116,42.72654],"price":"Officially 7 GEL adult on the Georgian National Museum site, but 2025–26 visitors consistently report being charged 10 GEL and some 20 GEL. Budget 20 GEL each to be safe. Guided tour +10 GEL.","gbp":"≈£2.00–5.65","open":"Tuesday–Sunday 10:00–18:00, closed Mondays (one source lists a 17:30 close — either way it opens at 10:00)","win":"Fits NONE of your three windows — see below","mins":90,"d":"Genuinely one of the best museums in Georgia: six halls, ~4,000 objects, 9th–12th century illuminated gospels including the Adishi Gospels of 897, Byzantine and Syrian metalwork, and a superb collection of Svan icons and chased silver. Nominated for European Museum of the Year in 2016.","go":"250 m south-west of the guesthouse, up the slope past the school. The arithmetic is the problem, not the walk: it opens at 10:00, your 4×4 lands at 09:30 and your marshrutka leaves at 10:30, so you would get twenty minutes in a museum that deserves ninety and would risk the bus. On D4 you arrive at 18:15 and it shuts at 18:00; on D5 you leave at 09:00. Skip it, and put it on the list for a return trip.","dist":"250 m · 4 min walk","tip":"Entry price is the one figure I could not pin down — the official 7 GEL and the reported 20 GEL are three years apart. Irrelevant to you this trip, but worth knowing the museum's own website is out of date.","links":[{"t":"TripAdvisor (4.7/5, 294 reviews)","u":"https://www.tripadvisor.com/Attraction_Review-g1902860-d6474768-Reviews-Svaneti_Museum_of_History_and_Ethnography-Mestia_Upper_Svaneti_Samegrelo_Z.html"},{"t":"Svaneti.org","u":"https://svaneti.org/en/destinations/svaneti-museum-of-history-and-ethnography"}],"fit":0,"dy":[4,5,8]},{"id":"margiani-house-museum","n":"Margiani House Museum","n2":"მარგიანების სახლ-მუზეუმი","k":"museum","ll":[43.04924,42.73228],"price":"10 GEL, cash only","gbp":"≈£2.80","open":"Tuesday–Sunday 10:00–18:00, closed Mondays (winter hours vary)","win":"Fits none of the three windows — 10:00 opening","mins":60,"d":"The best preserved machubi (traditional Svan house) open to the public: the winter room with its open hearth, wooden thrones and animal stalls under the same roof, plus a seven-storey defensive tower you climb by internal wooden stairs. The caretaker doubles as guide.","go":"Uphill on Lanchvali St, a stiff 40–45° final stretch. Only worth it if you have a half day, which you do not. Included so you can rule it out knowingly rather than discover it shut.","dist":"≈1.2 km · 20 min walk, steep at the end","tip":"If you want the machubi-and-tower experience inside your windows, Niguriani Tower Museum (opens 09:00, 5 GEL, closer) is the substitute.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g1902860-d17840295-Reviews-Margiani_s_House_Museum-Mestia_Upper_Svaneti_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"Svaneti.org","u":"https://svaneti.org/en/destinations/margiani-s-house-museum"}],"fit":0,"dy":[4,5,8]},{"id":"mestia-cross","n":"The Cross above Mestia (Tskhakazagari)","n2":"მესტიის ჯვარი","k":"view","ll":[43.05949,42.72342],"price":"Free","gbp":"Free","open":"April–November, daylight only","win":"Fits none of the three windows — do not attempt it","mins":240,"d":"The classic Mestia viewpoint: a metal cross and platform on the ridge north of town with Ushba, Tetnuldi and the whole Mulakhi valley laid out below.","go":"8.4 km round trip, about 4 hours, 680 m of climb, mostly through forest before the alpine section. The trailhead is roughly 1 km north of the guesthouse. This does not fit an 80-minute evening, a two-hour breakfast slot or a one-hour bus wait, and it is unlit — do not start it on the Friday. Listed so it can be crossed off with confidence.","dist":"8.4 km round trip · 4 hours","links":[{"t":"Caucasus Trekking · Best day hikes around Mestia","u":"https://www.caucasus-trekking.com/regions/svaneti/best-day-hikes-around-mestia"},{"t":"Transcaucasian Trail · Day hikes from Mestia","u":"https://transcaucasiantrail.org/en/hike/upper-svaneti-georgia/day-hikes-from-mestia/"}],"fit":0,"dy":[4,5,8]},{"id":"hatsvali-chairlift","n":"Hatsvali chairlift & Zuruldi gondola","n2":"ჰაწვალი / ზურულდი","k":"view","ll":[43.03923,42.73027],"price":"About 25 GEL return for the full ride to Zuruldi (one source quotes 20 GEL)","gbp":"≈£5.65–7.00","open":"Summer season roughly mid-June to September. Reported hours vary between 10:00–16:30 and 11:00–16:00, and it does not run in rain or fog.","win":"Fits none of the three windows — earliest start is 10:00 at best","mins":180,"d":"Two stages — a six-seat chairlift from the southern edge of town up to Hatsvali at 1,865 m, then a gondola on to Zuruldi ridge at ~2,340 m, where there is a terrace restaurant and a near-flat 6 km ridge walk with Ushba straight ahead. The easiest big view in Svaneti when it runs.","go":"The lower station sits on the south edge of town below the Svaneti Museum, about 10 minutes' walk. But the earliest reported start is 10:00 and the ride plus any walk is a half-day: it cannot be squeezed into the Friday evening (shut), the Saturday 07:00–09:00 slot (shut) or the Tuesday hour (you would still be going up when the bus leaves).","dist":"≈700 m · 10 min walk to the lower station","tip":"Opening dates slip badly — in 2026 the lift reportedly did not open until 8 August. If a future trip depends on it, ask at the Tourist Information Centre on Seti Square the day before, they know whether it is actually turning.","links":[{"t":"Caucasus Trekking · Mestia to Zuruldi","u":"https://www.caucasus-trekking.com/treks/zuruldi"},{"t":"Trip.com · Hatsvali Cable Car","u":"https://www.trip.com/travel-guide/attraction/mestia/hatsvali-cable-car-mestia-137034379/"},{"t":"Madloba · lower station","u":"https://madloba.info/en/mestia/transport/kanatnaia-doroga-khatsvali-nizhniaia-stantsiia/"}],"fit":0,"dy":[4,5,8]}]},"zhabeshi":{"n":"Zhabeshi","anchor":[43.04718,42.86796],"anchorName":"Guest House Tengo","days":[5],"win":"Sat afternoon & evening, from 15:30","note":"Zhabeshi is a working farming hamlet of about 90 people at roughly 1,650-1,680 m, where the Mulkhura valley narrows under Tetnuldi (4,852 m). There is no shop, no cafe, no bar, no museum and nothing ticketed: the guesthouses are the entire economy. Honestly, the whole of Zhabeshi is about four things - an 11th-century Church of the Saviour on a knoll at the edge of the village, a thin scattering of Svan towers among the farmhouses (this is NOT one of Svaneti's great tower villages; Monkey's Tale flatly says it 'doesn't have many Svan Towers'), cow-lane strolls along the river, and a 20-30 minute climb up the start of Sunday's trail for the evening light on Tetnuldi. Then a very large guesthouse supper. Sunset on 5 Sep 2026 is about 19:38 with usable light to roughly 20:05, so arriving at 15:30 there are four good hours - but they have just walked 16.5 km and climb 992 m out of the village at dawn, so the correct plan is deliberately small. Two bigger things exist and are NOT doable in this window: the Zhabeshi Lamaria (Virgin Mary) church at 2,230 m is a 10 km round trip with 950 m of ascent and takes 5-6 hours, and the Tviberi glacier day hike is 6-7 hours. The Tetnuldi ski resort base is 1.5-2 hours uphill and its cable cars are generally shut in summer.","items":[{"id":"zhabeshi-savior-church","n":"Zhabeshi Church of the Saviour (Matskhvari)","k":"monument","ll":[43.0472,42.8675],"price":"Free","gbp":"Free","open":"Always (exterior); interior usually locked","win":"D5 afternoon","mins":30,"d":"A 10th-11th century hall-type church of hewn travertine standing on a raised hill at the edge of the village, elongated east-west with a triangular apse. Inside is a wooden cross on stone pedestals before a three-tiered stone iconostasis, and fragments of 12th-century fresco painting that have barely survived. Its gilded silver icon of St George and leather-bound gospel are gone, but a silver ritual spoon and two gold-plated silver trays are still recorded as held here.","go":"Walk out of the guesthouse into the village lanes and look for the low knoll at the village edge - it is the obvious raised ground with the stone building on it.","dist":"0-400 m from the guesthouse, 5 min","tip":"Assume it is locked. Ask Tengo whether anyone in the village keeps the key; in Svaneti a church is usually opened by one family and asking politely at the guesthouse is the only way in.","links":[{"t":"Georgia.Travel - Zhabeshi Church","u":"https://georgia.travel/zhabeshi-church"},{"t":"Georgian Travel Guide - Zhabeshi","u":"https://georgiantravelguide.com/en/zhabeshi"},{"t":"Georgia.Travel - Mestia to Zhabeshi","u":"https://georgia.travel/hiking-mestiya-zabesi"}],"dy":[5]},{"id":"zhabeshi-towers","n":"The Svan towers of Zhabeshi","k":"monument","ll":[43.0472,42.8675],"price":"Free","gbp":"Free","open":"Always","win":"D5 afternoon","mins":30,"d":"Zhabeshi has Svan defensive towers standing among its farmhouses, most of the type built between the 9th and 12th centuries as family refuges against raids. Be realistic: this is a handful of towers scattered through a working village, not the dense forest of them at Ushguli or Chazhashi, and one guide describes Zhabeshi as a place that 'doesn't have many Svan Towers, but it has a lovely pastoral setting along the river'. Caucasus Trekking's route notes reference 'the last house and tower of the village' at the top end, which is where tomorrow's trail begins.","go":"They are the village - just walk the lanes. The uppermost tower is at the top (south) end where the stream runs through.","dist":"0-500 m, all within a 10 min walk","tip":"Walk up to the last tower at the south end of the village this afternoon. It is the exact point where Sunday's trail leaves, so it doubles as a recce and saves fumbling in the dark at 07:00.","links":[{"t":"Monkey's Tale - Mestia to Ushguli guide","u":"https://monkeystale.ca/2025/10/24/mestia-to-ushguli-trekking-guide/"},{"t":"Caucasus Trekking - Mestia to Ushguli","u":"https://www.caucasus-trekking.com/treks/trek-mestia-to-ushguli"},{"t":"UNESCO - Upper Svaneti","u":"https://whc.unesco.org/en/list/709/"},{"t":"Wikipedia - Svan towers","u":"https://en.wikipedia.org/wiki/Svan_towers"}],"dy":[5]},{"id":"zhabeshi-mulkhura-river","n":"The Mulkhura river, meadows and village lanes","k":"nature","ll":[43.04718,42.86796],"price":"Free","gbp":"Free","open":"Always","win":"D5 late afternoon","mins":45,"d":"Zhabeshi sits on the bank of the Mulkhura (Mulkhra), the right tributary of the Enguri, and the flat ground either side of it is the village's one easy walk: hay meadows, old wooden fences, a concrete road following the water, cows coming in, and the slopes of Tetnuldi filling the head of the valley. Wander-Lush calls it 'an alpine feel, with rolling green hills and little cottages'. Zero ascent, which after 16.5 km is the whole point.","go":"Downhill (north) from the guesthouse to the river, then follow the bank in either direction. The bridge south of Cholashi is the one the trail came in over.","dist":"100-300 m to the water; wander as far as you like","tip":"This is the flattest thing available and the legs will thank you. Take it slowly and turn round when the light goes off the tops.","links":[{"t":"Wander-Lush - Svaneti itinerary","u":"https://wander-lush.org/things-to-do-in-svaneti-itinerary/"},{"t":"Georgian Travel Guide - Zhabeshi","u":"https://georgiantravelguide.com/en/zhabeshi"},{"t":"Georgia.to - Zhabeshi","u":"https://georgia.to/en/places-to-go/samegrelo-zemo-svaneti/zhabeshi/"}],"dy":[5]},{"id":"zhabeshi-evening-viewpoint","n":"Evening climb up the Adishi trail for Tetnuldi light","k":"view","ll":[43.0472,42.8675],"price":"Free","gbp":"Free","open":"Daylight","win":"D5 ~18:00-19:30","mins":60,"d":"The Zhabeshi-Adishi trail leaves the top of the village, crosses the stream by the last house and tower, and immediately starts climbing south-east over pastures. Twenty to thirty minutes up you are clear of the roofs with the whole Mulkhura valley behind you and Tetnuldi, Banguriani and (further west) Ushba catching the last sun. One trip report describes exactly this as a 'short sunset walk... watching the sun set over a fairy-tale meadow'. Go up as far as feels good and come straight back down.","go":"Walk uphill (south) along the stream through the village to the last house and tower, cross the stream, follow the path west past the tower, then take the marked left turn signposted Adishi and climb.","dist":"About 1 km and 100-150 m of ascent to a good vantage; 45-60 min return","tip":"Sunset on 5 Sep 2026 is around 19:38 and it is properly dark by about 20:05. Leave by 18:15 at the latest and carry a head torch - the last stretch back through the village lanes is unlit and full of cow traffic.","links":[{"t":"Caucasus Trekking - Mestia to Ushguli (Day 2 route)","u":"https://www.caucasus-trekking.com/treks/trek-mestia-to-ushguli"},{"t":"Packing Up The Pieces - Mestia to Ushguli","u":"https://www.packing-up-the-pieces.com/mestia-to-ushguli-trek-guide-tsvirmi/"},{"t":"Georgia.Travel - Mestia to Zhabeshi","u":"https://georgia.travel/hiking-mestiya-zabesi"},{"t":"Georgian Tour Adviser - Around Mulakhi (longer Lamaria & Tviberi routes)","u":"https://georgiantour.com/mulakhi/"}],"dy":[5]},{"id":"zhabeshi-supra","n":"Svan supper at Guest House Tengo","k":"eat","ll":[43.04718,42.86796],"price":"Dinner ~25-35 GEL; bed + dinner + breakfast typically 50-80 GEL pp","gbp":"Dinner ~£7-10; full board ~£14-23","open":"Dinner usually served ~19:00-20:00","win":"D5 evening","mins":90,"d":"The guesthouse dinner is the only food in Zhabeshi and it is the real event of the evening: a table loaded with kubdari (Svan meat bread), chvishtari (cheese cornbread), Svan salt potatoes, lobio, pickles and salads, usually with the host's own chacha or wine appearing. Guests at Tengo repeatedly describe 'a very generous dinner, perhaps the best they had in Svaneti'. A comparable Zhabeshi guesthouse (Tanano) quotes 50-55 GEL per person for a twelve-dish dinner with tea and coffee free, so there is a spread depending on how much you order.","go":"You are sleeping there. Confirm dinner and the price when you arrive at 15:30, not at 19:00.","dist":"0 m","tip":"Confirm the dinner price on arrival, and order breakfast plus a packed lunch for Sunday at the same time - there is nowhere to buy food between here and Adishi except a seasonal hut cafe on the ski road, and nothing at all in Adishi.","links":[{"t":"Guest House Tengo on Booking.com","u":"https://www.booking.com/hotel/ge/guest-house-tengo-zhabeshi.html"},{"t":"The Sandy Feet - Mestia to Ushguli (50 GEL half board)","u":"https://thesandyfeet.com/mestia-ushguli-trek-svaneti-georgia/"},{"t":"Monkey's Tale - 2025 meal prices","u":"https://monkeystale.ca/2025/10/24/mestia-to-ushguli-trekking-guide/"}],"dy":[5]},{"id":"zhabeshi-no-shop","n":"Supplies: there is effectively no shop in Zhabeshi","k":"market","ll":[43.04718,42.86796],"price":"n/a","gbp":"n/a","open":"n/a","win":"D5 - plan before leaving Mestia","mins":10,"d":"No source found any shop in Zhabeshi, and trek guides are consistent that there are 'hardly any shops... from Mestia to Ushguli' and that all food on this trek comes from guesthouses. If there is a village kiosk it is somebody's front room, unsigned and unreliable. Snacks, batteries, blister plasters, sun cream and cash all have to come from Mestia. There is no ATM here and no ATM again until Ushguli.","go":"Nothing to go to. Ask Tengo if you are desperate - hosts will often sell you beer, eggs or bread out of their own kitchen.","dist":"n/a","tip":"Carry enough small-denomination lari cash for the whole trek: guesthouses, the horse river crossing beyond Adishi (20-30 GEL pp) and the Adishi bar are all cash only.","links":[{"t":"Real Talk Travel - Mestia to Ushguli cost breakdown","u":"https://realtalktravel.com/cost-mestia-to-ushguli-hike/"},{"t":"Going the Whole Hogg - Svaneti TCT guide","u":"https://www.goingthewholehogg.com/transcaucasian-trail-svaneti-mestia-to-ushguli/"},{"t":"Caucasus Trekking - Mestia to Ushguli","u":"https://www.caucasus-trekking.com/treks/trek-mestia-to-ushguli"}],"dy":[5]}]},"adishi":{"n":"Adishi","anchor":[42.99579,42.92134],"anchorName":"Guest House River Side","days":[6],"win":"Sun afternoon & evening, from 14:30","note":"Adishi (2,040 m, 27 km from Mestia) is the remotest village on the trek and by some distance the more rewarding of these two. The 2014 census counted 44 people; before tourism only four families lived here, and now 10-12 families are in residence over the summer, all of them running guesthouses, cooking for hikers or ferrying them across the river on horses. There is no shop, no ATM and barely any phone signal, and a good part of the village is half-ruined - an avalanche destroyed many of the buildings and it was only slowly rebuilt. What Adishi does have is real: about a dozen genuine medieval Svan towers in one of the least modernised villages in Svaneti, four small hall-type churches from the 10th-13th centuries (the village that produced the Adishi Gospels of AD 897), a knoll north of the village with the best view in the place, a shed-sized seasonal 'bar' selling fridge beer, and the Adishchala valley running east under the Adishi glacier. That valley walk is the single best free thing on this whole itinerary. Arriving 14:30 with sunset at 19:36 and dark by 20:05 gives about five hours of light - enough, but the village sits in a basin so direct sun leaves the valley floor well before sunset.","items":[{"id":"adishi-towers","n":"The Adishi tower cluster","k":"monument","ll":[42.99639,42.91472],"price":"Free","gbp":"Free","open":"Always","win":"D6 afternoon","mins":45,"d":"About a dozen medieval Svan towers stand among the stone houses, and because tourism reached Adishi so late this is one of the least modernised tower villages left in Upper Svaneti - no new concrete, no rendered facades, cows and pigs in the lanes. Guides describe arriving 'from above so you can look down onto its dozen towers' and the village as 'little more than a few towers and houses, set inside a natural amphitheatre'. Nothing is signed, ticketed or staffed; you simply walk among them.","go":"Walk west and uphill from River Side into the village core - the towers are the village.","dist":"About 500 m, 7 min","tip":"Adishi photographs best in golden hour; one guide notes it 'looks particularly impressive with a golden hour glow'. Do the towers between about 18:00 and 19:15 rather than on arrival, and do the valley walk first.","links":[{"t":"Wikipedia - Adishi (village)","u":"https://en.wikipedia.org/wiki/Adishi_(village)"},{"t":"Svaneti.org - Adishi","u":"https://svaneti.org/en/destinations/adishi"},{"t":"Going the Whole Hogg - Svaneti TCT guide","u":"https://www.goingthewholehogg.com/transcaucasian-trail-svaneti-mestia-to-ushguli/"},{"t":"UNESCO - Upper Svaneti","u":"https://whc.unesco.org/en/list/709/"}],"dy":[6]},{"id":"adishi-churches","n":"Adishi's four medieval churches","k":"monument","ll":[42.99639,42.91472],"price":"Free","gbp":"Free","open":"Exteriors always; interiors normally locked","win":"D6 afternoon","mins":40,"d":"Adishi has four small hall-type churches, all of them medieval: the Church of the Saviour / Deliverer (10th-11th century, with 12th-century master painting preserved inside), two churches of St George (11th-12th century, with painted cycles of the saint's life), and the Church of the Archangel (12th-13th century, with frescoes). This is also the village that gave its name to the Adishi (Adysh) Gospels of AD 897, the oldest dated surviving manuscript of the Georgian Gospels, which was kept here for centuries - though it is now in the Svaneti Museum of History and Ethnography in Mestia, so you cannot see it here.","go":"All within the village core, uphill and west of the guesthouse; one of them stands on the knoll north of the village.","dist":"300-700 m, 5-10 min","tip":"Expect locked doors. Ask at River Side whether anyone holds a key - with 10-12 families in the village somebody does, and an afternoon request has a far better chance than an evening one. Do not expect a caretaker, a sign or a light inside.","links":[{"t":"Wikipedia - Adishi (village)","u":"https://en.wikipedia.org/wiki/Adishi_(village)"},{"t":"Svaneti.org - Adishi churches","u":"https://svaneti.org/en/destinations/adishi"},{"t":"Georgia.Travel - Adishi","u":"https://georgia.travel/villages/adishi"},{"t":"Wikipedia - Adysh Gospels","u":"https://en.wikipedia.org/wiki/Adysh_Gospels"}],"dy":[6]},{"id":"adishi-ruins","n":"The abandoned and half-ruined houses","k":"sight","ll":[42.99639,42.91472],"price":"Free","gbp":"Free","open":"Always","win":"D6 afternoon","mins":30,"d":"A large part of Adishi is empty. It is 'a pretty, atmospheric place in a spectacular location which was slowly rebuilt after an avalanche had destroyed many buildings', and the population never recovered - 44 people at the 2014 census, four resident families before tourism arrived, 10-12 in summer now. Roofless houses, collapsed byres and towers standing over nothing are simply part of walking around, and they are the honest reason the village feels the way it does. One guide is blunt that up close, 'between the cows leaving cow pies on the muddy roads and the shabby homes, it quickly lost its appeal' - which is a fair warning that this is a poor working hamlet, not a preserved museum village.","go":"Interleaved with the inhabited houses throughout the village core, especially at the upper and outer edges.","dist":"300-800 m","tip":"They are people's property and some are structurally unsafe. Look, photograph from the lane, do not climb into anything.","links":[{"t":"Frugal Travellers - Mestia to Ushguli","u":"https://frugaltravellers.com/mestia-to-ushguli-trek/"},{"t":"Wikipedia - Adishi (village)","u":"https://en.wikipedia.org/wiki/Adishi_(village)"},{"t":"Monkey's Tale - Mestia to Ushguli guide","u":"https://monkeystale.ca/2025/10/24/mestia-to-ushguli-trekking-guide/"}],"dy":[6]},{"id":"adishi-glacier-walk","n":"Up the Adishchala valley to the Adishi Glacier","k":"nature","ll":[43.01,42.99],"price":"Free","gbp":"Free","open":"Daylight; snow-free roughly June-October","win":"D6 from ~15:00","mins":150,"d":"The big one, and it is genuinely big. A path leaves the village heading east and follows the Adishchala river up an almost flat glacial plain, with the Adishi glacier (9 km long, 12.9 sq km, tongue at 2,298 m) filling the head of the valley and Tetnuldi above it the whole way. The full out-and-back to the glacier snout is logged on AllTrails as 8 miles / 12.9 km with 1,122 ft / 342 m of gain, moderate, 3.5-4 hours. The much saner half version is to walk the flat 4 km to the point where the trail meets the river - Caucasus Trekking times this at 'after one hour, the path ends in a river' and the Transcaucasian Trail confirms 'after approximately 4 km, it intersects the river' - then turn round. That is roughly 8 km round trip, about 100 m of ascent, 2 to 2.5 hours, and you already have the full glacier view from there.","go":"From River Side, pick up the path heading east out of the village along the north bank of the Adishchala and simply follow the river upstream on the flat. It is the same path you leave on at 07:30 tomorrow.","dist":"Snout is ~5.8 km straight line ENE of the guesthouse, ~6.4 km by the trail; the river ford is ~4 km / ~1 hour","tip":"Do the short version. Turn round at the ford. It is flat, it costs nothing, it gives the whole glacier, and it is a free recce of tomorrow's river crossing so you know exactly what you are walking into at 07:30. Going all the way to the snout is physically possible in daylight (back around 18:30-19:00) but is a bad trade before a 27 km day over Chkhutnieri Pass. Do NOT ford the river this afternoon - the water is at its highest in the afternoon because of glacier melt and lowest early morning.","links":[{"t":"AllTrails - Adishchala River (12.9 km, 342 m, 3.5-4 h)","u":"https://www.alltrails.com/trail/georgia/samegrelo-zemo-svaneti/adishchala-river"},{"t":"Transcaucasian Trail - Adishi to Ushguli (PDF)","u":"https://transcaucasiantrail.org/wp-content/uploads/2024/02/Adishi-to-Ushguli.pdf"},{"t":"Caucasus Trekking - Adishi to Ushguli","u":"https://www.caucasus-trekking.com/treks/adishi-to-ushguli-by-khalde-glacier"},{"t":"Wikipedia - Adishi Glacier","u":"https://en.wikipedia.org/wiki/Adishi_Glacier"},{"t":"Wikiloc - Adishi glacier track","u":"https://www.wikiloc.com/hiking-trails/adishi-glacier-18103831"}],"dy":[6]},{"id":"adishi-church-knoll-view","n":"The church knoll north of the village","k":"view","ll":[42.99639,42.91472],"price":"Free","gbp":"Free","open":"Daylight","win":"D6 ~18:30-19:30","mins":40,"d":"The small hill just north of the village, with a church on top, is the local viewpoint: from it you look back down over the towers and roofs and straight up the valley to the glacier hanging above. It is described in guides as the great spot in Adishi, and it is a short, gentle rise rather than a climb - the only real 'attraction' walk in the village and the obvious place to be as the light goes.","go":"From River Side head west into the village, then north up the obvious grassy rise with the stone chapel on it.","dist":"600-800 m and maybe 50 m of ascent; 15 min up","tip":"Best thing to combine with the towers at golden hour. Sunset on 6 Sep 2026 is about 19:36, but Adishi sits in a basin so the sun leaves the village floor a good while before that - be up there by 18:45.","links":[{"t":"Take Your Backpack - Upper Svaneti guide","u":"https://www.takeyourbackpack.com/backpacking-in-georgia/visit-upper-svaneti/"},{"t":"Svaneti.org - Adishi","u":"https://svaneti.org/en/destinations/adishi"},{"t":"Going the Whole Hogg - Svaneti TCT guide","u":"https://www.goingthewholehogg.com/transcaucasian-trail-svaneti-mestia-to-ushguli/"}],"dy":[6]},{"id":"adishi-river-bridge","n":"The Adishchala river and the bridge below the village","k":"nature","ll":[42.99579,42.92134],"price":"Free","gbp":"Free","open":"Always","win":"D6 mid-afternoon","mins":30,"d":"The Adishchala runs straight off the Adishi glacier and past the bottom of the village, which is what River Side is named for. There is a wooden bridge over the stream below the village where trekkers stop; one group describes bathing in the 'freezing cold mountain stream' and then doing yoga on the bridge. It is grey glacial meltwater and it is genuinely painful, but a ten-minute leg soak after 11.9 km and 909 m of ascent does more for tomorrow than anything else here.","go":"Straight downhill from the guesthouse to the water - it is a two-minute walk.","dist":"50-200 m, 2-3 min","tip":"Feet and calves only, ten minutes maximum, and do it in daylight while it is still warm out. Do not attempt to cross - the ford is 4 km upstream and the afternoon is the worst time of day for water level.","links":[{"t":"Frugal Travellers - Mestia to Ushguli","u":"https://frugaltravellers.com/mestia-to-ushguli-trek/"},{"t":"Wikipedia - Adishi Glacier (source of the Adishchala)","u":"https://en.wikipedia.org/wiki/Adishi_Glacier"}],"dy":[6]},{"id":"adishi-supra","n":"Guesthouse supper at River Side","k":"eat","ll":[42.99579,42.92134],"price":"Dinner ~20-35 GEL; bed + dinner + breakfast commonly 50 GEL pp","gbp":"Dinner ~£6-10; full board ~£14","open":"Dinner usually ~19:00-20:00","win":"D6 evening","mins":90,"d":"The only food in Adishi. Trekkers consistently report 'copious portions of great Georgian food', 'massive' servings and long communal tables where everyone walking the trek in both directions ends up together, often with the host's home-made wine and chacha going round. One detailed breakdown gives bed 15 GEL, dinner 20 GEL and breakfast 15 GEL for 50 GEL a day; 2025 reports put dinner nearer 30-35 GEL. Expect kubdari, chvishtari, Svan salt potatoes, beans and cheese.","go":"You are staying there.","dist":"0 m","tip":"Order breakfast early and a packed lunch for Monday when you check in - the Adishi-Ushguli day is 28.8 km with 1,424 m of ascent and there is nothing to buy on it. Also settle the horse river crossing tonight if you want one: 20-30 GEL per person, cash, and locals wait at the ford in season.","links":[{"t":"Frugal Travellers - Mestia to Ushguli (price breakdown)","u":"https://frugaltravellers.com/mestia-to-ushguli-trek/"},{"t":"Packing Up The Pieces - Adishi guesthouse 50 GEL","u":"https://www.packing-up-the-pieces.com/mestia-to-ushguli-trek-guide-tsvirmi/"},{"t":"Monkey's Tale - 2025 dinner prices","u":"https://monkeystale.ca/2025/10/24/mestia-to-ushguli-trekking-guide/"},{"t":"Transcaucasian Trail - Adishi to Ushguli (PDF)","u":"https://transcaucasiantrail.org/wp-content/uploads/2024/02/Adishi-to-Ushguli.pdf"}],"dy":[6]},{"id":"adishi-bar","n":"The little bar at the top of the village","k":"drink","ll":[42.99639,42.91472],"price":"Beer roughly 8-15 GEL, soft drinks ~5 GEL - overpriced for Georgia","gbp":"Beer ~£2.30-4.20; soft drinks ~£1.40","open":"Summer only, sporadic - may simply be shut","win":"D6 late afternoon","mins":60,"d":"The one commercial thing in Adishi: a tiny bar/kiosk at the top of the village with 'a modest and fairly over-priced selection of beers and basic snacks', which 'becomes a popular hangout for locals and hikers alike in the afternoons'. Another trekker describes 'a small bar nearby selling drinks where we spent a few hours hanging out with other trekkers and locals around a bonfire. Don't expect much beyond beer and soft drinks from a fridge.' It is not a cafe and not a shop - it is a fridge, a few chairs and sometimes a fire.","go":"Uphill through the village to the top end; it is unmistakable because it is the only one.","dist":"About 600-800 m, 10 min uphill","tip":"Genuinely seasonal and genuinely unreliable - several guides describe it as operating 'sporadically'. Treat it as a bonus, not a plan, and bring cash in small notes. This is also the closest Adishi gets to a shop, so do not count on buying tomorrow's snacks here.","links":[{"t":"The Sandy Feet - Mestia to Ushguli trek guide","u":"https://thesandyfeet.com/mestia-ushguli-trek-svaneti-georgia/"},{"t":"Musafir in Transit - Mestia to Ushguli","u":"https://musafirintransit.com/mestia-to-ushguli/"}],"dy":[6]}]},"ushguli":{"n":"Ushguli · Chazhashi","anchor":[42.91479,43.00842],"anchorName":"Old House, Chazhashi","days":[7,8],"win":"Mon 17:30–dark · Tue 06:00–07:00","note":"Verified for 42.91479 N, 43.00842 E, Asia/Tbilisi UTC+4 (Georgia has no DST): Mon 7 Sep sunset 19:33, civil dusk ends 20:01, properly dark ~20:36. Tue 8 Sep civil dawn 06:11, sunrise 06:39. Cross-checked against the sunrise-sunset.org API — both agree to within two minutes. Terrain moves both, though. From Chazhashi the sun drops behind the ridge down-valley at roughly 19:05–19:10, so D7 gives about 95 minutes of real light from 17:30, then 50 minutes of afterglow. That is one uphill trip, not two: either Lamaria (1.3 km, +73 m, 25 min each way) or Queen Tamar's castle (+190 m, 40 min up, and the only place in Ushguli still in sun at 19:20). The Chazhashi tower ensemble and its two churches are free, floodlit by low sun and literally 50–150 m from the door — do those regardless. The museum shuts at 18:00 on paper and is closed as often as not, so it is a lottery, not a plan. D8 is not sunrise in any useful sense: the Svaneti Range sits 3 km east and stands 13–21° above the horizon, so no direct sun reaches the village until roughly 08:00, an hour after the jeep goes. What 06:00–07:00 actually buys is blue hour from 06:11 and then, from about 06:35–06:50, first light burning onto the top of Shkhara (5,203 m, 12.6 km NE) while the towers below stay in cold blue shadow. That is the photograph of the trip and it needs nothing more than the walk up to the Lamaria knoll. Nothing is open. 1 GEL ≈ £0.283 (31 Aug 2026).","items":[{"id":"chazhashi-towers","n":"Chazhashi Tower Ensemble","n2":"ჩაჟაში","k":"monument","ll":[42.91457,43.01003],"price":"Free","gbp":"Free","open":"Open street, always — it is a lived-in village, not a site","win":"D7 evening (and again at first light D8)","mins":45,"d":"The UNESCO-listed core of Upper Svaneti and the densest surviving koshki cluster anywhere: 9th–12th c. defensive tower-houses of three to five storeys grafted onto the family machubi, protected as the Ushguli–Chazhashi Museum-Reserve since 1971. Wikipedia counts 13 well-preserved towers in Chazhashi itself; the Ushguli community as a whole has over 200. Only 28 people were living here at the 2014 census.","go":"Step out of Old House and turn left, east, along the lane. The towers begin immediately: Ghuta Nizharadze's house is 30 m away, the tower now used as Nizharadze's Tower guesthouse 60 m, the ruined tower stumps and the Chazhashi information board within 100 m. Keep going east 150 m and you are at the crossroads with the churches and the museum tower.","dist":"0–200 m · on the doorstep, flat","tip":"This is the one thing that costs no legs. Low western sun at 18:15–19:05 rakes straight down the lane and makes the slate walls glow — it is the best light the towers get all day. Note that people live here: no drones, no walking into yards.","links":[{"t":"UNESCO","u":"https://whc.unesco.org/en/list/709/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Chazhashi"},{"t":"Svan towers","u":"https://en.wikipedia.org/wiki/Svan_towers"},{"t":"Wander-Lush","u":"https://wander-lush.org/visit-ushguli-georgia-travel-guide/"}],"dy":[7,8]},{"id":"ushguli-museum","n":"Ushguli Ethnographic Museum","n2":"ეთნოგრაფიული მუზეუმი","k":"museum","ll":[42.91454,43.00898],"price":"5 GEL (reports range 3–10 GEL) · cash only","gbp":"≈ £1.40","open":"Posted 10:00–18:00 Tue–Sun — but very widely reported shut, including by visitors arriving mid-afternoon","win":"D7 evening — 30 min at absolute best, probably shut","mins":30,"d":"Housed inside one of the Chazhashi towers by the crossroads: a machubi interior laid out as a Svan family home with the beast-stalls, hearth and carved beds, plus repoussé metalwork, processional crosses, icons, weaving gear and archive photographs. Gallop Around The Globe and Trip.com both give 5 GEL and 10:00–18:00 Tue–Sun; Wander-Lush was quoted 10 GEL and found it locked every time; a Czech account gives 3 GEL for a separate Ushguli Historical Museum in the same tower cluster.","go":"East along the lane from Old House about 50 m to the tower with the sign, on the right at the Chazhashi crossroads. You will walk past it within a minute of dropping your bag.","dist":"50 m · 1 min","tip":"Arriving 17:30 you have half an hour before the posted close. Try the door on the way past before you sit down, because once you sit down you will not get up. There is a second, unnamed ethnographic house-museum up near Lamaria in Zhibiani (42.91797, 43.01644) run by an elderly local woman, 5–10 GEL — also unreliable, and definitely shut at dawn.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g6888424-d12440670-Reviews-Ushguli_Ethnographic_Museum-Ushguli_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"Georgia.travel","u":"https://georgia.travel/ushguli-ethnographic-museum"},{"t":"Gallop Around The Globe","u":"https://galloparoundtheglobe.com/a-day-trip-to-ushguli-svaneti-the-highest-permanently-inhabited-settlement-in-europe/"}],"dy":[7]},{"id":"chazhashi-churches","n":"Chazhashi Church of the Saviour & St George","n2":"მაცხვარიშის მაცხოვრის ეკლესია","k":"monument","ll":[42.91476,43.00922],"price":"Free","gbp":"Free","open":"Exteriors always; interiors usually locked, ask a neighbour","win":"D7 evening","mins":20,"d":"Two small slate churches sit inside the Chazhashi tower cluster: the Church of the Saviour (Matskvarishi) at 42.91476, 43.00922 and the tiny 10th-century St George / kari church built into a tower 100 m further east at 42.91470, 43.01017, which forms part of the Tamar castle complex. Both are 10th–12th c. and both are inside the UNESCO inscription.","go":"Continue 70 m east from Old House past the museum tower; the Saviour is on the left among the houses, St George another 100 m on at the eastern end of the hamlet.","dist":"70–150 m · 2–3 min","tip":"Free, thirty seconds from the door and takes twenty minutes. If the museum is shut this is the consolation prize, and the low light on the slate is better anyway.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Chazhashi"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91476&mlon=43.00922#map=18/42.91476/43.00922"}],"dy":[7]},{"id":"queen-tamar-castle","n":"Queen Tamar's Castle (Ushguli Castle)","n2":"უშგულის ციხე","k":"monument","ll":[42.91006,43.00713],"price":"Free","gbp":"Free","open":"Always — open ruin on a hilltop","win":"D7 evening only — impossible in the dawn hour","mins":100,"d":"Ruined hilltop fortress at 2,273 m directly above Chazhashi, said to be Queen Tamar's (r. 1184–1213) summer residence. Once four defensive towers and a church; one tower and the church footings survive. It is the highest thing you can stand on in Ushguli and the only viewpoint that looks down the length of all four hamlets with the Shkhara massif filling the north-east.","go":"From Old House go 100 m south-west to the little footbridge at the bottom of Chazhashi, where a signed path (Georgian sign: 'the trail to the upper fortress-tower') strikes uphill left. It is 540 m horizontally for 190 m of climb — extremely steep, uneven and slippery grass. Wander-Lush times it at 40 minutes up; reckon 25 down.","dist":"0.54 km · +190 m · 40 min up, 25 min down","tip":"Be brutally honest with yourselves at 17:30. This is a 100-minute round trip on legs that have done 27 km and the Chkhutnieri Pass. But it is the only spot in Ushguli whose western horizon is clear — the sun is still on you there until about 19:20, fifteen minutes after the village below has gone into shadow. If you do it, leave by 18:00 and take head torches for the descent.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/visit-ushguli-georgia-travel-guide/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Chazhashi"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91006&mlon=43.00713#map=17/42.91006/43.00713"}],"dy":[7]},{"id":"lamaria-church","n":"Lamaria Church (Mother of God)","n2":"ლამარია","k":"monument","ll":[42.91835,43.01966],"price":"Free","gbp":"Free","open":"Grounds always. Interior typically 09:00–20:00 in season but not staffed; frequently locke
