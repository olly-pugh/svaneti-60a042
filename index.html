leaves the barracks at 11:27","win":"D10 — be in place by 11:50","mins":45,"d":"Four matching rococo palaces around an octagonal cobbled square, still the royal family's winter residence. The Royal Life Guards in bearskins march from their barracks at Gothersgade 100 by Rosenborg at 11:27, cross the city past the Round Tower and Kongens Nytorv, and the changing ceremony happens on the square at noon.","go":"Walk from Nyhavn up Bredgade or along the harbour front; five minutes from the Marble Church.","dist":"2.8 km · 35 min walk","tip":"The best trick is not to stand on the square at all — instead catch the parade en route. They pass Rundetårn and Kongens Nytorv between about 11:30 and 11:50, there are no crowds, and you get the bearskins at arm's length with the old town behind them. Then walk on to the square and arrive with them. Free, and the single most reliable fixed point to hang your morning on. Skip the paid palace museum; on this budget it is not the money.","links":[{"t":"VisitCopenhagen — Changing of the Royal Guards","u":"https://www.visitcopenhagen.com/copenhagen/planning/changing-of-the-royal-guards-gdk1120569"},{"t":"The Danish Monarchy (official)","u":"https://www.kongehuset.dk/en/palaces-and-the-royal-yacht/changing-of-the-guard/"},{"t":"VisitCopenhagen — Amalienborg","u":"https://www.visitcopenhagen.com/copenhagen/planning/amalienborg-palace-gdk492887"}],"dy":[10]},{"id":"stroget-radhuspladsen","n":"Strøget and Rådhuspladsen","n2":"Strøget / Rådhuspladsen","k":"sight","ll":[55.67792,12.57304],"price":"Free","gbp":"Free","open":"Always open; City Hall interior Mon–Fri 09:00–16:00","win":"D10 — the spine of the morning walk","mins":45,"d":"Strøget is 1.1 km of connected pedestrian streets and squares running from Rådhuspladsen to Kongens Nytorv — one of Europe's longest car-free shopping streets, pedestrianised since 1962. The good parts are the squares strung along it: Gammeltorv with its Caritas fountain, Amagertorv with the stork fountain, and Højbro Plads. The red-brick City Hall at the western end has a free public entrance hall.","go":"Leave Central Station by the main exit, cross to Rådhuspladsen, and simply keep walking east.","dist":"Rådhuspladsen 0.6 km · 7 min walk; Kongens Nytorv end 2.2 km · 27 min","tip":"This is your free connective tissue — it links Central Station, the Round Tower, Nyhavn and Christiansborg without you ever needing a ticket. Duck one street off it in either direction (Pisserenden to the north, the Latin Quarter around Sankt Peders Stræde) and the prices halve immediately. The parallel street Strædet is prettier and quieter than Strøget itself.","links":[{"t":"Wikipedia — Strøget","u":"https://en.wikipedia.org/wiki/Str%C3%B8get"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67792,12.57304"}],"dy":[10]},{"id":"christiania","n":"Freetown Christiania","n2":"Fristaden Christiania","k":"sight","ll":[55.67721,12.61045],"price":"Free","gbp":"Free","open":"Always open; quieter and more pleasant in daylight","win":"D10 — mid to late afternoon","mins":75,"d":"The self-declared autonomous community founded in 1971 on an abandoned naval barracks in Christianshavn — about 1,000 residents, self-built timber houses, murals, workshops, lakeside paths and a genuinely green, ramshackle, un-Copenhagen feel. Walk past the entrance and into the back lanes towards the ramparts and the lake, which is where it is actually lovely.","go":"Enter from Prinsessegade in Christianshavn; the metro M1/M2 to Christianshavn plus a 10-minute walk, or a 47-minute walk from Central via Vor Frelsers Kirke.","dist":"3.8 km · 47 min walk, or metro to Christianshavn + 10 min","tip":"Current situation: in April 2024 the residents themselves dug up the cobbles of Pusher Street and dismantled the open cannabis market, and it is markedly calmer since. It is safe for visitors. Photography is now generally fine in most of Christiania — the painted houses, the workshops, the gallery — but it is still banned on the former Pusher Street and in other clearly signed areas, and you should always ask before photographing residents. Take the signs seriously; that is the one rule people get told off for. Nemoland, the outdoor bar inside, does Tuborg and Carlsberg at around 25–40 DKK, which is among the cheapest beer you will find anywhere central.","links":[{"t":"Wikipedia — Freetown Christiania","u":"https://en.wikipedia.org/wiki/Freetown_Christiania"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67721,12.61045"}],"dy":[10]},{"id":"christianshavn-cirkelbroen","n":"Christianshavn canals and the Cirkelbroen","n2":"Christianshavns Kanal / Cirkelbroen","k":"sight","ll":[55.67243,12.58379],"price":"Free","gbp":"Free","open":"Always open","win":"D10 — afternoon, on the way to or from Christiania","mins":40,"d":"The 17th-century Dutch-planned quarter across the water from the old town: a tree-lined canal with houseboats and old wooden vessels, low ochre warehouses, and quiet cobbled side streets. The Cirkelbroen is Olafur Eliasson's 2015 footbridge over Christianshavn Canal — five circular platforms with masts, meant to evoke a fleet of boats, and it swings open for shipping.","go":"Walk over Knippelsbro from Slotsholmen, or use the harbour bus and get off at Knippelsbro.","dist":"Cirkelbroen 1.6 km · 19 min walk; canal 2.4 km · 30 min","tip":"The stretch along Overgaden Neden Vandet and Overgaden Oven Vandet is the prettiest free walk in Copenhagen and almost nobody does it — most people go straight from the metro to Christiania and back. Broens Gadekøkken, a year-round street-food yard by the harbour bridge, sits at the northern end if you want to eat. Eiffel Bar at Wildersgade 58 is the local bodega with beer well under half Nyhavn prices.","links":[{"t":"Wikipedia — Christianshavn","u":"https://en.wikipedia.org/wiki/Christianshavn"},{"t":"Wikipedia — Cirkelbroen","u":"https://en.wikipedia.org/wiki/Cirkelbroen"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67243,12.58379"}],"dy":[10]},{"id":"davids-samling","n":"The David Collection","n2":"Davids Samling","k":"museum","ll":[55.68428,12.58238],"price":"Free — always","gbp":"Free","open":"Tue–Sun 10:00–17:00 (Wed to 21:00), closed Mon — open 10:00–17:00 on your Thursday","win":"D10 — late morning or a wet-weather fallback","mins":60,"d":"A private collection in a townhouse on the edge of the King's Garden holding one of the largest and best collections of Islamic art in northern Europe — ceramics, ivories, Mughal miniatures, Persian carpets, Ottoman silks — plus Danish Golden Age paintings and European 18th-century decorative art. And it is free, permanently, with no strings.","go":"Walk up Købmagergade, past Rundetårn, along the eastern edge of Kongens Have to Kronprinsessegade.","dist":"2.2 km · 28 min walk","tip":"This is the answer to the museum question on a Thursday. Copenhagen's free-entry days are almost all WEDNESDAYS — Thorvaldsens Museum, Nikolaj Kunsthal, the Museum of Copenhagen, Kunsthal Charlottenborg after 17:00, and the Glyptotek on the last Wednesday of the month — so on Thursday 10 September none of those apply to you. The David Collection is free every open day, and it is genuinely world-class. Pair it with the King's Garden next door.","links":[{"t":"The David Collection (official)","u":"https://www.davidmus.dk/"},{"t":"The David Collection — English site","u":"https://legacy.davidmus.dk/en/"},{"t":"KbhMuseer","u":"https://kbhmuseer.dk/en/museum/the-david-collection/"},{"t":"Free museums in Copenhagen — Routes North","u":"https://www.routesnorth.com/denmark/copenhagen/free-museums-copenhagen/"}],"dy":[10]},{"id":"glyptotek","n":"Ny Carlsberg Glyptotek","n2":"Glyptoteket","k":"museum","ll":[55.67253,12.57177],"price":"135 DKK online / 150 DKK at the door; 108 DKK online for under-27s and students; under 18 free","gbp":"~£15.50, or ~£12.40 if you are under 27","open":"Tue–Sun 10:00–17:00, THURSDAY UNTIL 21:00, closed Mon","win":"D10 — the late-opening option, 17:00–19:30","mins":90,"d":"Carl Jacobsen's brewery fortune turned into a museum: Egyptian, Greek, Etruscan and Roman antiquities, a very good French collection including a large group of Degas bronzes and works by Gauguin, and at its heart a glass-domed Winter Garden full of palms with a fountain.","go":"Cross H.C. Andersens Boulevard from the Tivoli side; it is five minutes from Central Station.","dist":"0.6 km · 7 min walk","tip":"The Thursday late opening to 21:00 is the one that fits your day — it is the only significant museum you can do AFTER the free outdoor things close, and it is a seven-minute walk from your locker. Book online for the 10% discount; under-27 tickets are 108 DKK. Caveat: the Greek and Roman sculpture galleries and the Central Hall are under renovation through October 2026, so part of the collection is off. Free entry is the LAST WEDNESDAY of the month, which does not help you. If the budget is really tight, skip it — the Winter Garden is behind the ticket line.","links":[{"t":"Glyptoteket — visit (official)","u":"https://www.glyptoteket.com/visit/"},{"t":"Copenhagen Card listing","u":"https://copenhagencard.com/attractions/glyptoteket"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67253,12.57177"}],"dy":[10]},{"id":"harbour-bus-991-992","n":"Harbour Bus 991 / 992 — the 24-kroner canal cruise","n2":"Havnebussen","k":"view","ll":[55.67974,12.59089],"price":"Normal public transport ticket — 24 DKK for a 2-zone single, or free with a City Pass","gbp":"~£2.75, or free with a City Pass","open":"Roughly 07:00–19:00 weekdays, every 15–30 min; check the DOT app on the day","win":"D10 — best late morning or mid-afternoon","mins":45,"d":"Electric yellow commuter ferries that run the full length of the harbour and are part of the ordinary transport network — so the same 24 DKK ticket that buys you a bus ride buys you the whole waterfront: the Opera House, the Black Diamond, the Royal playhouse, Refshaleøen, Islands Brygge. 992 runs north, 991 runs south. Stops in order: Teglholmen, Enghave Brygge, Islands Brygge Syd, Bryggebroen, Royal Danish Library, Knippelsbro, Nyhavn, Opera House, Holmen North, Nordre Toldbod, Refshaleøen, Orientkaj.","go":"Board at Nyhavn (the pier at the harbour end of the canal) or at the Black Diamond, both easy walks from Central.","dist":"Nyhavn pier: 2.4 km · 30 min walk from Central Station","tip":"This is the standout value in Copenhagen. The commercial canal tours charge 120–165 DKK for something broadly similar; this is 24 DKK and the boats are open-sided with proper views. Take 992 north from Nyhavn to Refshaleøen (for Reffen) or Orientkaj, then 991 back — two singles each, and you have seen the harbour end to end. Go for a window seat on the open aft deck.","links":[{"t":"VisitCopenhagen — the Harbour Bus","u":"https://www.visitcopenhagen.com/copenhagen/planning/harbour-buses-gdk447302"},{"t":"DOT — travelling by harbour bus","u":"https://dinoffentligetransport.dk/en/how-to-travel/harbor-bus"},{"t":"Wikipedia — Copenhagen Harbour Buses","u":"https://en.wikipedia.org/wiki/Copenhagen_Harbour_Buses"}],"dy":[10]},{"id":"christiansborg-tower","n":"Christiansborg Palace Tower","n2":"Tårnet, Christiansborg Slot","k":"view","ll":[55.67565,12.58004],"price":"Free","gbp":"Free","open":"Tue–Sat 11:00–21:00, Sun 11:00–17:30, closed Mon — so open on your Thursday","win":"D10 — best late afternoon / early evening, ~17:30–19:00","mins":45,"d":"At 106 m this is the tallest tower in Copenhagen — forty centimetres taller than the City Hall — and the view over the spires, the harbour and across to Sweden is the best in the city. It is genuinely, completely free, and you go up by lift.","go":"Walk north-east from Central Station past the Rådhus and along Vindebrogade onto Slotsholmen. The entrance is at the King's Gate (Kongeporten) under the tower in the centre of the palace, reached from the Riding Ground across the Marble Bridge.","dist":"1.3 km · 16 min walk","tip":"Confirmed free — the only cost is queueing. There is an airport-style security check (bag search, metal detector) because the Danish Parliament sits in the building, and queues of 30–60 minutes are common at midday. Go after about 18:00 and you will often walk straight in, with the light at its best. Sources differ on the hours — VisitCopenhagen and the Parliament say 11:00–21:00, a few third-party sites say 10:00–17:00 — so check ft.dk on the day if you are leaving it late. The tower restaurant is expensive; you do not need it to use the viewing gallery.","links":[{"t":"The Danish Parliament — the Tower","u":"https://www.thedanishparliament.dk/en/the-tower/visit"},{"t":"VisitCopenhagen","u":"https://www.visitcopenhagen.com/copenhagen/planning/the-tower-christiansborg-palace-gdk917422"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67565,12.58004"}],"dy":[10]},{"id":"rundetaarn","n":"Rundetårn (the Round Tower)","n2":"Rundetaarn","k":"view","ll":[55.68136,12.57579],"price":"60 DKK adult, 40 DKK student with ID, under 18 free","gbp":"~£7, or ~£4.60 with a student card","open":"Daily 10:00–20:00 (1 April – 30 September)","win":"D10 — late morning or afternoon","mins":45,"d":"Christian IV's 1642 observatory tower, climbed not by stairs but by a wide cobbled spiral ramp that coils seven and a half times around a hollow core — Peter the Great supposedly rode up it on horseback. The rooftop platform gives a 360° view over the old town's copper roofs.","go":"Straight up Købmagergade from Strøget; it is the fat brick cylinder you cannot miss.","dist":"1.5 km · 19 min walk","tip":"Bring student cards — 40 DKK instead of 60 saves you £2.30 each. The ramp is the point: it is an easy, non-vertiginous climb, unlike Vor Frelsers. Note the observatory itself is closed for restoration from November 2025 onward, so by September 2026 you will not see the telescope, but the ramp, the Library Hall and the roof platform are unaffected. Tickets are sold at the door only — no online booking. DØP's hot dog stand and Studenterhuset are both literally at the foot of the tower.","links":[{"t":"Rundetaarn — visit us (official)","u":"https://www.rundetaarn.dk/en/visit-us/"},{"t":"KbhMuseer","u":"https://kbhmuseer.dk/en/museum/the-round-tower/"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.68136,12.57579"}],"dy":[10]},{"id":"vor-frelsers-spire","n":"Church of Our Saviour — the external spiral spire","n2":"Vor Frelsers Kirke","k":"view","ll":[55.67291,12.59425],"price":"Church free. Tower 70 DKK adult, 53 DKK student/senior, 20 DKK child","gbp":"Church free; tower ~£8, ~£6 with student ID","open":"Tower daily 09:00–20:00, last admission 19:30; church roughly 10:00–15:30","win":"D10 — afternoon, combine with Christianshavn/Christiania","mins":60,"d":"The famous corkscrew spire of Christianshavn — 400 steps, and the last 150 of them run up the OUTSIDE of the gilded helix on an open copper staircase with a handrail and nothing else. 86 m up, and the view down over Christiania, the harbour and the city is extraordinary. Not for the wobbly.","go":"Walk out of the city centre over Knippelsbro into Christianshavn, or take the M1/M2 metro one stop to Christianshavn.","dist":"2.4 km · 30 min walk","tip":"It closes without warning in rain, snow or strong wind, because the copper steps get lethally slippery — so if it looks marginal, do Christiansborg's free tower instead and save the 70 DKK. Book ahead via the church site or Billetto if you want a guaranteed slot; capacity is limited. Student ID drops it to 53 DKK. Honestly: if you can only pay for one paid tower, this is the one with the story, but Christiansborg is free and higher.","links":[{"t":"Vor Frelsers Kirke — tower booking (official)","u":"https://www.vorfrelserskirke.dk/taarn/tower/booking"},{"t":"VisitCopenhagen","u":"https://www.visitcopenhagen.com/copenhagen/planning/church-of-our-saviour-gdk410659"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Church_of_Our_Saviour,_Copenhagen"}],"dy":[10]},{"id":"kastellet","n":"Kastellet (the Citadel)","n2":"Kastellet","k":"nature","ll":[55.69138,12.59374],"price":"Free","gbp":"Free","open":"Grounds daily, roughly 06:00–22:00","win":"D10 — early afternoon, en route to the Mermaid","mins":40,"d":"One of the best-preserved star fortresses in northern Europe, built from 1626 and still a working military site. You walk the grassy ramparts in a complete pentagon above the moat, past red-ochre barracks, a church and a Dutch windmill. Locals run here; almost no tour groups bother.","go":"North along the harbour from Amalienborg, or harbour bus 992 to Nordre Toldbod and walk 5 minutes.","dist":"3.6 km · 45 min walk (or harbour bus 992 + 5 min)","tip":"This is the free thing most day-trippers miss and it is far better than the Little Mermaid it sits next to — a full circuit of the ramparts takes about 25 minutes and it is quiet, green and genuinely handsome. Do it as the natural approach to the Mermaid rather than as a separate outing.","links":[{"t":"Wikipedia — Kastellet","u":"https://en.wikipedia.org/wiki/Kastellet,_Copenhagen"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.69138,12.59374"}],"dy":[10]},{"id":"kongens-have-rosenborg","n":"King's Garden and Rosenborg Castle (outside)","n2":"Kongens Have / Rosenborg Slot","k":"nature","ll":[55.68508,12.57998],"price":"Garden free. Castle interior 145 DKK adult, 110 DKK student","gbp":"Garden free; castle ~£17, ~£12.65 student","open":"Garden daily from 07:00 until sunset (about 19:45 in mid-September)","win":"D10 — late morning or a rest stop mid-afternoon","mins":40,"d":"Twelve hectares of the oldest royal garden in Denmark, laid out by Christian IV in 1606, with avenues of lime trees, a rose garden, and the Dutch Renaissance turrets of Rosenborg rising out of the middle. It is Copenhagen's most-used park and on a fine September afternoon it will be full of people lying on the grass.","go":"Straight up Købmagergade past Rundetårn and on to Gothersgade; the garden gate is on your left.","dist":"2.2 km · 27 min walk","tip":"Skip paying to go inside. The crown jewels are in the basement and they are good, but 145 DKK each is most of a day's food budget. The garden is free, the castle exterior across the moat is the photograph, and the Life Guards' barracks on Gothersgade 100 at the garden's edge is where the noon parade forms up at 11:27. Buy a pastry and sit. The free David Collection is a five-minute walk east.","links":[{"t":"The Royal Danish Collection — Rosenborg (official)","u":"https://denkongeligesamling.dk/en/rosenborg/"},{"t":"Wikipedia — Rosenborg Castle Gardens","u":"https://en.wikipedia.org/wiki/Rosenborg_Castle_Gardens"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.68508,12.57998"}],"dy":[10]},{"id":"black-diamond","n":"The Black Diamond (Royal Library) harbour terrace","n2":"Den Sorte Diamant","k":"view","ll":[55.67355,12.58286],"price":"Free","gbp":"Free","open":"Mon–Fri 08:00–21:00, Sat 09:00–19:00","win":"D10 — good early-evening stop before you head back","mins":30,"d":"The 1999 extension to the Royal Library, clad in polished black granite from Zimbabwe, canted out over the harbour on Slotsholmen's waterfront. You can walk in for nothing, go up the atrium escalators for the view through the seven-storey glass wall, and sit on the quay outside with the water in front of you.","go":"On Slotsholmen, immediately south of Christiansborg on the harbour side. Also a harbour bus stop.","dist":"1.5 km · 19 min walk","tip":"Underrated free stop, and it stays open to 21:00 on a Thursday, which very little else free does. The harbour-bus pier is right outside, so it is a natural place to end a boat trip. Clean free toilets, warm indoors, wifi — a useful place to kill twenty minutes before you collect your bags, and the sunset over the water from the quay is free.","links":[{"t":"Royal Danish Library (official)","u":"https://www.kb.dk/en"},{"t":"Free museums in Copenhagen — Routes North","u":"https://www.routesnorth.com/denmark/copenhagen/free-museums-copenhagen/"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67355,12.58286"}],"dy":[10]},{"id":"polsevogn-hot-dogs","n":"Pølsevogn — DØP and John's Hotdog Deli","n2":"Den Økologiske Pølsemand / John's Hotdog Deli","k":"eat","ll":[55.68118,12.5763],"price":"DØP ~45–47 DKK; John's ~40–55 DKK; a plain ristet hotdog from a standard van ~35–40 DKK","gbp":"~£4–6 for a proper lunch","open":"DØP Mon–Fri 11:30–18:00, Sat 11:00–17:00; John's daily, roughly 09:00–21:00","win":"D10 — lunch, or a top-up any time","mins":20,"d":"The Danish hot-dog van is the country's real fast food and the cheapest hot meal in Copenhagen. DØP — Den Økologiske Pølsemand, 'the organic sausage man' — has two stands, one at the foot of Rundetårn on Købmagergade and one by Helligåndskirken on Amagertorv, doing all-organic grilled pork sausages with mustard, ketchup and a potato-and-parsnip mash. John's Hotdog Deli sits on Bernstorffsgade right outside Central Station and is a local institution.","go":"DØP: at the base of the Round Tower on Købmagergade. John's: on Bernstorffsgade, 2 minutes from the station's main exit and about 200 m from your locker.","dist":"DØP 1.5 km · 19 min walk; John's 0.2 km · 2 min walk","tip":"This is the cheapest genuinely-good lunch in the city and it is under £5. Ask for a ristet hotdog with the works — fried and raw onion, pickled cucumber, remoulade, mustard, ketchup. John's is the one to know because it is literally beside your locker, so it solves both the arrival gap and the pre-metro hunger at 19:45 when everything else is either shut or expensive. DØP is the better sausage; John's is the better location.","links":[{"t":"DØP (official)","u":"https://doep.dk/"},{"t":"Cheap food in Copenhagen — Routes North","u":"https://www.routesnorth.com/denmark/copenhagen/cheap-food-copenhagen/"},{"t":"John's Hotdog Deli map","u":"https://www.google.com/maps/search/?api=1&query=55.67361,12.566"}],"dy":[10]},{"id":"domhusets-smorrebrod","n":"Domhusets Smørrebrød","n2":"Domhusets Smørrebrød","k":"eat","ll":[55.67676,12.57206],"price":"Smørrebrød roughly 20–60 DKK a piece","gbp":"~£2.30–7 a piece; a full lunch for two around £10–14","open":"Mon–Fri approx. 08:00–15:00, closed weekends — open on your Thursday","win":"D10 — lunch, and go before 14:00","mins":30,"d":"A tiny old-school takeaway smørrebrød counter in a side street behind the courthouse, feeding local office workers and lawyers rather than tourists. Pickled herring, roast pork with red cabbage, breaded plaice with remoulade, egg and prawn — the real thing, made that morning, at a fraction of what the smørrebrød restaurants charge.","go":"Walk up from Rådhuspladsen towards Strøget and turn into Kattesundet, a lane just north of Vestergade.","dist":"0.8 km · 10 min walk","tip":"This is the best cheap-eat find in Copenhagen and the answer to 'good smørrebrød that isn't £25 a slice' — the same dish that costs 85–130 DKK in Torvehallerne and 150+ DKK at Schønnemann is 20–60 DKK here. It is a hole in the wall with one outdoor table, so it is takeaway: buy four pieces between you for well under 200 DKK and carry them five minutes to the Christiansborg riding ground or the library quay. Only open weekdays until mid-afternoon, so it has to be lunch, not dinner. Cash is not required but bring a card.","links":[{"t":"Budget eats in Copenhagen — BudgetTraveller","u":"https://budgettraveller.org/best-cheap-eats-copenhagen/"},{"t":"Cheap food in Copenhagen — Routes North","u":"https://www.routesnorth.com/denmark/copenhagen/cheap-food-copenhagen/"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67676,12.57206"}],"dy":[10]},{"id":"riz-raz-buffet","n":"Riz Raz — all-you-can-eat Mediterranean buffet","n2":"RizRaz","k":"eat","ll":[55.68001,12.57399],"price":"Lunch buffet 119–145 DKK (11:30–15:00/15:30); evening buffet 185 DKK","gbp":"Lunch ~£14–17; dinner ~£21","open":"Daily, lunch buffet from 11:30, evening buffet from 15:00 to late","win":"D10 — late lunch, 14:00–15:00","mins":60,"d":"A Copenhagen institution in the Latin Quarter doing an unlimited vegetarian Mediterranean buffet — falafel, couscous, roasted vegetables, marinated salads, hummus, pasta, pizza, bread. Sit-down, warm, and you can eat until you cannot move.","go":"Off Strøget into the Latin Quarter; Store Kannikestræde runs beside the university, near the Round Tower.","dist":"1.3 km · 16 min walk","tip":"The right call if you are genuinely hungry rather than grazing — for two people it is one of the only ways in Copenhagen to eat as much as you actually want for under £35 total. Go for the LUNCH sitting: it is 119–145 DKK versus 185 DKK after 15:00, for the same food. Sources quote both 119 and 145 for lunch, so check the board on the door. Their Too Good To Go surplus bags have gone for around 29 DKK if you happen to be near at closing.","links":[{"t":"Riz Raz (official)","u":"https://rizraz.dk/"},{"t":"Budget eats in Copenhagen — BudgetTraveller","u":"https://budgettraveller.org/best-cheap-eats-copenhagen/"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.68001,12.57399"}],"dy":[10]},{"id":"bakery-breakfast","n":"Bakery breakfast — kanelsnegl, tebirkes and coffee","n2":"Bageri — kanelsnegle og tebirkes","k":"cafe","ll":[55.67913,12.56921],"price":"Kanelsnegl 35–52 DKK, tebirkes ~30–40 DKK, filter coffee 30–45 DKK. Lagkagehuset/Ole & Steen kanelsnegl 35–45 DKK; Hart Bageri 45–52 DKK","gbp":"Pastry ~£4–6, coffee ~£3.50–5; breakfast for two ~£16–20","open":"Most bakeries open 07:00–17:00; Lagkagehuset branches from 06:00, including one in Central Station","win":"D10 — breakfast, 09:00–10:00","mins":30,"d":"Copenhagen's bakery scene is genuinely world class and a pastry with a coffee is the cheapest way to eat something excellent here. Get a kanelsnegl (a cinnamon 'snail', usually cardamom-scented) or a tebirkes — a flaky poppy-seed roll with a marzipan-remonce core, which is the local one nobody tells tourists about. Sankt Peders Bageri on Sankt Peders Stræde is the oldest bakery in the city; Lagkagehuset (branded Ole & Steen abroad) is the reliable chain and has a Central Station branch; Hart Bageri and Juno the Bakery are the destination bakeries if you are willing to detour.","go":"Sankt Peders Bageri is a 12-minute walk into the Latin Quarter; there is a Lagkagehuset inside Central Station itself.","dist":"Sankt Peders 1.0 km · 12 min walk; Lagkagehuset at the station · 2 min","tip":"Cheapest good start to the day: buy at the counter and stand up or walk with it, because sitting down anywhere in Copenhagen adds a service premium. A 7-Eleven pastry is 22 DKK if you are truly counting, and there are branches all over the station. Note Sankt Peders Bageri's famous giant onsdagssnegl is a WEDNESDAY-only thing, so you will miss it by a day. Hart Bageri and Juno are both closed Mondays but open Thursday — Juno is out in Østerbro, which is a real detour for a cinnamon bun.","links":[{"t":"Copenhagen bakeries guide with prices","u":"https://www.copenhagen-trip.com/guides/copenhagen-bakeries-pastry/"},{"t":"Best Copenhagen bakeries — local guide","u":"https://thingstodocph.com/best-copenhagen-bakeries-pastry-shops/"},{"t":"Map — Sankt Peders Bageri","u":"https://www.google.com/maps/search/?api=1&query=55.67913,12.56921"}],"dy":[10]},{"id":"studenterhuset","n":"Studenterhuset","n2":"Studenterhuset","k":"drink","ll":[55.68118,12.5763],"price":"Beer 27 DKK members / 37 DKK non-members; beer of the week 2 for 40 DKK; happy hour 2 draught for 35 DKK","gbp":"~£3.10–4.25 a beer","open":"Typically from midday or early afternoon until late; events most evenings","win":"D10 — early-evening drink, 18:00–19:30","mins":60,"d":"A non-profit, volunteer-run student house at the foot of the Round Tower, with a bar downstairs and something on almost every night — quizzes, board games, live music, swing dancing. Anyone can drink here, students or not, and the prices are set to be affordable for students rather than for tourists.","go":"Købmagergade 52, directly beside Rundetårn, with DØP's hot dog stand outside the door.","dist":"1.5 km · 19 min walk","tip":"The single best answer to 'cheap beer in Copenhagen'. A beer at 27–37 DKK is roughly a quarter of the 110–130 DKK you would pay on a Nyhavn terrace. Show any student ID and you may get the member price; even at 37 DKK it beats almost everything central. And it is beside the Round Tower, so it slots straight into the end of a city-centre afternoon before you walk down to Christiansborg's tower for the free view.","links":[{"t":"Studenterhuset (official)","u":"https://studenterhuset.dk/"},{"t":"Cheap beer bars — Expatolife","u":"https://www.expatolife.com/bars-cheap-beer-in-copenhagen-denmark/"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.68118,12.5763"}],"dy":[10]},{"id":"bo-bi-bar","n":"Bo-Bi Bar — the classic bodega","n2":"Bo-Bi Bar","k":"drink","ll":[55.68109,12.57868],"price":"Bottled beer from about 32 DKK; a 0.5 L draught around 48 DKK","gbp":"~£3.70–5.50 a beer","open":"Daily, typically from midday until late","win":"D10 — early-evening drink, 18:00–19:30","mins":45,"d":"Opened in 1917 by a sailor who bought the first bar counter in Copenhagen, and reputedly the city's oldest brown bar. Red lamps, red wallpaper unchanged for a century, beer drunk from the bottle, mustard-coated hard-boiled eggs on the counter, and a mixed crowd of journalists, artists and office workers. This is what a Danish bodega actually is.","go":"Klareboderne 14, a short lane off Købmagergade near the Round Tower and Gammeltorv.","dist":"1.7 km · 21 min walk","tip":"A worthwhile note on beer prices generally: a lot of budget blogs still quote 15–25 DKK bodega pints, and those figures are years out of date. The realistic 2026 floor in a central bodega is around 30–50 DKK for a beer, with Nørrebro (Ravnsborggade, Elmegade) and Vesterbro (Istedgade and its side streets) cheaper than Indre By. Benni's Bar on Enghavevej in Vesterbro and Eiffel Bar on Wildersgade in Christianshavn are the two other honest bodegas worth knowing, and Nemoland inside Christiania is around 25–40 DKK. A supermarket beer from Netto or 7-Eleven is about 12–15 DKK if you want to drink by the water instead.","links":[{"t":"VisitCopenhagen — Bo-Bi Bar","u":"https://www.visitcopenhagen.com/copenhagen/planning/bo-bi-bar-gdk436164"},{"t":"Cheap beer in Copenhagen — Routes North","u":"https://www.routesnorth.com/denmark/copenhagen/where-to-find-cheap-beer-in-copenhagen/"},{"t":"PilsPosten — cheap beer 2026 prices","u":"https://www.pilsposten.com/en/artikler/cheap-beer-in-copenhagen-the-best-bars-for-budget-pints-in-2026"}],"dy":[10]},{"id":"torvehallerne","n":"Torvehallerne food market","n2":"TorvehallerneKBH","k":"market","ll":[55.68387,12.56955],"price":"Free to enter; smørrebrød 85–130 DKK a piece, Slagter Lund pork sandwich 95 DKK, Grød porridge from 79 DKK, coffee ~40 DKK","gbp":"Lunch realistically £11–16 a head","open":"Mon–Thu 10:00–19:00, Fri 10:00–20:00, Sat 10:00–18:00, Sun 11:00–17:00","win":"D10 — lunch, 12:30–14:00","mins":60,"d":"Two glass halls beside Nørreport station with about sixty stalls — smørrebrød, coffee, seafood, cheese, produce, tacos, porridge. It is curated and quality-first rather than a cheap street-food market, so you have to choose carefully, but it is the best single place to eat well without sitting down.","go":"Walk north up Frederiksborggade from the city centre, or metro/S-train one stop to Nørreport.","dist":"1.7 km · 21 min walk","tip":"What is actually affordable in here, in order: Slagter Lund's flæskestegssandwich — a soft bun crammed with roast pork belly, crackling, red cabbage and pickles for 95 DKK (~£11), which is the single best value-for-money plate in the building and a proper Danish thing. Then Hallernes Smørrebrød, where the breaded plaice with remoulade starts around 80 DKK. Then Grød's porridge bowls from 79 DKK. Avoid: assembling a cheese-and-charcuterie picnic, which sounds thrifty and reliably costs 150–200 DKK. Two of you can eat properly here for about 200 DKK total if you share a sandwich and a smørrebrød.","links":[{"t":"Torvehallerne (official)","u":"https://torvehallernekbh.dk/"},{"t":"Scandinavia Standard — guide to Torvehallerne","u":"https://www.scandinaviastandard.com/the-ultimate-guide-to-the-best-of-torvehallerne-in-copenhagen/"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.68387,12.56955"}],"dy":[10]},{"id":"reffen","n":"Reffen street food market","n2":"Reffen — Copenhagen Street Food","k":"market","ll":[55.69317,12.60978],"price":"Free entry; dishes 80–155 DKK; beer 60–90 DKK","gbp":"Dish ~£9–18; a full meal with a drink ~£18–25","open":"Season mid-March to end of September. Food stalls daily 11:30–21:30; bars Sun–Thu 11:00–22:00","win":"D10 — late afternoon, but only if you commit to the trip","mins":120,"d":"Northern Europe's biggest street-food market, built out of shipping containers on the old shipyard at Refshaleøen: around 35 food stalls, 10 bars, workshops and a brewery, right on the water with a view back across the harbour to the city. In season on 10 September, and open until 21:30.","go":"Harbour bus 992 north from Nyhavn or the Black Diamond to Refshaleøen (~15 min, and a lovely ride on a normal ticket), or bus 9A from Kongens Nytorv (~20 min).","dist":"4.7 km · 59 min walk, or harbour bus 992 ~15 min","tip":"Honest verdict on a tight budget: the food is NOT especially cheap — 80–155 DKK a dish, and a beer is 60–90 DKK, so a meal and a drink is £18–25 a head, more than Torvehallerne. What justifies the trip is the harbour bus getting you there, which is the cheap canal cruise you wanted anyway. So treat the journey as the attraction and the food as optional: ride 992 out, walk around, eat one shared dish or nothing, ride 991 back. Sunset over the water from Refshaleøen in September is excellent and free.","links":[{"t":"Reffen — opening hours (official)","u":"https://reffen.dk/en/opening-hours-seasons/"},{"t":"VisitCopenhagen","u":"https://www.visitcopenhagen.com/copenhagen/planning/reffen-copenhagen-street-food-gdk1101719"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.69317,12.60978"}],"dy":[10]}]}},"poiSeq":{"1":["istanbul"],"2":["istanbul","tbilisi-chugureti"],"3":["tbilisi-oldtown"],"4":["zugdidi","mestia"],"5":["mestia","zhabeshi"],"6":["adishi"],"7":["ushguli"],"8":["ushguli","mestia","zugdidi"],"9":["tbilisi-vera"],"10":["copenhagen"]}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
var D = window.TRIP;
var $ = function(s){ return document.querySelector(s); };

/* ---------------- time ---------------- */
var qs = new URLSearchParams(location.search);
var FAKE = null;
if (qs.get('t')) { var f = new Date(qs.get('t')); if (!isNaN(f)) FAKE = f; }
if (qs.get('d')) {
  var dd = parseInt(qs.get('d'), 10);
  var day = D.days[Math.min(Math.max(dd,1),D.days.length)-1];
  if (day) FAKE = new Date(new Date(day.start).getTime() + 13*3600e3);
}
function now(){ return FAKE ? new Date(FAKE.getTime()) : new Date(); }

var TRIP_START = new Date(D.trip.start), TRIP_END = new Date(D.trip.end);
D.days.forEach(function(d, i){
  d.t0 = new Date(d.start);
  d.t1 = i + 1 < D.days.length ? new Date(D.days[i+1].start) : new Date(d.end || D.trip.end);
});

function liveDayIndex(t){
  if (t < TRIP_START) return -1;
  if (t >= TRIP_END) return -2;
  for (var i = 0; i < D.days.length; i++) if (t >= D.days[i].t0 && t < D.days[i].t1) return i;
  return D.days.length - 1;
}

/* ---------------- geometry helpers ---------------- */
function hav(a, b){
  var R = 6371, p1 = a[0]*Math.PI/180, p2 = b[0]*Math.PI/180;
  var dp = p2 - p1, dl = (b[1]-a[1])*Math.PI/180;
  return 2*R*Math.asin(Math.sqrt(Math.sin(dp/2)*Math.sin(dp/2) +
    Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2)));
}
function cumul(c){
  if (c._cum) return c._cum;
  var out = [0];
  for (var i = 1; i < c.length; i++) out.push(out[i-1] + hav(c[i-1], c[i]));
  try { Object.defineProperty(c, '_cum', {value: out, enumerable: false}); } catch(e) {}
  return out;
}
function atFrac(c, f){
  var cu = cumul(c), total = cu[cu.length-1];
  if (total <= 0) return c[0].slice();
  var target = Math.max(0, Math.min(1, f)) * total;
  for (var i = 1; i < cu.length; i++){
    if (cu[i] >= target){
      var seg = cu[i] - cu[i-1], k = seg > 0 ? (target - cu[i-1]) / seg : 0;
      return [c[i-1][0] + (c[i][0]-c[i-1][0])*k, c[i-1][1] + (c[i][1]-c[i-1][1])*k];
    }
  }
  return c[c.length-1].slice();
}
function sliceLine(c, f){
  if (f <= 0) return [];
  if (f >= 1) return c.slice();
  var cu = cumul(c), total = cu[cu.length-1], target = f*total, out = [];
  for (var i = 0; i < c.length; i++){
    if (cu[i] <= target) out.push(c[i]);
    else { out.push(atFrac(c, f)); break; }
  }
  if (out.length < 2) out = [c[0], atFrac(c, f)];
  return out;
}

/* ---------------- relief rendering ---------------- */
var RAMP_DARK = [[0,'#1A282A'],[400,'#1F2F2A'],[900,'#26352D'],[1500,'#2F3A32'],
  [2200,'#3B403A'],[2900,'#4B4C45'],[3500,'#63645B'],[4100,'#8B9190'],[4700,'#B9C6CA'],[5400,'#DEE9EC']];
var RAMP_LIGHT = [[0,'#D5E2D1'],[400,'#C8DABF'],[900,'#BFD1B2'],[1500,'#C0C8A9'],
  [2200,'#C4C2AC'],[2900,'#C9C3B2'],[3500,'#D4D0C5'],[4100,'#E6E5E0'],[4700,'#F5F7F8'],[5400,'#FFFFFF']];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rampColor(ramp, e){
  if (e <= ramp[0][0]) return hex2rgb(ramp[0][1]);
  for (var i = 1; i < ramp.length; i++){
    if (e <= ramp[i][0]){
      var k = (e - ramp[i-1][0]) / (ramp[i][0] - ramp[i-1][0]);
      var a = hex2rgb(ramp[i-1][1]), b = hex2rgb(ramp[i][1]);
      return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
    }
  }
  return hex2rgb(ramp[ramp.length-1][1]);
}
function cr(p0,p1,p2,p3,t){
  var t2=t*t, t3=t2*t;
  return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
}
function blurGrid(v, nlat, nlon, passes){
  var a = v.slice(), b = new Float32Array(a.length), K = [1,4,6,4,1], KS = 16;
  for (var p = 0; p < passes; p++){
    var r, c, k, i, acc;
    for (r = 0; r < nlat; r++) for (c = 0; c < nlon; c++){
      acc = 0;
      for (k = -2; k <= 2; k++){
        i = c + k; if (i < 0) i = 0; if (i > nlon-1) i = nlon-1;
        acc += a[r*nlon+i] * K[k+2];
      }
      b[r*nlon+c] = acc/KS;
    }
    for (r = 0; r < nlat; r++) for (c = 0; c < nlon; c++){
      acc = 0;
      for (k = -2; k <= 2; k++){
        i = r + k; if (i < 0) i = 0; if (i > nlat-1) i = nlat-1;
        acc += b[i*nlon+c] * K[k+2];
      }
      a[r*nlon+c] = acc/KS;
    }
  }
  return a;
}
function makeRelief(g, ss, dark){
  var nlat=g.nlat, nlon=g.nlon, step=g.step, lat0=g.lat0;
  var passes = g.name === 'trek' ? 1 : 0;
  var v = passes ? blurGrid(g.v, nlat, nlon, passes) : g.v;
  function E(r,c){
    r = r<0?0:(r>nlat-1?nlat-1:r); c = c<0?0:(c>nlon-1?nlon-1:c);
    return v[r*nlon+c];
  }
  function Esmooth(fr,fc){
    var r=Math.floor(fr), c=Math.floor(fc), tr=fr-r, tc=fc-c, col=[];
    for (var j=-1;j<=2;j++)
      col.push(cr(E(r+j,c-1),E(r+j,c),E(r+j,c+1),E(r+j,c+2),tc));
    return cr(col[0],col[1],col[2],col[3],tr);
  }
  var W = Math.round((nlon-1)*ss)+1, H = Math.round((nlat-1)*ss)+1;
  var lat1 = lat0 + step*(nlat-1);
  function lat2y(l){ var p=l*Math.PI/180; return Math.log(Math.tan(Math.PI/4 + p/2)); }
  function y2lat(y){ return (2*Math.atan(Math.exp(y)) - Math.PI/2)*180/Math.PI; }
  var yTop = lat2y(lat1), yBot = lat2y(lat0);
  var cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H;
  var ctx = cvs.getContext('2d'), img = ctx.createImageData(W, H), px = img.data;
  var midLat = (lat0+lat1)/2;
  var dyM = step*111320, dxM = step*111320*Math.cos(midLat*Math.PI/180);
  var zf = { georgia: 3.0, caucasus: 3.0, svaneti: 1.9, trek: 2.5 }[g.name] || 2.0;
  var az = 322*Math.PI/180, alt = 40*Math.PI/180;
  var Lx = Math.sin(az)*Math.cos(alt), Ly = Math.cos(az)*Math.cos(alt), Lz = Math.sin(alt);
  var ramp = dark ? RAMP_DARK : RAMP_LIGHT;
  var feather = Math.max(4, Math.round(Math.min(W, H) * 0.055));
  for (var r = 0; r < H; r++){
    var y = yTop - (r/(H-1))*(yTop-yBot);
    var fr = (y2lat(y) - lat0)/step;
    for (var c = 0; c < W; c++){
      var fc = c/ss;
      var e  = Esmooth(fr, fc);
      var eL = Esmooth(fr, fc - 1), eR = Esmooth(fr, fc + 1);
      var eD = Esmooth(fr - 1, fc), eU = Esmooth(fr + 1, fc);
      var dzdx = (eR - eL)/(2*dxM), dzdy = (eU - eD)/(2*dyM);
      var nx = -dzdx*zf, ny = -dzdy*zf, nz = 1;
      var len = Math.sqrt(nx*nx + ny*ny + 1);
      var lam = (nx*Lx + ny*Ly + nz*Lz)/len;
      if (lam < 0) lam = 0;
      var k = dark ? (0.52 + 0.94*lam) : (0.68 + 0.66*lam);
      var slope = Math.min(1, Math.sqrt(dzdx*dzdx + dzdy*dzdy)*zf);
      k *= (1 - 0.10*slope);
      if (k > (dark ? 1.34 : 1.14)) k = dark ? 1.34 : 1.14;
      var col = rampColor(ramp, e);
      var i4 = (r*W + c)*4;
      px[i4]   = Math.max(0, Math.min(255, col[0]*k));
      px[i4+1] = Math.max(0, Math.min(255, col[1]*k));
      px[i4+2] = Math.max(0, Math.min(255, col[2]*k));
      var a = 255;
      if (e <= 1) a = 0;
      else if (e < 22) a = Math.round(255*(e-1)/21);
      var edge = Math.min(r, c, H-1-r, W-1-c);
      if (edge < feather) a = Math.round(a * edge/feather);
      px[i4+3] = a;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { url: cvs.toDataURL('image/png'),
           bounds: [[lat0, g.lon0], [lat1, g.lon0 + step*(nlon-1)]] };
}

/* ---------------- map ---------------- */
var map = L.map('map', {
  zoomControl: false, attributionControl: false,
  minZoom: 3, maxZoom: 15, zoomSnap: 0.25, wheelPxPerZoomLevel: 140,
  worldCopyJump: false, preferCanvas: false
});
L.control.zoom({ position: 'topright' }).addTo(map);
map.setView([43.02, 42.86], 9);

['landmass','relief','hydro','ice','routes','labels'].forEach(function(n, i){
  var p = map.createPane(n);
  p.style.zIndex = [205, 215, 225, 235, 420, 560][i];
  if (n !== 'labels') p.style.pointerEvents = 'none';
  else p.style.pointerEvents = 'none';
});

function isDark(){
  var s = document.documentElement.getAttribute('data-theme');
  if (s === 'dark') return true;
  if (s === 'light') return false;
  return !window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches;
}
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* --- land --- */
var landLayer = L.layerGroup([], { pane: 'landmass' }).addTo(map);
function buildLand(){
  landLayer.clearLayers();
  var fill = cssv('--land'), stroke = isDark() ? '#3B505B' : '#A9BCC4';
  D.borders.forEach(function(co){
    co.r.forEach(function(ring){
      L.polygon(ring.map(function(p){ return [p[1], p[0]]; }), {
        pane: 'landmass', fillColor: fill, fillOpacity: 1, color: stroke,
        weight: 0.8, opacity: 0.9, interactive: false, smoothFactor: 1.4
      }).addTo(landLayer);
    });
  });
}

/* --- relief --- */
var reliefLayers = [];
function buildRelief(){
  reliefLayers.forEach(function(l){ map.removeLayer(l); });
  reliefLayers = [];
  var dark = isDark();
  [['georgia', 3], ['caucasus', 2], ['svaneti', 4], ['trek', 2]].forEach(function(spec){
    var g = D.grids[spec[0]];
    if (!g) return;
    var r = makeRelief(g, spec[1], dark);
    var ov = L.imageOverlay(r.url, r.bounds, {
      pane: 'relief', opacity: spec[0] === 'georgia' ? 0.96 : 1, interactive: false,
      className: 'relief-img'
    });
    ov._minZ = { georgia: 5.7, caucasus: 6.2, svaneti: 7.6, trek: 9.0 }[spec[0]];
    reliefLayers.push(ov);
  });
}

var labelGroups = { city1: [], city2: [], city3: [], vil: [], peak: [], peak2: [], air: [], city4: [] };
function textMarker(ll, html, cls, size, dot){
  var inner = dot === 'dot' ? '<s class="ldot"></s>' + html : html;
  return L.marker(ll, {
    pane: 'labels', interactive: false, keyboard: false,
    icon: L.divIcon({ className: 'mlabel ' + cls, html: inner, iconSize: null, iconAnchor: size })
  });

function buildLabels(){
  Object.keys(labelGroups).forEach(function(k){ labelGroups[k] = []; });
  var pinCity = { Manchester:1, Istanbul:1, Tbilisi:1, Copenhagen:1, Mestia:1,
                  Zhabeshi:1, Adishi:1, Ushguli:1 };
  var close = { Mestia:'mestiatour', Zhabeshi:'tengo', Adishi:'riverside', Ushguli:'oldhouse' };
  D.cities.forEach(function(c){
    var big = c.r === 1;
    if (close[c.n]){
      var st = D.stays[close[c.n]];
      labelGroups.city4.push(textMarker(st ? st.ll : c.ll, c.n, 'city above', [0, 21]));
      return;
    }
    var anchor = pinCity[c.n] ? [-19, 4] : [-8, 5];
    labelGroups['city' + c.r].push(textMarker(c.ll, c.n,
      'city' + (big ? ' big' : '') + (pinCity[c.n] ? ' offset' : ''),
      anchor, pinCity[c.n] ? 'city' : 'dot'));
  });
  var hideVil = { Zhabeshi:1, Adishi:1, Chazhashi:1, Zhibiani:1, Murkmeli:1, Mestia:1 };
  var stayPts = Object.keys(D.stays).map(function(k){ return D.stays[k].ll; });
  D.villages.forEach(function(v){
    if (hideVil[v.n]) return;
    var near = stayPts.some(function(p){
      return Math.abs(p[0]-v.ll[0]) < 0.011 && Math.abs(p[1]-v.ll[1]) < 0.016;
    });
    if (near) return;
    labelGroups.vil.push(textMarker(v.ll, v.n, 'vil', [-5, 5]));
  });
  var HERO = { Ushba:1, Tetnuldi:1, Shkhara:1 };

      '<b>&#9651; ' + p.n + '</b><em>' + p.e.toLocaleString() + ' m</em>', 'peak', [-6, 4]);
    (HERO[p.n] ? labelGroups.peak : labelGroups.peak2).push(m);

/* ---------------- routes ---------------- */
var MODE = {
  air:      { w: 1.8, dash: '11 8',    cap: 'butt'  },
  rail:     { w: 2.8, dash: '11 4 2 4',cap: 'butt'  },
  road:     { w: 3.2, dash: null,      cap: 'round' },
  hike:     { w: 3.6, dash: '0.1 7',   cap: 'round' },
  transfer: { w: 1.6, dash: '2 5',     cap: 'round' }
};
var routeLayer = L.layerGroup([], { pane: 'routes' }).addTo(map);
var nowMarker = null;

function drawRoutes(state){
  routeLayer.clearLayers();
  var done = cssv('--glacier'), amber = cssv('--amber'), future = cssv('--faint'), sea = cssv('--sea');
  var z = map.getZoom();
  var live = state.live || { phase: 'before', liveIndex: 0 };
  D.days.forEach(function(day, di){
    (day.legs || []).forEach(function(id){
      var rt = D.routes[id]; if (!rt) return;
      if (rt.mode === 'air' && z >= 7.2) return;
      if (rt.mode === 'transfer' && z < 8) return;
      if (rt.mode !== 'air' && z < 4.6) return;
      var m = MODE[rt.mode] || MODE.road;
      var rel;
      if (live.phase === 'before') rel = 'future';
      else if (live.phase === 'after') rel = 'past';
      else rel = di < live.liveIndex ? 'past' : (di > live.liveIndex ? 'future' : 'today');
      var sel = di === state.dayIndex;
      var frac = rel === 'past' ? 1 : (rel === 'future' ? 0 : (state.legFrac[id] != null ? state.legFrac[id] : 0));

      if (rt.mode !== 'air' && rt.mode !== 'transfer' && z >= 6){
        L.polyline(rt.c, { pane:'routes', color: sea, weight: m.w + 3.2, opacity: isDark() ? 0.55 : 0.30,
          lineCap: 'round', interactive: false, smoothFactor: 1.1 }).addTo(routeLayer);
      }
      // remaining / whole route in "not yet" styling
      if (frac < 1){
        L.polyline(rt.c, {
          pane: 'routes', color: future,
          weight: m.w + (sel ? 0.5 : 0),
          opacity: rel === 'today' ? 0.62 : (sel ? 0.72 : 0.34),
          dashArray: m.dash || '5 6', lineCap: m.cap,
          interactive: false, smoothFactor: 1.1
        }).addTo(routeLayer);
      }
      // travelled portion
      if (frac > 0){
        var seg = sliceLine(rt.c, frac);
        if (seg.length > 1){
          L.polyline(seg, {
            pane: 'routes', color: rel === 'today' ? amber : done,
            weight: m.w + 5.5, opacity: 0.16, lineCap: 'round',
            interactive: false, smoothFactor: 1.2
          }).addTo(routeLayer);
          L.polyline(seg, {
            pane: 'routes', color: rel === 'today' ? amber : done,
            weight: m.w + (rel === 'today' ? 0.7 : 0) + (sel ? 0.5 : 0),
            opacity: sel || rel === 'today' ? 1 : 0.78,
            dashArray: m.dash, lineCap: m.cap,
            className: rel === 'today' && frac < 1 ? 'flow' : '',
            interactive: false, smoothFactor: 1.1
          }).addTo(routeLayer);
        }
      }
    });
  });
}

function buildPins(state){
  pinLayer.clearLayers();
  var live = state.live || { phase: 'before', liveIndex: 0 };
  var selDay = state.day ? state.day.d : -1;
  Object.keys(D.stays).forEach(function(key){
    var s = D.stays[key];
    var nights = stayNights[key] || [];
    var ghost = !!s.ghost;
    var onSelDay = nights.indexOf(selDay) >= 0 || nights.indexOf(selDay - 1) >= 0;
    if (state.zoom < 9.0 && !onSelDay) return;
    if (ghost && state.zoom < 10.5) return;
    var last = nights.length ? nights[nights.length-1] : 0;
    var done = !ghost && live.phase !== 'before' &&
               (live.phase === 'after' || last <= live.liveIndex);
    var sel = !ghost && nights.indexOf(selDay) >= 0;
    var label = nights.length ? nights.join('·') : '';
    var cls = 'pin' + (done ? ' done' : '') + (sel ? ' sel' : '') + (ghost ? ' ghost' : '');
    var m = L.marker(s.ll, {
      icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11],
        html: '<div class="' + cls + '"><div class="pin-d">' + (label || '&#9679;') + '</div>' +
              (state.zoom >= 8.5 && !ghost ? '<div class="pin-t">' + (s.short || s.n) + '</div>' : '') + '</div>' }),
      zIndexOffset: sel ? 1000 : (done ? 400 : 200),
      title: s.n, riseOnHover: true
    });
    m.on('click', function(){
      var d = nights.length ? nights[0] : null;
      if (d) select(d - 1, true);

    m.addTo(pinLayer);
  });

/* zoom-dependent visibility */
function applyZoom(){
  var z = map.getZoom();
  function toggle(layer, on){
    if (on && !map.hasLayer(layer)) map.addLayer(layer);
    if (!on && map.hasLayer(layer)) map.removeLayer(layer);
  }
  reliefLayers.forEach(function(ov){
    var on = z >= ov._minZ;
    if (on && !map.hasLayer(ov)) map.addLayer(ov);
    if (!on && map.hasLayer(ov)) map.removeLayer(ov);
  });
  toggle(hydro, z >= 9.5);
  toggle(ice,   z >= 9);
  toggle(poiLayer, z >= 10.5);
  var show = { city1: z >= 3, city2: z >= 5.5, city3: z >= 7.5, city4: z >= 9.4,
               peak: z >= 8.5, peak2: z >= 11, vil: z >= 10.5,
               air: false };
  Object.keys(labelGroups).forEach(function(k){
    labelGroups[k].forEach(function(m){
      if (show[k] && !map.hasLayer(m)) map.addLayer(m);
      if (!show[k] && map.hasLayer(m)) map.removeLayer(m);
    });
  });
}

var state = { dayIndex: 0, day: null, follow: true, legFrac: {}, pos: null, zoom: 9 };

function computeLive(){
  var t = now(), li = liveDayIndex(t);
  var res = { phase: 'during', liveIndex: li, legFrac: {}, pos: null, moving: null };
  if (li === -1){ res.phase = 'before'; res.liveIndex = 0; }
  else if (li === -2){ res.phase = 'after'; res.liveIndex = D.days.length - 1; }
  var day = D.days[res.liveIndex];
  // completed legs of earlier days
  D.days.forEach(function(d, i){
    if (i < res.liveIndex) (d.legs || []).forEach(function(id){ res.legFrac[id] = 1; });
  });
  if (res.phase === 'after'){
    D.days.forEach(function(d){ (d.legs || []).forEach(function(id){ res.legFrac[id] = 1; }); });
    res.pos = D.places.man.ll;
    return res;
  }
  if (res.phase === 'before'){
    res.pos = D.places.man.ll;
    return res;
  }
  var moves = day.move || [], lastDone = null;
  moves.forEach(function(mv){
    var a = new Date(mv.from).getTime(), b = new Date(mv.to).getTime(), tt = t.getTime();
    if (tt >= b){ res.legFrac[mv.r] = 1; lastDone = mv; }
    else if (tt >= a){
      var f = (tt - a)/(b - a);
      res.legFrac[mv.r] = f;
      res.pos = atFrac(D.routes[mv.r].c, f);
      res.moving = mv;
    } else if (res.legFrac[mv.r] == null) res.legFrac[mv.r] = 0;
  });
  if (!res.pos){
    if (lastDone) res.pos = D.routes[lastDone.r].c[D.routes[lastDone.r].c.length-1];
    else {
      var before = day.rest && day.rest.before;
      res.pos = (D.stays[before] && D.stays[before].ll) || (D.places[before] && D.places[before].ll) ||
                (day.view && day.view.center) || D.places.mestia.ll;
    }
  }
  return res;
}

function mapPad(){
  if (window.innerWidth >= 900) return { tl: [24, 96], br: [24, 78] };
  var sh = document.getElementById('sheet');
  var h = sh ? sh.getBoundingClientRect().height : 260;
  return { tl: [14, 150], br: [14, Math.min(h + 70, window.innerHeight * 0.62)] };
}
function fitDay(day, animate){
  var v = day.view || {};
  var pd = mapPad();
  if (v.fit){
    var pts = [];
    v.fit.forEach(function(id){ if (D.routes[id]) pts = pts.concat(D.routes[id].c); });
    if (day.stay && D.stays[day.stay]) pts.push(D.stays[day.stay].ll);
    if (pts.length){
      var b = L.latLngBounds(pts).pad(v.pad != null ? v.pad : 0.2);
      map.flyToBounds(b, { animate: animate !== false, duration: 0.85, maxZoom: 13.5,
        paddingTopLeft: pd.tl, paddingBottomRight: pd.br });
      return;
    }
  }
  var c = v.center || [41.71, 44.80];
  var off = (pd.br[1] - pd.tl[1]) / 2;
  var pt = map.project(c, v.zoom || 12).add([0, -off]);
  map.flyTo(map.unproject(pt, v.zoom || 12), v.zoom || 12,
    { animate: animate !== false, duration: 0.85 });
}

function refreshMap(){
  state.zoom = map.getZoom();
  drawRoutes(state);
  buildPins(state);
  buildLM();
  if (nowMarker){ map.removeLayer(nowMarker); nowMarker = null; }
  var live = state.live;
  if (live && live.phase === 'during' && live.pos){
    nowMarker = L.marker(live.pos, {
      zIndexOffset: 2000, title: 'Where they are right now',
      icon: L.divIcon({ className: '', iconSize: [15,15], iconAnchor: [7.5,7.5],
        html: '<div class="now-dot"><i></i><i></i><b></b></div>' })
    }).addTo(map);
  }
  applyZoom();
}

/* ---------------- sheet rendering ---------------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function profileSVG(rt){
  var p = rt.prof; if (!p) return '';
  var W = 300, H = 82, n = p.ele.length;
  var maxKm = p.cum[n-1];
  var lo = Math.min.apply(null, p.ele), hi = Math.max.apply(null, p.ele);
  var pad = (hi - lo) * 0.14 || 50;
  var y0 = lo - pad, y1 = hi + pad;
  function X(i){ return p.cum[i]/maxKm*W; }
  function Y(e){ return H - (e - y0)/(y1 - y0)*H; }
  var d = '', i;
  for (i = 0; i < n; i++) d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.ele[i]).toFixed(1);
  var area = d + 'L' + W + ' ' + H + 'L0 ' + H + 'Z';
  var hiI = p.ele.indexOf(hi);
  var grid = '';
  [0.25, 0.5, 0.75].forEach(function(f){
    grid += '<line x1="0" x2="' + W + '" y1="' + (H*f).toFixed(1) + '" y2="' + (H*f).toFixed(1) +
            '" stroke="var(--line-soft)" stroke-width="1"/>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
    'aria-label="Elevation profile, ' + Math.round(lo) + ' to ' + Math.round(hi) + ' metres">' +
    '<defs><linearGradient id="pg' + hiI + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="var(--amber)" stop-opacity=".34"/>' +
    '<stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#pg' + hiI + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--amber)" stroke-width="1.6" ' +
      'stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + X(hiI).toFixed(1) + '" cy="' + Y(hi).toFixed(1) + '" r="2.6" fill="var(--snow)" ' +
      'stroke="var(--amber)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>' +
    '</svg>';
}

function stayCard(key, ghost){
  var s = D.stays[key]; if (!s) return '';
  var links = '';
  if (s.maps) links += '<a href="' + esc(s.maps) + '" target="_blank" rel="noopener">' +
    svg('pinIc') + 'Map</a>';
  if (s.web) links += '<a href="' + esc(s.web) + '" target="_blank" rel="noopener">' +
    svg('globe') + 'Website</a>';
  if (s.phone) links += '<a href="tel:' + esc(s.phone.replace(/\s/g,'')) + '">' +
    svg('view') + esc(s.phone) + '</a>';
  return '<div class="stay' + (ghost ? ' ghost' : '') + '">' +
    '<div class="stay-h"><div class="stay-ic">' + svg(ghost ? 'warn' : 'bed') + '</div>' +
    '<div><div class="stay-n">' + esc(s.n) + '</div>' +
