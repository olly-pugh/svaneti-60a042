<style>
:root{
  --ink:#0B1116; --panel:#111C24; --panel-2:#19272F; --panel-3:#22333D;
  --line:#2A3C47; --line-soft:#1F2E37;
  --snow:#E9EFF1; --mist:#93A9B4; --faint:#647A86;
  --amber:#EFA845; --amber-deep:#C97F1E; --amber-glow:rgba(239,168,69,.20);
  --glacier:#79CBE1; --glacier-deep:#3D93AC;
  --sea:#0A1620; --land:#22323B; --ice:#CFE6EE; --river:#33586B;
  --shadow:0 18px 46px -12px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.4);
  --warn:#E4785C;
  --f-see:#EFA845; --f-view:#79CBE1; --f-eat:#8CC79B; --f-drink:#BCA2DE; --f-shop:#E7A183;
  --sheet-h:38vh;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#E9EEF0; --panel:#FFFFFF; --panel-2:#F3F7F8; --panel-3:#E7EEF0;
  --line:#CEDCE1; --line-soft:#E1EAED;
  --snow:#15242C; --mist:#5B7482; --faint:#7E949F;
  --amber:#A96612; --amber-deep:#8A5210; --amber-glow:rgba(169,102,18,.14);
  --glacier:#15748F; --glacier-deep:#0E5A70;
  --sea:#BED5E0; --land:#E4EAE3; --ice:#FBFDFE; --river:#7FAABE;
  --shadow:0 16px 40px -14px rgba(26,50,64,.30), 0 1px 4px rgba(26,50,64,.12);
  --warn:#B4442A;
  --f-see:#A9660F; --f-view:#0F6D88; --f-eat:#2C6B43; --f-drink:#66459A; --f-shop:#9A4A22;
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ink:#E9EEF0; --panel:#FFFFFF; --panel-2:#F3F7F8; --panel-3:#E7EEF0;
    --line:#CEDCE1; --line-soft:#E1EAED;
    --snow:#15242C; --mist:#5B7482; --faint:#7E949F;
    --amber:#A96612; --amber-deep:#8A5210; --amber-glow:rgba(169,102,18,.14);
    --glacier:#15748F; --glacier-deep:#0E5A70;
    --sea:#BED5E0; --land:#E4EAE3; --ice:#FBFDFE; --river:#7FAABE;
    --shadow:0 16px 40px -14px rgba(26,50,64,.30), 0 1px 4px rgba(26,50,64,.12);
    --warn:#B4442A;
  --f-see:#A9660F; --f-view:#0F6D88; --f-eat:#2C6B43; --f-drink:#66459A; --f-shop:#9A4A22;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink); color:var(--snow);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  overflow:hidden; overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--glacier);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* ============ SHELL ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#map{position:absolute;inset:0;background:var(--sea);z-index:0}
.leaflet-container{background:var(--sea);font-family:inherit;outline:none}
.leaflet-control-attribution{
  background:color-mix(in srgb, var(--panel) 78%, transparent)!important;
  color:var(--faint)!important;font-size:9px!important;
  font-family:"IBM Plex Mono",monospace!important;backdrop-filter:blur(6px);
  border-radius:5px 0 0 0;padding:2px 6px!important;
}
.leaflet-control-attribution a{color:var(--faint)!important}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important}
.leaflet-bar a{
  background:color-mix(in srgb, var(--panel) 88%, transparent)!important;color:var(--snow)!important;
  border-bottom:1px solid var(--line-soft)!important;width:32px!important;height:32px!important;
  line-height:32px!important;backdrop-filter:blur(8px);
}
.leaflet-bar a:hover{background:var(--panel-2)!important}

/* ============ HEADER ============ */
#hdr{
  position:relative;z-index:500;pointer-events:none;
  padding:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0
          max(12px, env(safe-area-inset-left));
  display:flex;gap:8px;align-items:flex-start;
}
.hdr-card{
  pointer-events:auto;
  background:color-mix(in srgb, var(--panel) 90%, transparent);
  backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid var(--line-soft);border-radius:13px;
  box-shadow:var(--shadow);
  padding:9px 13px;min-width:0;
}
#status{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;max-width:620px}
#status-top{display:flex;align-items:center;gap:7px;min-width:0}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none;
  box-shadow:0 0 0 0 var(--amber-glow);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--amber-glow)}70%{box-shadow:0 0 0 11px rgba(239,168,69,0)}100%{box-shadow:0 0 0 0 rgba(239,168,69,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
#status-label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--amber);white-space:nowrap}
#status-clock{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);white-space:nowrap}
#status-where{
  font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;
  font-weight:600;font-size:clamp(15px,4.4vw,19px);line-height:1.24;letter-spacing:-.011em;
  text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
#hdr-btns{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb, var(--panel) 90%, transparent);
  backdrop-filter:blur(14px);border:1px solid var(--line-soft);box-shadow:var(--shadow);
  transition:background .15s, border-color .15s, transform .12s;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{background:var(--amber);border-color:var(--amber);color:#0B1116}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ============ DAY RAIL ============ */
#rail-wrap{position:relative;z-index:500;margin-top:auto;pointer-events:none}
#rail{
  pointer-events:auto;
  display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;
  padding:8px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
}
#rail::-webkit-scrollbar{display:none}
.chip{
  flex:none;position:relative;
  min-width:60px;padding:6px 9px 7px;border-radius:11px;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(12px);
  border:1px solid var(--line-soft);
  box-shadow:0 6px 18px -8px rgba(0,0,0,.55);
  text-align:left;transition:transform .14s, border-color .14s, background .14s;
}
.chip:active{transform:scale(.95)}
.chip-d{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;color:var(--faint)}
.chip-t{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:13px;line-height:1.15;
  white-space:nowrap;color:var(--mist)}
.chip.done .chip-t{color:var(--snow)}
.chip.done .chip-d{color:var(--glacier-deep)}
.chip.sel{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 15%, var(--panel));}
.chip.sel .chip-t{color:var(--snow)}
.chip.today::after{
  content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 6px var(--amber)}
.chip-bar{height:2px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.chip-bar i{display:block;height:100%;background:var(--glacier);border-radius:2px}
.chip.today .chip-bar i{background:var(--amber)}

/* ============ SHEET ============ */
#sheet{
  position:relative;z-index:520;
  background:var(--panel);
  border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;
  box-shadow:0 -14px 44px -16px rgba(0,0,0,.7);
  display:flex;flex-direction:column;
  height:var(--sheet-h);
  max-height:88vh;
  transition:height .3s cubic-bezier(.22,.9,.26,1);
}
#sheet[data-snap="0"]{height:calc(92px + env(safe-area-inset-bottom))}
#sheet[data-snap="1"]{height:min(360px,42vh)}
#sheet[data-snap="2"]{height:86vh}
#grab{
  flex:none;padding:8px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none;
}
#grab i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line);transition:background .15s}
#grab:hover i{background:var(--faint)}
#sheet-head{flex:none;padding:0 16px 10px;display:flex;align-items:baseline;gap:9px}
#sheet-day{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);flex:none}
#sheet-title{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:clamp(17px,4.8vw,21px);line-height:1.16;letter-spacing:-.017em;flex:1;min-width:0;
  text-wrap:balance;

:00+04:00","title":"Mestia → Zhabeshi","sub":"Trek day 1 of 3","where":"Walking east up the Mulkhra valley, tower village to tower village","view":{"fit":["hike-mestia-zhabeshi"],"pad":0.5},"legs":["hike-mestia-zhabeshi"],"stay":"tengo","move":[{"r":"hike-mestia-zhabeshi","from":"2026-09-05T09:00:00+04:00","to":"2026-09-05T15:30:00+04:00"}],"rest":{"before":"mestiatour","after":"tengo"},"trek":"hike-mestia-zhabeshi","events":[{"t":"≈09:00","k":"hike","h":"Out of Mestia on the north bank","s":"16.5 km · +663 m / −423 m · about 6 h at a walking pace"},{"t":"midday","k":"view","h":"Through Lakhiri and Mulakhi","s":"Balcony path high above the river, defensive towers in every hamlet"},{"t":"≈15:30","k":"bed","h":"Guest House Tengo, Zhabeshi","s":"£16 on arrival · +995 551 11 80 83"}],"chip":"Zhabeshi"},{"d":6,"date":"2026-09-06","dow":"Sun","tz":"Asia/Tbilisi","start":"2026-09-06T00:00:00+04:00","title":"Zhabeshi → Adishi","sub":"Trek day 2 of 3","where":"Up over the Tetnuldi shoulder and down into Adishi","view":{"fit":["hike-zhabeshi-adishi"],"pad":0.5},"legs":["hike-zhabeshi-adishi"],"stay":"riverside","ghost":"vista","move":[{"r":"hike-zhabeshi-adishi","from":"2026-09-06T09:00:00+04:00","to":"2026-09-06T14:30:00+04:00"}],"rest":{"before":"tengo","after":"riverside"},"trek":"hike-zhabeshi-adishi","events":[{"t":"≈09:00","k":"hike","h":"The big climb out of Zhabeshi","s":"11.9 km · +992 m / −531 m · high point 2,516 m. Short day, steep first half"},{"t":"midday","k":"view","h":"Tetnuldi, 4,858 m, straight ahead","s":"The traverse crosses the Tetnuldi ski road before dropping to Adishi"},{"t":"≈14:30","k":"bed","h":"Guest House River Side, Adishi","s":"99 GEL · already paid, non-refundable. Adishi sits at 2,094 m and has no shop"},{"t":"note","k":"warn","h":"Double booking to sort out","s":"Hotel Vista Adishi (£22) was booked for tonight too — worth one more try at a refund"}],"chip":"Adishi"},{"d":7,"date":"2026-09-07","dow":"Mon","tz":"Asia/Tbilisi","start":"2026-09- ion is the Basilica Cistern's 19:30–22:00 'Night Shift', which costs ₺3,000 / ≈£46 and is hard to justify). Sultanahmet is a near-dry district: the honest options are the hostel's own roof terrace or an expensive hotel rooftop. Karaköy and Beyoğlu have the real bars, six T1 tram stops away (₺20 with an İstanbulkart), but going there after a 20:00 arrival with a 07:00 start is a bad trade. D2: sunrise is 06:33, Gülhane Park opens 06:00 and Balkan Lokantası before 07:00, so you get a genuinely empty old city for an hour before the Blue Mosque (free, 08:30) and Hagia Sophia (€25, ~09:00) open. Skip Topkapı Palace — ₺2,750 / ≈£42, opens 09:00 and needs 2–3 hours — and skip the Turkish & Islamic Arts Museum, which opens at 10:00 in summer. 2 Sep is a Wednesday, so nothing has a weekday closure (Topkapı's Tuesday closure and the Grand Bazaar's Sunday closure both miss you). Scam notes: never pick up a dropped shoe-shine brush; refuse any menu without printed prices and check the bill; ignore friendly men offering to take you to 'a local bar'. Transfer: from the hostel walk 8 min to Sirkeci for Marmaray → Ayrılık Çeşmesi → M4 to Sabiha Gökçen, about 75–90 minutes, so leaving at 10:30 for a 13:15 flight is tight but fine — usefully, the best breakfast spots are on that same walk.","items":[{"id":"blue-mosque","n":"Blue Mosque","n2":"Sultan Ahmet Camii","k":"monument","ll":[41.00538,28.97685],"price":"Free — no ticket, donations optional","gbp":"Free","open":"08:30–18:30. Tourist slots roughly 08:30–12:15, 13:45–16:30, 17:30–18:30; it shuts about an hour before each prayer and reopens ~30 min after.","win":"D2 morning for the interior (08:30 opening) · D1 evening for the floodlit exterior","mins":40,"d":"Sultan Ahmed I's 1616 imperial mosque, six minarets, and an interior lined with more than 20,000 İznik tiles — the blue that gives it the tourist name. Still an active mosque, and free, which makes it the best-value monument in the district.","go":"9 min walk: south-west from the hostel across Sultanahmet Square and past the Hippodrome; the visitor entrance is the monumental door on the south side.","dist":"700 m · 9 min walk","tip":"Shoulders and knees covered, shoes off and carried in a bag, headscarf for women — free scarves and wraps are handed out at the door.","links":[{"t":"Istanbul Travel Blog (2026 hours)","u":"https://istanbultravelblog.com/blue-mosque-istanbul/"},{"t":"Storyhunt guide","u":"https://www.storyhunt.io/en/articles/the-blue-mosque"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Blue_Mosque,_Istanbul"}],"dy":[1,2]},{"id":"hippodrome-night","n":"Hippodrome & Sultanahmet Square after dark","n2":"Sultanahmet Meydanı / At Meydanı","k":"monument","ll":[41.00652,28.97598],"price":"Free","gbp":"Free","open":"Open-air public square, 24 h. Floodlights on from dusk; sunset on 1 Sep 2026 is 19:40, so it is fully lit when you arrive.","win":"D1 evening","mins":40,"d":"The spine of the Byzantine chariot-racing track, now a long pedestrian plaza carrying four monuments in a row: the Egyptian Obelisk of Theodosius, the bronze Serpent Column looted from Delphi, the Walled Obelisk, and the German Fountain of 1900. The Blue Mosque and Hagia Sophia are floodlit on either side.","go":"7 min walk south-west from the hostel via Alemdar Cad., past the Basilica Cistern entrance and across the tram line.","dist":"560 m · 7 min walk","tip":"This is the single best free thing to do at 20:00 — everything is lit, the day-tour crowds have gone, and the whole circuit is a 20-minute stroll.","links":[{"t":"Wikipedia — Hippodrome of Constantinople","u":"https://en.wikipedia.org/wiki/Hippodrome_of_Constantinople"},{"t":"Istanbul Insider — opening hours reference","u":"https://theistanbulinsider.com/opening-hours-of-istanbul-sightseeing-spots-and-attractions/"}],"dy":[1]},{"id":"basilica-cistern","n":"Basilica Cistern","n2":"Yerebatan Sarnıcı","k":"sight","ll":[41.00848,28.97838],"price":"Daytime ₺1,950 · evening 'Night Shift' session ₺3,000 · Museum Pass İstanbul NOT valid","gbp":"≈£30 daytime · ≈£46 evening","open":"09:00–18:30 daily, then a separate ticketed Night Shift 19:30–22:00. No closed days.","win":"either — Night Shift on D1, or the 09:00 opening on D2","mins":45,"d":"Justinian's 6th-century underground water reservoir: 336 columns in a flooded hall, two Medusa heads reused as column bases, and modern art installations and lighting since the 2022 refit. A visit is a 30–40 minute walk-through.","go":"3 min walk west from the hostel to Yerebatan Cad., opposite the Hagia Sophia forecourt.","dist":"240 m · 3 min walk","tip":"The worst value per minute in Sultanahmet — ≈£30 for 35 minutes underground. On a budget pick this OR Hagia Sophia, not both, and if you do pick it take the cheaper daytime slot at 09:00 on D2 rather than the ₺3,000 evening one.","links":[{"t":"Istanbul Clues (2026 prices)","u":"https://istanbulclues.com/istanbul-basilica-cistern-entrance-fee/"},{"t":"Basilica Cistern ticket info","u":"https://www.basilicacistern.gen.tr/basilica-cistern-ticket-price/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Basilica_Cistern"}],"dy":[1,2]},{"id":"hagia-sophia","n":"Hagia Sophia","n2":"Ayasofya-i Kebir Camii Şerifi","k":"monument","ll":[41.0085,28.98001],"price":"€25 upper-gallery ticket for non-Muslim visitors · Museum Pass İstanbul is NOT valid · the ground floor is a working mosque, free but for worship only","gbp":"≈£21","open":"Sources differ: summer (Apr–Oct) listed as 08:00–19:00 by Istanbul Clues, 09:00–18:00 elsewhere. Closes to visitors during each of the five daily prayers.","win":"D2 morning — be at the door by 08:45 and budget an hour including security","mins":60,"d":"The 6th-century Justinianic basilica, converted to a mosque in 1453, museum from 1935 and mosque again since 2020. Tourists now follow a separate route to the upper galleries, which is where the surviving Byzantine mosaics are — the Deësis, and the imperial panels.","go":"4 min walk: out of Cheers Hostel down Zeynep Sultan Camii Sok. to Alemdar Cad., turn right; the tourist entrance is on the east side of the building, facing the Bosphorus.","dist":"330 m · 4 min walk","tip":"Skip-the-line tickets are not QR codes — they must be collected in person from an office on the Hippodrome, so buying online saves you nothing on a one-hour visit. Just queue.","links":[{"t":"Istanbul Clues (fees + hours)","u":"https://istanbulclues.com/hagia-sophia-entrance-fee-opening-hours/"},{"t":"Istanbul Insider — 2026 entrance fees","u":"https://theistanbulinsider.com/entrance-fees-of-istanbuls-main-tourist-attractions/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Hagia_Sophia"}],"dy":[2]},{"id":"suleymaniye-mosque","n":"Süleymaniye Mosque","n2":"Süleymaniye Camii","k":"monument","ll":[41.01623,28.96395],"price":"Free","gbp":"Free","open":"09:00–18:00 daily, closed to visitors around each prayer (roughly 30 min before to 30 min after)","win":"D2 morning — but it is an either/or against Hagia Sophia, not an addition","mins":45,"d":"Mimar Sinan's 1557 masterpiece for Süleyman the Magnificent, and the better building of the two big domes — calmer, emptier and free. The terrace on the courtyard's north side gives the best free panorama of the Golden Horn and the Galata skyline in the old city.","go":"23 min walk uphill north-west through the university quarter. Faster: T1 tram Sultanahmet → Beyazıt-Kapalıçarşı (1 stop, ₺20 with an İstanbulkart), then 10 min north on foot past the Istanbul University gate.","dist":"1.8 km · 23 min walk (or 1 tram stop + 10 min)","tip":"Round trip from the hostel is an hour minimum. With a 10:30 departure, do this instead of Hagia Sophia if you would rather save £21 and see a better mosque than see the mosaics.","links":[{"t":"Istanbul Clues (hours)","u":"https://istanbulclues.com/istanbul-suleymaniye-mosque/"},{"t":"Advantour visitor guide","u":"https://www.advantour.com/turkey/istanbul/suleymaniye-mosque.htm"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/S%C3%BCleymaniye_Mosque"}],"dy":[2]},{"id":"galata-bridge-night","n":"Galata Bridge at night","n2":"Galata Köprüsü","k":"view","ll":[41.02001,28.97312],"price":"Free to walk","gbp":"Free","open":"24 h","win":"D1 evening","mins":45,"d":"The bridge across the Golden Horn, lined the whole way with night anglers and their rods. From the middle you get the Süleymaniye and Yeni Camii domes silhouetted on the old-city side and the lit Galata Tower on the other — the classic Istanbul night view, and it costs nothing.","go":"20 min walk north via Ankara Cad. through Sirkeci to Eminönü. Or T1 tram Sultanahmet → Eminönü, 2 stops, ₺20 with an İstanbulkart, then 3 min to the bridge head.","dist":"1.5 km · 20 min walk (or 2 tram stops)","tip":"The lower-deck bridge restaurants are the classic Istanbul overcharge and the touts are relentless — eat balık ekmek on the Eminönü waterfront before you step onto the bridge.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Galata_Bridge"},{"t":"Turkey Travel Planner — Eminönü waterfront","u":"https://turkeytravelplanner.com/go/Istanbul/RestsCafesBars/eminonu/balik_ekmek.html"}],"dy":[1]},{"id":"seven-hills-rooftop","n":"Seven Hills Restaurant rooftop","k":"view","ll":[41.00637,28.97971],"price":"Dinner mains quoted €45–€90; rooftop guides put it at roughly three times the places across the street. Go for one drink, not a meal.","gbp":"≈£39–£77 for dinner — treat it as a drink-only viewpoint","open":"07:30–23:00 daily (OpenStreetMap listing)","win":"D1 evening","mins":60,"d":"A 360° hotel terrace with the Blue Mosque, Hagia Sophia, the Marmara and the Bosphorus all visible from the same table. The food is priced for the view; the view is genuinely the best paid one in Sultanahmet.","go":"8 min walk: south past Hagia Sophia, then right into Tevkifhane Sok. behind the Four Seasons — the terrace is on top of the Seven Hills Hotel.","dist":"580 m · 8 min walk","tip":"Order one drink, take the photos, then walk five minutes and eat properly. Nobody will mind — plenty of people go up for exactly that.","links":[{"t":"Official site","u":"https://www.sevenhillsrestaurant.com/"},{"t":"The Rooftop Guide","u":"https://www.therooftopguide.com/rooftop-bars-in-istanbul/seven-hills-restaurant.html"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g293974-d1010030-Reviews-Seven_Hills_Restaurant-Istanbul.html"}],"dy":[1]},{"id":"gulhane-park","n":"Gülhane Park","n2":"Gülhane Parkı","k":"nature","ll":[41.01303,28.9809],"price":"Free","gbp":"Free","open":"06:00–22:00 daily","win":"either — but its whole point is D2 at 07:00","mins":45,"d":"The old outer garden of Topkapı Palace: plane trees, rose beds and paths dropping down the hill towards the Golden Horn. The terrace along the north-east edge looks straight out over the Bosphorus mouth to the Asian shore and the ferry traffic.","go":"7 min walk north from the hostel up Alemdar Cad. to the main gate beside the Topkapı outer wall — same place as the Gülhane T1 tram stop.","dist":"530 m · 7 min walk","tip":"At 07:00 (sunrise 06:33) this is the one place in Sultanahmet that is free, open and empty. Note that the Set Üstü Çay Bahçesi on the top terrace has recent 'closed' listings, so don't plan your breakfast çay around it.","links":[{"t":"Go Türkiye (official tourism)","u":"https://goturkiye.com/istanbul/gulhane-park"},{"t":"Forever Vacation (hours + fee)","u":"https://forevervacation.com/istanbul/gulhane-park"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/G%C3%BClhane_Park"}],"dy":[2]},{"id":"corlulu-ali-pasa","n":"Çorlulu Ali Paşa Medresesi tea garden","n2":"Erenler Nargile ve Çay Bahçesi","k":"cafe","ll":[41.00907,28.96845],"price":"Çay, Turkish coffee cooked on coals, and nargile — priced for the Istanbul University crowd rather than for tourists","gbp":"Cheap (no published 2026 list)","open":"07:00–02:00 daily","win":"either — the only thing near Sultanahmet open at both ends of your two windows","mins":60,"d":"A 1709 medrese courtyard off the tram street, vine-shaded and carpet-strewn, full of students playing backgammon over nargile. It does not announce itself from the street; you go through an unmarked doorway into the old cells.","go":"14 min walk west along Divanyolu / Yeniçeriler Cad. following the tram line towards Beyazıt — the entrance is at Yeniçeriler Cad. 36/28, on the right. Or one T1 stop to Çemberlitaş (₺20 with an İstanbulkart) and 3 min on foot.","dist":"1.0 km · 14 min walk (or 1 tram stop)","tip":"Open at 07:00 and until 02:00 — so it covers both the late end of D1 and the pre-dawn end of D2 when literally nothing else nearby is trading.","links":[{"t":"Istanbul Insider — outdoor cafés (address + hours)","u":"https://theistanbulinsider.com/top-10-outdoor-cafes-in-istanbul/"},{"t":"Turkey's For Life write-up","u":"https://www.turkeysforlife.com/2012/03/istanbul-corlulu-alipasa-medresesi.html"}],"dy":[1,2]},{"id":"hafiz-mustafa","n":"Hafız Mustafa 1864 (Sultanahmet)","k":"cafe","ll":[41.00804,28.97658],"price":"Baklava, künefe, sütlaç and Turkish coffee. No verified 2026 price list — it is a treat rather than a cheap stop, and portions are sold by weight.","gbp":"Mid-range (prices not published)","open":"The Divanyolu branch is listed as open 24 hours; the Sirkeci branch is tagged 24/7 on OpenStreetMap","win":"either","mins":30,"d":"A pastane trading since 1864 and the one dependable sweet stop inside the tourist zone — pistachio baklava, künefe, rice pudding, and properly made Turkish coffee.","go":"4 min walk south-west from the hostel to Divanyolu Cad., right beside the tram line at the Sultanahmet stop.","dist":"330 m · 4 min walk","tip":"Because it runs through the night it is the fallback if the 18:00 landing slips and you reach Sultanahmet at 21:30 with everything else shut.","links":[{"t":"Official site","u":"https://www.hafizmustafa.com/"},{"t":"TripAdvisor (Sultanahmet branch)","u":"https://www.tripadvisor.com/Restaurant_Review-g293974-d3610739-Reviews-HafIz_Mustafa_1864_Edebiyat_KIraathanesi-Istanbul.html"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Hafiz_Mustafa_1864"}],"dy":[1,2]},{"id":"koftecisi-selim-usta","n":"Tarihi Sultanahmet Köftecisi Selim Usta","k":"eat","ll":[41.008,28.97697],"price":"Köfte portion (6 grilled patties, rice, pickled chilli) ₺850 · fasulye piyazı ₺280 · ayran ₺120 · irmik helvası ₺260","gbp":"≈£13 for the köfte plate · ≈£19 with piyaz and ayran","open":"11:00–23:00 daily · cash only","win":"D1 evening","mins":45,"d":"Grilling the same four-ingredient beef köfte — meat, onion, salt, breadcrumb, no spices — on Divanyolu since 1920, now fourth generation. Fast turnover, no reservations, plastic chairs. The standard order is köfte, piyaz bean salad and an ayran.","go":"4 min walk south-west from the hostel to Divan Yolu Cad. No 12, on the corner of Sultanahmet Square by the tram stop.","dist":"320 m · 4 min walk","tip":"Cash only, and there are copycats up and down Divanyolu — the real one is No 12 with 'Selim Usta' on the sign. Walk-in waits of about 30 minutes are normal at dinner.","links":[{"t":"TripAdvisor (4.1 / 2,330 reviews, $)","u":"https://www.tripadvisor.com/Restaurant_Review-g293974-d1228891-Reviews-Tarihi_Sultanahmet_Koftecisi-Istanbul.html"},{"t":"Official site","u":"https://sultanahmetkoftesi.com/"},{"t":"2026 menu prices (TR)","u":"https://menufiyati.tr/sultanahmet-koftecisi-menu-fiyatlari/"}],"dy":[1]},{"id":"hocapasa-pidecisi","n":"Hocapaşa Pidecisi","k":"eat","ll":[41.01398,28.97561],"price":"Wood-fired pide made to order. No verified 2026 price list; the Hocapaşa lane as a whole is widely reported as roughly half Sultanahmet Square prices.","gbp":"Cheap (prices not published online)","open":"Hours not published online — the Hocapaşa lane trades through lunch and into the evening","win":"D1 evening","mins":40,"d":"A no-frills pide house on the pedestrianised Hoca Paşa Sok., where the chef slides each boat-shaped flatbread into a wood oven in front of you. Cheese, minced meat, egg, vegetable — pick a topping and it arrives in ten minutes.","go":"8 min walk north from the hostel via Alemdar Cad. and Ankara Cad. towards Sirkeci station, then left into Hoca Paşa Sok. — the whole lane is small restaurants, and this is the busiest one.","dist":"610 m · 8 min walk","tip":"Hoca Paşa Sok. is the honest alternative to Sultanahmet Square's tout-fronted restaurants; walk the length of it and pick whichever place has Turkish customers in it.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g293974-d2359659-Reviews-Hocapasa_Pidecisi-Istanbul.html"},{"t":"Istanbul Food","u":"https://istanbulfood.com/hocapasa-pidecisi-istanbul/"},{"t":"Turkey Travel Planner — Hocapaşa","u":"https://turkeytravelplanner.com/go/Istanbul/RestsCafesBars/hocapasa/index.html"}],"dy":[1]},{"id":"sehzade-cag-kebap","n":"Şehzade Cağ Kebap","n2":"Şehzade Erzurum Cağ Kebabı","k":"eat","ll":[41.01402,28.97527],"price":"One portion is two skewers of lamb with lavaş and onion; ≈€15 a head reported, ezme and salad extra. Pricier than the lokantas on the same street.","gbp":"≈£13","open":"Hours not published online — open for lunch and dinner on Hoca Paşa Sok.","win":"D1 evening","mins":45,"d":"Erzurum-style cağ kebabı: lamb stacked on a horizontal spit over wood, carved onto skewers to order. A genuinely regional thing you won't find much of in Britain, and one of Culinary Backstreets' long-standing Istanbul picks.","go":"8 min walk north to Hoca Paşa Sok. No 6, Sirkeci — same lane as Hocapaşa Pidecisi and Balkan Lokantası, a few doors along.","dist":"630 m · 8 min walk","tip":"Service is deliberately fast and can feel rushed; two skewers each plus bread is enough, so don't let the extras pile onto the bill.","links":[{"t":"Culinary Backstreets","u":"https://culinarybackstreets.com/stories/istanbul/sehzade-erzurum-cag-kebabi"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g293974-d2288800-Reviews-Sehzade_Cag_Kebap-Istanbul.html"},{"t":"Turkey's For Life","u":"https://www.turkeysforlife.com/2016/11/cag-kebabi-sehzade-istanbul.html"}],"dy":[1]},{"id":"eminonu-balik-ekmek","n":"Eminönü balık ekmek boats","n2":"Balık Ekmek, Eminönü sahili","k":"eat","ll":[41.0183,28.9731],"price":"≈₺150–200 per fish sandwich (2026)","gbp":"≈£2.50–£3","open":"Roughly late morning until late evening, daily","win":"D1 evening","mins":30,"d":"Grilled mackerel fillet, raw onion and salad in half a loaf, cooked on rocking boats moored between the ferry piers and Galata Bridge and handed over the rail. The cheapest real meal in Istanbul, eaten standing up with the bridge and the Yeni Camii lit behind you.","go":"17 min walk north via Ankara Cad. through Sirkeci to the Eminönü waterfront. Or T1 tram Sultanahmet → Eminönü, 2 stops, ₺20 with an İstanbulkart, then 3 min to the water.","dist":"1.3 km · 17 min walk (or 2 tram stops)","tip":"Squeeze the lemon over it and chase it with a glass of şalgam (pickled turnip juice) from the stalls behind. Agree the price before handing over money.","links":[{"t":"Yummy Istanbul guide","u":"https://yummyistanbul.com/fish-sandwich-istanbul-balik-ekmek/"},{"t":"Turkey Travel Planner","u":"https://turkeytravelplanner.com/go/Istanbul/RestsCafesBars/eminonu/balik_ekmek.html"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Bal%C4%B1k_ekmek"}],"dy":[1]},{"id":"balkan-lokantasi","n":"Balkan Lokantası","k":"eat","ll":[41.01388,28.97596],"price":"Self-service steam-tray esnaf lokantası — point at what you want and build a tray. No published 2026 price list, but this is repeatedly named the cheapest good meal near the old city.","gbp":"Cheap (prices not published online)","open":"Roughly 06:00–21:30 (one listing) to 07:00–23:00 (Yummy Istanbul) — sources differ, but it is open well before 07:00 and still serving in the evening","win":"either — and it is the answer for D2 breakfast at 07:00","mins":40,"d":"A working-class lokanta on the Hocapaşa lane in Sirkeci. Soups, bean stews, stuffed vegetables, börek and rice behind a steam counter; you point, they plate, you sit down with the local lunch crowd. Queues out into the street at peak.","go":"8 min walk north from the hostel: Alemdar Cad. → Ankara Cad. towards Sirkeci station, then left into the pedestrian Hoca Paşa Sok. (also listed at Hobyar, Ankara Cad. 35/A).","dist":"580 m · 8 min walk","tip":"Best-value eat in range and it opens before 07:00 — börek and çay here beats anything in Sultanahmet, and it is on the exact walk to Sirkeci for your Marmaray airport transfer.","links":[{"t":"Yummy Istanbul — 'cheapest good meal'","u":"https://yummyistanbul.com/best-restaurants-in-sultanahmet/"},{"t":"Trip.com reviews","u":"https://www.trip.com/travel-guide/istanbul-258-restaurant/balkan-lokantasi-15013859/"},{"t":"Listing (address + hours)","u":"https://mindtrip.ai/restaurant/istanbul-turkiye/balkan-lokantasi-sirkeci-eminonu-ve-sirkecide-baska-subemiz/re-FJLTCz9o"}],"dy":[2]},{"id":"cheers-rooftop-bar","n":"Cheers Hostel rooftop bar","k":"drink","ll":[41.0102,28.97801],"price":"Hostel-bar prices — no published list, but comfortably the cheapest drink in Sultanahmet with a Hagia Sophia view","gbp":"Cheap (no published price list)","open":"Evenings — it fills up after sunset and runs late; primarily for guests","win":"D1 evening","mins":90,"d":"The hostel's own roof terrace, looking straight across at a floodlit Hagia Sophia. Reviewers consistently single it out — karaoke and games nights, a mixed international crowd, and the reason people rate this place over the other Akbıyık Cad. hostels.","go":"You are already there. Take the stairs.","dist":"0 m · in the hostel","tip":"Given a 20:00 arrival and a 10:30 departure, this is the honest answer to 'where do we drink' — Sultanahmet is a conservative district and everything else with a terrace is a hotel charging several times as much.","links":[{"t":"Hostelworld","u":"https://www.hostelworld.com/hostels/p/37282/cheers-hostel/"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Hotel_Review-g293974-d1916174-Reviews-Cheers_Hostel-Istanbul.html"}],"dy":[1]},{"id":"mesale-cafe","n":"Meşale Cafe","k":"night","ll":[41.00559,28.97865],"price":"Tourist pricing — no reliable current list published. Ask the price of çay and nargile before you order.","gbp":"Well above local rates — check the menu first","open":"Evenings; the short whirling-dervish set is usually around 20:00, with live Turkish music for a couple of hours after","win":"D1 evening","mins":60,"d":"A sunken courtyard at the head of the Arasta Bazaar directly behind the Blue Mosque — cushioned benches, nargile, live saz and a free abbreviated whirling-dervish performance most evenings.","go":"9 min walk south past the Blue Mosque and down Mimar Mehmet Ağa Cad. to the top of Arasta Çarşısı.","dist":"660 m · 9 min walk","tip":"Lonely Planet's own line is 'a tourist trap par excellence, but still worth a visit'. The free dervish set is the reason to be there — nurse one çay and don't order food.","links":[{"t":"Official site","u":"https://mesalecafe.net/"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g293974-d2281755-Reviews-Mesale_Cafe-Istanbul.html"},{"t":"Sultanahmet nargile guide","u":"https://museumpass.istanbul/best-hookah-in-sultanahmet/"}],"dy":[1]},{"id":"grand-bazaar","n":"Grand Bazaar","n2":"Kapalıçarşı","k":"market","ll":[41.01096,28.96747],"price":"Free to enter","gbp":"Free","open":"08:30–19:00 Monday–Saturday · closed Sundays and on religious holidays. Wed 2 Sep 2026 is a normal trading day.","win":"D2 morning — from 08:30, and only if you skip the ticketed sights","mins":45,"d":"One of the oldest covered markets in the world, roughly 4,000 shops under vaulted 15th-century roofs. Worth it as architecture and atmosphere even if you buy nothing.","go":"15 min walk west along Divanyolu Cad. (follow the tram line) to the Nuruosmaniye gate. Or one T1 tram stop, Sultanahmet → Beyazıt-Kapalıçarşı, ₺20 with an İstanbulkart.","dist":"1.1 km · 15 min walk (or 1 tram stop)","tip":"At 08:30 shutters are still going up, nobody hassles you and the light through the roof vents is the photo. By 10:00 it is a scrum. Counter-offer at about 40% of the opening price.","links":[{"t":"Istanbul Clues (hours + tips)","u":"https://istanbulclues.com/istanbul-grand-bazaar-shopping-tips/"},{"t":"Storyhunt 2026 guide","u":"https://www.storyhunt.io/en/articles/grand-bazaar-istanbul"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Grand_Bazaar%2C_Istanbul"}],"dy":[2]}]},"tbilisi-chugureti":{"n":"Tbilisi · Chugureti","anchor":[41.70942,44.80289],"anchorName":"Fabrika","days":[2],"win":"Wed evening, from 17:50","note":"Be honest with yourselves: you land at 16:25, drop bags around 17:50 and you are jet-lagged. The good news is that Fabrika's own courtyard is the single best low-effort evening in Tbilisi and you are sleeping in it. A realistic Wednesday: coffee at Shavi (4 min, but it shuts at 19:00 so go straight there or skip it), khinkali at Khash-Khash 90 seconds from your bed, then Seven Roads for craft beer or Saamuri for natural wine in the courtyard, and stop. If you want more, the pedestrianised stretch of Aghmashenebeli Avenue is lit up and 9 min away, and the riverbank at Saarbrucken Square gives you Metekhi and Narikala floodlit for free. The clubs-are-weekend-only reality: Bassiani, KHIDI, Mtkvarze, Left Bank and TES are ALL closed Monday to Thursday — do not plan a Wednesday techno night, you will walk to a locked door. The one genuine exception near you is Mechanica Sound Club under the Saarbrucken bridge, which runs Wed-Sun from 20:00, 12 min walk. Skip Dry Bridge Market (packs up 17:00) and Dezerter Bazaar (shuts by 18:00 and dead from 14:00) — both are tomorrow-morning jobs, and Dezerter is where you should buy Svaneti trail food on Day 3, not tonight. Tonight, just hit a 24/7 Spar 2 min from the hostel for water and breakfast. 1 GEL = £0.28 (National Bank of Georgia, 1 Sep 2026: 1 GBP = 3.54 GEL).","items":[{"id":"aghmashenebeli-avenue","n":"Aghmashenebeli Avenue (New Tiflis)","n2":"დავით აღმაშენებლის გამზირი","k":"sight","ll":[41.70454,44.80157],"price":"Free","gbp":"Free","open":"Always open; best after dark when the facades are lit","win":"D2 evening","mins":45,"d":"The restored 19th-century heart of Chugureti: a cobbled, pedestrian-only stretch of about 500 m lined with pastel Art Nouveau facades, carved wooden balconies, ornate gates and original inscriptions, all floodlit at night. Cafe terraces spill onto the street. This is the single nicest thing you can do on foot from Fabrika without any planning.","go":"9 min walk south-west from Fabrika: down Ninoshvili St and onto the avenue; the pedestrianised section runs between roughly no. 15 and Marjanishvili Street.","dist":"550 m · 9 min walk","tip":"Walk it downhill towards the river and you come out at Saarbrucken Square with the Old Town lit up across the water — chain it with the riverbank viewpoint below.","links":[{"t":"Georgia Travel (official tourism)","u":"https://georgia.travel/agmashenebeli-avenue-in-tbilisi-neu-tiflis"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/David_Agmashenebeli_Avenue"},{"t":"TripAdvisor reviews","u":"https://www.tripadvisor.com/ShowUserReviews-g294195-d8536592-r428858340-Agmashenebeli_Avenue-Tbilisi.html"}],"dy":[2]},{"id":"marjanishvili-square","n":"Marjanishvili Square & Theatre","n2":"მარჯანიშვილის მოედანი","k":"sight","ll":[41.70938,44.79749],"price":"Free to walk · metro 1 GEL a ride with a Metromoney card (2 GEL refundable deposit)","gbp":"Free · metro ≈£0.28","open":"Square always open · metro station 06:00-24:00 daily","win":"D2 evening","mins":30,"d":"Your neighbourhood square and transport hub, named after Kote Marjanishvili, the father of modern Georgian theatre, whose 1928 theatre stands at 8 Marjanishvili Street a few steps away. Worth knowing simply because Marjanishvili metro is your gateway to the rest of the city and it is only 8 minutes from the hostel door.","go":"7 min walk west from Fabrika along Ninoshvili St then Marjanishvili St.","dist":"450 m to the square, 500 m to the metro · 7-8 min walk","tip":"Buy a Metromoney card here tonight (2 GEL deposit, refundable) — one 1 GEL tap buys 90 minutes of unlimited metro and bus transfers, and you will use it constantly on your free day.","links":[{"t":"Marjanishvili Theatre","u":"https://marjanishvili.com/en/"},{"t":"Metromoney fares (TTC)","u":"https://ttc.com.ge/en/tariff/49"},{"t":"Tbilisi Metro tickets","u":"https://tbilisimetro.org/tickets/"}],"dy":[2]},{"id":"sameba-cathedral-night","n":"Sameba (Holy Trinity Cathedral) lit at night","n2":"წმინდა სამების საკათედრო ტაძარი","k":"monument","ll":[41.69755,44.81652],"price":"Free · metro 1 GEL each way","gbp":"Free · ≈£0.28 each way","open":"Grounds roughly 08:00-22:00 daily; gates are locked overnight","win":"D2 evening — only if you have energy, otherwise Day 3","mins":75,"d":"The vast modern Georgian Orthodox cathedral on Elia Hill, floodlit gold after dark and visible from half the city. Free to enter, and the illuminated exterior is the real draw rather than the interior. It is a stretch on an arrival night but it is the closest thing to a set-piece monument on your side of the river.","go":"Marjanishvili metro (8 min walk from Fabrika) to Avlabari, 1 GEL with a Metromoney card, then 10 min uphill on foot. A Bolt door to door is roughly 8-12 GEL (≈£2.30-3.40) and takes about 10 minutes — the sane choice when you are tired.","dist":"1.7 km direct · metro + 10 min walk, or ~10 min by Bolt","tip":"Shoulders and knees covered; women are expected to cover their heads inside. The gates shut around 22:00, so aim to be there by 21:00. Honestly, if you are flagging, you can see it lit up from the riverbank at Saarbrucken Square for free.","links":[{"t":"Official visitor site","u":"https://www.samebacathedral.com/"},{"t":"Wander-Lush tips","u":"https://wander-lush.org/tbilisi-sameba-cathedral/"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/holy-trinity-cathedral-of-tbilisi/"}],"dy":[2]},{"id":"saarbrucken-riverbank","n":"Saarbrucken Square & the Chugureti riverbank","n2":"ზაარბრიუკენის მოედანი","k":"view","ll":[41.70271,44.8045],"price":"Free","gbp":"Free","open":"Always open","win":"D2 evening","mins":30,"d":"The bottom of Aghmashenebeli Avenue, where the left bank meets the Mtkvari. Cross to the parapet and you get the classic Tbilisi night view for nothing: Metekhi Church on its cliff, Narikala fortress floodlit above the Old Town, and the river running black between them. Twelve minutes from Fabrika and the cheapest good thing you will do all evening.","go":"12 min walk south from Fabrika — go down Ninoshvili St and follow Aghmashenebeli Avenue all the way to the river.","dist":"760 m · 12 min walk","tip":"Walk the extra 600 m downstream along the embankment to the Baratashvili Bridge for a closer angle on Metekhi; it is well lit and safe on a weekday evening.","links":[{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.70271&mlon=44.80450#map=17/41.70271/44.80450"},{"t":"Aghmashenebeli Avenue context","u":"https://georgia.travel/agmashenebeli-avenue-in-tbilisi-neu-tiflis"}],"dy":[2]},{"id":"rike-park-peace-bridge","n":"Rike Park & the Bridge of Peace","n2":"რიყის პარკი / მშვიდობის ხიდი","k":"view","ll":[41.6932,44.80999],"price":"Free","gbp":"Free","open":"Always open; the bridge's LED lighting comes on after dark","win":"D2 evening — a stretch on arrival night, better on Day 3","mins":60,"d":"The glass-and-steel Bridge of Peace crossing the Mtkvari into Rike Park, with thousands of LEDs firing after dark and views up to Narikala and Metekhi. Handsome at night and completely free, but it is 2 km and a solid 30 minutes on foot from Fabrika.","go":"30 min walk south along the left bank via Saarbrucken Square and the embankment. Faster: Marjanishvili metro to Avlabari (1 GEL) then 12 min downhill, or a Bolt for roughly 6-10 GEL (≈£1.70-2.80).","dist":"1.9 km · 30 min walk, or metro + 12 min, or ~8 min by Bolt","tip":"Be realistic — you have a full free day in Tbilisi tomorrow and this is firmly on that side of the river. On a Wednesday arrival evening, the Saarbrucken riverbank gives you 80% of the same view for a third of the walk.","links":[{"t":"OpenStreetMap (Rike Park)","u":"https://www.openstreetmap.org/?mlat=41.69320&mlon=44.80999#map=17/41.69320/44.80999"},{"t":"OpenStreetMap (Bridge of Peace)","u":"https://www.openstreetmap.org/?mlat=41.69298&mlon=44.80806#map=18/41.69298/44.80806"}],"dy":[2]},{"id":"khash-khash","n":"Khash-Khash","n2":"ხაშ-ხაშ","k":"eat","ll":[41.70898,44.80364],"price":"Khinkali ~2.50 GEL each · dinner for two with drinks ≈60-80 GEL","gbp":"≈£17-23 for two","open":"Mon-Fri 12:00-02:00 · Sat-Sun 10:00-02:00","win":"D2 evening","mins":90,"d":"The closest proper khinkali to your bed — 90 seconds' walk. Opened mid-2023, hand-pinched dumplings made to a family recipe from the mountain village of Ghulelebi, plus chebureki, lamb kebab and a short modernised Georgian menu. Rated 4.5/5 on TripAdvisor and ranked #352 of 2,142 Tbilisi restaurants.","go":"Out of Fabrika, turn right on Ninoshvili St, then first right onto Giorgi Mazniashvili St — it is at no. 33.","dist":"80 m · 1-2 min walk","tip":"Most Georgian places set a minimum order of five khinkali per filling, so order five each of two fillings rather than a mixed handful. Eat them with your hands, bite the side, drink the broth, and leave the chewy top knots on the plate.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g294195-d26561820-Reviews-Khash_Khash-Tbilisi.html"},{"t":"Book a table","u":"https://khash-khash.resos.com/booking"},{"t":"Menu (Wolt)","u":"https://wolt.com/en/geo/tbilisi/restaurant/khash-khash"},{"t":"Wander-Lush","u":"https://wander-lush.org/tbilisi-georgia-food-best-restaurants-cafes-guide/"}],"dy":[2]},{"id":"moulin-electrique","n":"Moulin Électrique","n2":"მულენ ელექტრიკი","k":"eat","ll":[41.70923,44.8027],"price":"Sandwiches from 6 GEL · mains 12.50-15 GEL · two eating and drinking ≈50-60 GEL","gbp":"≈£14-17 for two","open":"10:30-01:00 daily","win":"D2 evening","mins":75,"d":"A long-standing Tbilisi favourite with a branch right in the Fabrika courtyard, doing European and Georgian dishes at genuinely democratic prices — the puff-pastry khachapuri is the thing people come back for. The latest kitchen in the courtyard, so it is your fallback if you crash at 22:30 and still need feeding.","go":"Inside the Fabrika courtyard, 30 seconds from reception.","dist":"26 m · under a minute","tip":"Service can be slow and scattered when the terrace is full — flag your order early rather than waiting to be noticed.","links":[{"t":"Fabrika page","u":"https://fabrikatbilisi.com/resident/moulin-electrique/"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g294195-d4748979-Reviews-Moulin_Electrique-Tbilisi.html"},{"t":"Spotted by Locals","u":"https://www.spottedbylocals.com/tbilisi/moulin-electrique/"}],"dy":[2]},{"id":"tone-fabrika","n":"Tone","n2":"თონე","k":"eat","ll":[41.70901,44.80286],"price":"Sandwiches roughly 12-20 GEL · a light dinner for two ≈35-45 GEL","gbp":"≈£10-13 for two","open":"Sun-Thu 11:00-00:00 · Fri-Sat 11:00-02:00","win":"D2 evening","mins":45,"d":"Sandwiches built on shoti bread baked on site in a clay tone oven — the cheapest decent way to stop being hungry inside the Fabrika courtyard. Portions run small, so it is a snack-and-a-beer option rather than a proper sit-down feed.","go":"Fabrika courtyard, next to the hostel building.","dist":"45 m · under a minute","tip":"If you would rather see the bread made than eat a sandwich, they fire the tone oven around 10:00-10:30 in the morning — one for your free day.","links":[{"t":"Fabrika residents","u":"https://fabrikatbilisi.com/residents/"},{"t":"Red Fedora Diary guide","u":"https://www.redfedoradiary.com/fabrika-tbilisi/"},{"t":"Wander-Lush restaurants","u":"https://wander-lush.org/tbilisi-georgia-food-best-restaurants-cafes-guide/"}],"dy":[2]},{"id":"shavi-coffee-ninoshvili","n":"Shavi Coffee Roasters (Ninoshvili)","n2":"შავი","k":"cafe","ll":[41.71151,44.80168],"price":"Cappuccino 10-12 GEL","gbp":"≈£3 a coffee","open":"08:00-19:00 daily","win":"D2 evening — but closes 19:00, so go straight there or leave it","mins":40,"d":"Tbilisi's best-known specialty roastery, a bright Brooklyn-loft space on Ninoshvili Street four minutes from Fabrika, roasting its own beans and doing proper hand brews plus cakes and sandwiches. The right first stop if you land off the plane needing to be a functioning human again.","go":"Left out of Fabrika along Egnate Ninoshvili St, 4 min north-east to no. 17.","dist":"250 m · 4 min walk","tip":"It shuts at 19:00, so this only works if you drop your bags and walk straight out. Otherwise save it for a Day 3 breakfast — the cherry pie is the one to order.","links":[{"t":"Website","u":"https://shavi.coffee"},{"t":"Facebook","u":"https://www.facebook.com/shavi.coffee/"},{"t":"European Coffee Trip","u":"https://europeancoffeetrip.com/cafe/shavicoffeeroastersninoshvili-tbilisi/"},{"t":"Wander-Lush cafes","u":"https://wander-lush.org/best-cafes-in-tbilisi-coffee-shops/"}],"dy":[2]},{"id":"amo-rame-bani","n":"Amo Rame • Bani","n2":"ამო რამე • ბანი","k":"eat","ll":[41.70741,44.7987],"price":"Khinkali ~2.50 GEL each · 27-67 GEL a head · dinner for two ≈60-90 GEL","gbp":"≈£17-25 for two","open":"12:00-00:00 daily","win":"D2 evening","mins":90,"d":"The Aghmashenebeli Avenue offshoot of the much-loved Sololaki khinkali bar, doing hand-pinched dumplings to mountain recipes — including the plaited nadughi soft-cheese ones, which are the best vegetarian khinkali in the city. Mushrooms baked in a clay pot and a proper lava cake if you have room.","go":"7 min walk west from Fabrika via Ninoshvili St and Marjanishvili St to 68 David Aghmashenebeli Ave; sits on the restored avenue near Marjanishvili metro.","dist":"410 m · 7 min walk","tip":"Open to midnight, which is later than most of the good khinkali houses on this side of the river.","links":[{"t":"Restaurant Guru (menu & prices)","u":"https://restaurantguru.com/Amo-Rame-Khinkali-Tbilisi"},{"t":"Spotted by Locals","u":"https://www.spottedbylocals.com/tbilisi/amo-rame/"},{"t":"Wander-Lush restaurants","u":"https://wander-lush.org/tbilisi-georgia-food-best-restaurants-cafes-guide/"}],"dy":[2]},{"id":"ghebi","n":"Ghebi","n2":"ღები","k":"eat","ll":[41.71274,44.79516],"price":"30-40 GEL a head · draught beer 5 GEL · dinner for two ≈60-80 GEL","gbp":"≈£17-23 for two · beer ≈£1.40","open":"Open 24 hours, daily","win":"D2 evening","mins":100,"d":"A basement room on Aghmashenebeli full of Georgian men toasting with chacha over tables that disappear under food — Rachan mountain cooking done cheaply and properly. Creamy lobio with or without lori ham, lobiani bean pies, garlic-drowned shkmeruli chicken and head-sized chvishtari cornbread. Draught beer is 5 GEL.","go":"12 min walk west from Fabrika: Ninoshvili St to Marjanishvili Square, then north-west up David Aghmashenebeli Ave to no. 115. Alternatively Marjanishvili metro is 8 min from Fabrika if you would rather not walk the whole way.","dist":"740 m · 12 min walk","tip":"Open 24 hours, so it is the one place near Fabrika that will absolutely still feed you if you get your timings wrong. It is a local haunt, not a tourist trap — English is thin on the ground, so point at things.","links":[{"t":"Culinary Backstreets review","u":"https://culinarybackstreets.com/cities-category/tbilisi/2023/ghebi-subterranean-comfort/"},{"t":"Wander-Lush restaurants","u":"https://wander-lush.org/tbilisi-georgia-food-best-restaurants-cafes-guide/"}],"dy":[2]},{"id":"asi-khinkali","n":"Asi Khinkali","n2":"ასი ხინკალი","k":"eat","ll":[41.70941,44.79247],"price":"Khinkali ~2.50 GEL each · dinner for two ≈50-70 GEL","gbp":"≈£14-20 for two","open":"11:00-22:00 daily","win":"D2 evening — kitchen shuts 22:00, so eat early","mins":90,"d":"The original Chugureti branch of a cult khinkali house, reopened after a long closure, doing eight fillings including several genuinely good vegetarian ones. The dumplings are saucer-sized and you will over-order; that is the point.","go":"14 min walk west from Fabrika via Marjanishvili Square, to 19 Ushangi Chkheidze St. Or Marjanishvili metro (8 min from Fabrika) then 6 min on foot.","dist":"870 m · 14 min walk","tip":"Closes at 22:00, earlier than the Fabrika-side options, so this is a 19:00-20:00 dinner rather than a late one.","links":[{"t":"Facebook","u":"https://www.facebook.com/asikhinkali"},{"t":"Best khinkali guide","u":"https://www.redfedoradiary.com/best-khinkali-in-tbilisi/"}],"dy":[2]},{"id":"puri-guliani-late-cafe","n":"Puri Guliani","n2":"პური გულიანი","k":"cafe","ll":[41.70223,44.80521],"price":"Coffee ~6-10 GEL · khachapuri and pastries a few lari each","gbp":"≈£2-3 a coffee","open":"09:00-24:00 daily","win":"D2 evening — the only proper late wind-down café near you","mins":45,"d":"A Georgian bakery-café near Saarbrucken Square that stays open until midnight, doing bread, khachapuri, pastries, coffee and tea. Almost every specialty coffee place in Chugureti closes by 20:00, so if you want somewhere to sit with a coffee at 22:30 rather than a beer, this is the one.","go":"13 min walk south from Fabrika, down Aghmashenebeli Avenue towards the river.","dist":"820 m · 13 min walk","tip":"Pairs naturally with the riverbank viewpoint and Mechanica — all three are within 200 m of each other at the bottom of the avenue.","links":[{"t":"Website","u":"https://puriguliani.ge/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.70223&mlon=44.80521#map=19/41.70223/44.80521"}],"dy":[2]},{"id":"fabrika-courtyard","n":"Fabrika Courtyard","n2":"ფაბრიკა","k":"drink","ll":[41.7095,44.80265],"price":"Free to enter · beer/cocktails roughly 10-25 GEL","gbp":"Free entry · ≈£3-7 a drink","open":"Courtyard open 24/7, free; bars run through the evening, liveliest 20:00 onwards","win":"D2 evening","mins":90,"d":"The converted Soviet sewing factory you are sleeping in, and the single easiest win of the whole trip: a huge graffitied courtyard of bars, a wine bar, a pizzeria, a burger joint, a barber-shop-turned-bar and a board game club, all wrapped around communal benches. On a warm early-September evening it fills with travellers and young Tbilisians and you do not have to walk anywhere.","go":"You are already here — walk out of the hostel reception into the courtyard.","dist":"0 m · you live here","tip":"Entry to the grounds is free and open 24/7, so you can drift out for a nightcap at any hour without worrying about getting locked out.","links":[{"t":"Official site","u":"https://fabrikatbilisi.com/"},{"t":"Residents list","u":"https://fabrikatbilisi.com/residents/"},{"t":"Facebook","u":"https://www.facebook.com/FabrikaTbilisi"},{"t":"Red Fedora Diary guide","u":"https://www.redfedoradiary.com/fabrika-tbilisi/"}],"dy":[2]},{"id":"saamuri-wine-bar","n":"Saamuri Natural Wine Bar","n2":"საამური","k":"drink","ll":[41.70962,44.80244],"price":"Bottles from ~20 GEL · glasses of natural Georgian wine typically 8-15 GEL","gbp":"≈£2.30-4.20 a glass","open":"Mon-Thu & Sun 14:00-23:00 · Fri-Sat 14:00-02:00","win":"D2 evening","mins":75,"d":"A leafy corner of the Fabrika courtyard pouring around 100 natural wines from roughly 30 small Georgian producers, most of them Natural Wine Association members, plus craft beer, chacha and kombucha. Cheese and meat boards if you want to graze rather than sit down to dinner.","go":"Cross the Fabrika courtyard, about 40 seconds from reception.","dist":"43 m · under a minute","tip":"Saamuri runs a guided natural wine tasting Mon-Fri at 16:00, 27 GEL (≈£7.60) for Fabrika guests with a voucher from reception instead of 35 GEL. You land too late for it on Wednesday, but it is a cracking cheap thing to do at 16:00 on your free day.","links":[{"t":"Fabrika page","u":"https://fabrikatbilisi.com/resident/saamuri-wine-bar/"},{"t":"Instagram","u":"https://www.instagram.com/saamuriwines/"},{"t":"Facebook","u":"https://www.facebook.com/SAAMURIWINES"},{"t":"Tasting details","u":"https://www.hostelfabrika.com/whats-on/wine-tasting-at-saamuri"}],"dy":[2]},{"id":"seven-roads-craft-beer","n":"Seven Roads Craft Beer Bar","k":"drink","ll":[41.71036,44.80357],"price":"Craft beer roughly 8-15 GEL a glass · snacks 6-12 GEL","gbp":"≈£2.30-4.20 a beer","open":"Mon-Thu 18:00-00:00 · Fri 18:00-02:00 · Sat 16:00-02:00 · Sun 16:00-00:00","win":"D2 evening","mins":90,"d":"A big underground craft beer room two minutes from Fabrika with 15 taps, over 100 beers and Untappd screens on the wall — Georgian breweries like Underground, Agara, Chito and Seahorse alongside imports. The friendliest possible way to spend a jetlagged Wednesday: it opens at 18:00 exactly when you will be ready for a pint.","go":"Out of Fabrika onto Ninoshvili St, walk 150 m north-east to Kita Abashidze St 4.","dist":"120 m · 2 min walk","tip":"Ask the staff to steer you — they know the Georgian microbreweries properly and the local sours and IPAs are far more interesting than the imports.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g294195-d26726713-Reviews-Seven_Roads_Craft_Beer_Bar-Tbilisi.html"},{"t":"Instagram","u":"https://www.instagram.com/sevenroads.tbi/"},{"t":"Facebook","u":"https://www.facebook.com/sevenroads.geo"}],"dy":[2]},{"id":"wine-merchants","n":"Wine Merchants","n2":"ღვინის ვაჭრები","k":"drink","ll":[41.70701,44.80344],"price":"Wine from 8 GEL a glass, 15 GEL for the premium pours · sharing plates on top","gbp":"≈£2.30-4.20 a glass","open":"Sun-Thu 15:00-00:00 · Fri-Sat 15:00-01:00","win":"D2 evening","mins":90,"d":"A relaxed wine gastro-bar in a quiet Chugureti back street, four minutes from Fabrika, with a deep list of Georgian bottles plus Georgian and European sharing platters and substantial salads. A knowledgeable, friendly owner who will happily talk you through qvevri wine without any ceremony.","go":"South-west out of Fabrika down Ninoshvili St, then left onto Ivane Javakhishvili St — nos. 46-48.","dist":"270 m · 4-5 min walk","tip":"Good compromise if one of you wants dinner and the other wants to drink — the platters are big enough to be a meal.","links":[{"t":"Facebook","u":"https://www.facebook.com/winemerchantstbilisi"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g294195-d24167822-Reviews-Wine_Merchants-Tbilisi.html"},{"t":"Wander-Lush bars","u":"https://wander-lush.org/best-bars-in-tbilisi-georgia/"}],"dy":[2]},{"id":"mechanica-sound-club","n":"Mechanica Sound Club","n2":"მექანიკა","k":"night","ll":[41.70269,44.80381],"price":"Entry varies by event, typically ~20-30 GEL · drinks ~15-25 GEL","gbp":"≈£6-8 entry · ≈£4-7 a drink","open":"Wed-Sat 20:00-06:00 · Sun 20:00-00:00 · Mon-Tue closed","win":"D2 evening, from 20:00 — the one club actually open on a Wednesday","mins":180,"d":"An underground techno and electronic space tucked beneath the Saarbrucken bridge at 9 Dmitri Uznadze St, 12 minutes from Fabrika. Night sets, experimental live shows and themed parties that run to morning. Crucially it opens Wednesday, which almost nothing else in Tbilisi's club scene does.","go":"12 min walk south from Fabrika: Ninoshvili St, then down to Saarbrucken Square and the riverbank; the entrance is under the bridge. A Bolt back at 03:00 across central Tbilisi is roughly 5-10 GEL (≈£1.40-2.80).","dist":"750 m · 12 min walk","tip":"Check the Resident Advisor or Facebook listing before you set off — Wednesday is an opening night, not a guaranteed headline night, and the programme is event-led. Nothing starts before 22:00 in practice.","links":[{"t":"Resident Advisor","u":"https://ra.co/clubs/277708"},{"t":"Facebook","u":"https://www.facebook.com/club.mechanica/"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d27906234-Reviews-Mechanica_Club-Tbilisi.html"}],"dy":[2]},{"id":"techno-clubs-closed-wednesday","n":"Left Bank / Bassiani / KHIDI — closed Wednesday","k":"night","ll":[41.70549,44.79568],"price":"N/A — shut. When open, entry is typically 30-50 GEL","gbp":"N/A on a Wednesday","open":"Left Bank Fri-Sun 23:59-10:00 · KHIDI Fri & Sat from ~23:50 · Mtkvarze Fri & Sat from 23:00 · Bassiani Fri & Sat from midnight · TES Thu-Sun 23:00-10:00 · ALL closed Mon-Thu","win":"NOT D2 — do not plan this for Wednesday","mins":0,"d":"Reality check rather than a recommendation. Tbilisi's famous techno scene — Bassiani under the Dinamo stadium, KHIDI under the bridge, Mtkvarze in the old printing house, Left Bank on your side of the river and TES — runs Friday and Saturday only, with Sunday-morning sessions. On Wednesday 2 September they are all locked. The coordinates here are Left Bank, the nearest of them, 12 min from Fabrika, so you can see how close you were.","go":"Don't. Walk to Mechanica instead, or accept a Fabrika courtyard night.","dist":"740 m · 12 min walk to a closed door","tip":"If techno matters to you, work out which Friday or Saturday you are back in Tbilisi at the end of the trip and buy tickets on Resident Advisor in advance. Bassiani in particular has a strict door and a no-photos policy.","links":[{"t":"Left Bank","u":"https://leftbank.club"},{"t":"Bassiani on Resident Advisor","u":"https://ra.co/clubs/109137"},{"t":"Bassiani Facebook","u":"https://www.facebook.com/bassiani/"},{"t":"TES Club","u":"https://tes-club.com/"},{"t":"Fabrika's own club guide","u":"https://www.hostelfabrika.com/whats-on/tbilisi-nights-your-guide-to-the-citys-legendary-club-scene"}],"dy":[2]},{"id":"dry-bridge-market","n":"Dry Bridge Market","n2":"მშრალი ხიდის ბაზრობა","k":"market","ll":[41.70124,44.80331],"price":"Free to browse","gbp":"Free","open":"10:00-17:00 daily — SHUT by the time you arrive on Wednesday","win":"NOT D2 evening — save for your free day","mins":60,"d":"Tbilisi's flea market, sprawling over the Dry Bridge and the adjoining Dedaena and 9 March parks: Soviet medals and cameras, old maps, vinyl, porcelain, chandeliers, drinking horns, felted wool socks and a lot of cheerfully hard bargaining. Genuinely one of the best things in the city.","go":"15 min walk south from Fabrika down Aghmashenebeli Avenue and along the river; or Marjanishvili metro one stop to Rustaveli.","dist":"910 m · 15 min walk","tip":"Listed here only so you do not waste the walk: stalls close around 17:00, before you have even checked in. Come back between 11:00 and 15:00 on your free day — Wednesdays and Mondays are the thinnest, weekends the fullest.","links":[{"t":"Official site","u":"https://www.drybridgemarket.com/en"},{"t":"Wander-Lush guide","u":"https://wander-lush.org/dry-bridge-market-tbilisi-flea-market/"}],"dy":[2]},{"id":"spar-24h-ninoshvili","n":"24-hour Spar & Nikora (Ninoshvili)","k":"market","ll":[41.71071,44.80365],"price":"Water ~1.50 GEL · bread ~2 GEL · a bag of breakfast and snacks for two ≈25-35 GEL","gbp":"≈£7-10 for a decent shop","open":"Open 24 hours, daily (both Spar at 41.71071/44.80365 and Nikora at 41.71028/44.80415)","win":"D2 evening — any hour","mins":25,"d":"Two 24-hour convenience supermarkets barely two minutes from Fabrika, with a 24-hour Fresco supermarket 4 min the other way at 41.70749/44.80471 if you want a bigger shop. Water, bread, cheese, chocolate, beer, batteries — everything you need for tonight and for tomorrow morning.","go":"2-3 min walk north-east from Fabrika along Egnate Ninoshvili St.","dist":"160 m · 2-3 min walk","tip":"Do NOT do your Svaneti trail shopping here tonight — it is dearer and thinner than Dezerter Bazaar, which is a 10-min walk away and open 07:00-17:00/18:00, so hit that on Day 3 morning for nuts, dried fruit, cheese and churchkhela. Draw your Svaneti cash in Tbilisi too: ATMs are everywhere in Chugureti and there is an exchange office (Valuto, 10:00-22:00) at 41.71502/44.80272, 10 min north. Mestia and Ushguli have very few working machines.","links":[{"t":"Georgia price guide (Wander-Lush)","u":"https://wander-lush.org/georgia-travel-budget-costs/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.71071&mlon=44.80365#map=19/41.71071/44.80365"}],"dy":[2]}]},"tbilisi-oldtown":{"n":"Tbilisi · Old Town & the night","anchor":[41.70942,44.80289],"anchorName":"Fabrika","days":[3],"win":"Thu — all day and the night","note":"A sane shape: do the two errands first thing (Dezerter Bazaar and Tbilisi Central are the same 25-minute walk from Fabrika, so trail snacks + confirming the 08:15 train are one trip, done by 10:00), then walk south down the river into the Old Town. Sioni, Shavteli, Peace Bridge, Metekhi cliff, then Abanotubani. Baths mid-afternoon when you are footsore. Baths verdict: skip the 130–200 GEL rooms at the blue-tiled Chreli Abano — photograph it from outside and book a private room at Bath №5 or Bohema instead, roughly 70 GEL an hour for the room, so ~35 GEL (£10) each for two of you with your own hot sulphur pool. The 6–10 GEL public hall at Bath №5 is cheaper again but it is gender-segregated, crowded and rough round the edges; go in knowing that. Note Narikala Fortress itself has been closed for restoration since 2023 and had still not reopened as of August 2026 — the ridge, the cable car, Kartlis Deda and the views all still work, you just can't get inside the walls. On the night: the honest answer is that Thursday is the wrong night for Tbilisi techno. Bassiani and KHIDI are Friday–Saturday only, full stop. Cafe Gallery turns into a club from midnight Thursday to Sunday and is the real Thursday option; Dedaena and Success Bar both run Thursdays and cost nothing or next to nothing to get into. And a Tbilisi club night means 01:00 to 08:00 — if you go to Cafe Gallery properly you will not make the 08:15 train. Two glasses of qvevri wine at Karalashvili for 5 GEL each and a 01:00 finish at Dedaena is the version that gets you to Zugdidi.","items":[{"id":"abanotubani","n":"Abanotubani bath quarter","n2":"აბანოთუბანი","k":"sight","ll":[41.68793,44.81074],"price":"Free to wander","gbp":"Free","open":"Always open; bathhouses roughly 07:00–23:00","win":"D3 day","mins":40,"d":"The brick-domed sulphur bath quarter in the gorge below Narikala — half-buried beehive roofs venting steam, a mosque, a gorge with a waterfall at the back. This is the oldest inhabited part of Tbilisi and the reason the city is called Tbilisi (tbili = warm).","go":"Walk south along the right bank from Fabrika: Marjanishvili → Baratashvili Bridge → Kote Abkhazi St → Gorgasali Square. About 40 min on foot and a genuinely good walk. Or metro Marjanishvili → Avlabari (Line 1, 1 GEL), then 8 min downhill across Metekhi Bridge.","dist":"2.5 km · ~42 min walk from Fabrika, or 8–12 GEL by Bolt","tip":"Walk the domes first, decide which bathhouse you want, then go in — most places will show you a room before you commit.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Abanotubani"},{"t":"Wander-Lush baths guide","u":"https://wander-lush.org/tbilisi-georgia-gulos-thermal-spa-abanotubani-sulfur-bath-review/"}],"dy":[3]},{"id":"bath-no-5","n":"Sulphur Bath №5","n2":"აბანო №5","k":"sight","ll":[41.68864,44.81121],"price":"Public hall 10 GEL men / 6 GEL women · private room from 70 GEL per hour for the room · kisi scrub 10 GEL","gbp":"≈£2.80 / £1.70 public · private ≈£20 the room (≈£10 each for two)","open":"Daily 07:00–21:00","win":"D3 day","mins":90,"d":"The budget traveller's bathhouse and the best-value private room in Abanotubani: mosaic-lined rooms, recently renovated, some with a small sauna. Also the best-known cheap public hall — gender-segregated, tiled, hot, and full of Georgian men doing what Georgian men have done here for centuries.","go":"2 Abano St, the low building on the Gorgasali St side of Heydar Aliyev Park, at the eastern end of the bath quarter. Walk down from Fabrika, or metro Marjanishvili → Avlabari (1 GEL) and 10 min downhill.","dist":"2.4 km · ~41 min walk, or 8–12 GEL by Bolt","tip":"THE COMPARISON, per hour for the whole room: Bath №5 from 70 GEL · Bohema (end of Abano II Deadend) from 70 GEL · Kyiv Sulfur Spa (4 Kiev St, Chugureti, nearest to Fabrika) 50–90 GEL · Chreli Abano from 130 GEL realistically · Royal Bath from 150 GEL · Gulo's from 150 GEL · King Erekle's from 200 GEL. Split two ways, a 70 GEL room is £10 a head — that is the answer. Bring flip-flops and your own towel (rental 2–5 GEL); the kisi scrub is worth the extra 10 GEL once.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d14018422-Reviews-Sulfur_Bath_No_5-Tbilisi.html"},{"t":"Wander-Lush price comparison","u":"https://wander-lush.org/tbilisi-georgia-gulos-thermal-spa-abanotubani-sulfur-bath-review/"},{"t":"The Fabryk — public vs private, tested","u":"https://thefabryk.com/blog/sulfur-baths-tbilisi"}],"dy":[3]},{"id":"chreli-abano","n":"Chreli Abano (Orbeliani Baths)","n2":"ჭრელი აბანო","k":"sight","ll":[41.68745,44.81077],"price":"Free to look at · private rooms from 60 GEL/hr nominal, realistically 130–200+ GEL/hr · kisi 30 GEL","gbp":"Free outside · rooms ≈£37–£57+ per hour","open":"Daily 09:00–23:00","win":"D3 day","mins":20,"d":"The blue-and-turquoise tiled, minaret-flanked facade at the top of Abano Street — the single most photographed building in Tbilisi, and genuinely beautiful. Inside are eleven private rooms and a royal suite with a snow room.","go":"2 Abano St, top of the bath street. Same walk as the rest of Abanotubani — 40 min from Fabrika down the right bank, or Avlabari metro and down.","dist":"2.5 km · ~43 min walk","tip":"Look at it, photograph it, then bathe somewhere cheaper. The entry-level 60 GEL rooms are almost never actually available; you will be quoted 130+ GEL. Book online if you do want it.","links":[{"t":"Official booking","u":"https://booking.chreli-abano.ge/?lang=en"},{"t":"The Tbilisi Guide — 2026 bath prices","u":"https://thetbilisiguide.com/tbilisi-sulfur-bath-prices/"}],"dy":[3]},{"id":"gulos-thermal-spa","n":"Gulo's Thermal Spa","n2":"გულოს აბანო","k":"sight","ll":[41.68792,44.81132],"price":"Private rooms from 150 GEL per hour · kisi 20 GEL cash · towel 5 GEL · tea included","gbp":"≈£42 per hour the room (≈£21 each for two)","open":"Daily 07:00–03:00","win":"either","mins":75,"d":"The most-recommended traditional private bathhouse in Abanotubani — old-school, run by an actual family, and the one Georgia writers keep coming back to. Open until 03:00, which makes it the only bath worth knowing about at night.","go":"5 Ioseb Grishashvili St, at the end of Abano I Deadend, a minute from Bath №5.","dist":"2.5 km · ~43 min walk, or 8–12 GEL by Bolt","tip":"Only worth it if you decide the extra 80 GEL over Bath №5 buys you something — mostly it buys atmosphere and a better scrub. Book by phone or Facebook; there is no online system.","links":[{"t":"Wander-Lush review","u":"https://wander-lush.org/tbilisi-georgia-gulos-thermal-spa-abanotubani-sulfur-bath-review/"},{"t":"The Tbilisi Guide — prices","u":"https://thetbilisiguide.com/tbilisi-sulfur-bath-prices/"}],"dy":[3]},{"id":"narikala","n":"Narikala Fortress & the ridge","n2":"ნარიყალა","k":"monument","ll":[41.68773,44.80911],"price":"Free","gbp":"Free","open":"CLOSED for restoration — ridge path and viewpoints still open 24h","win":"D3 day","mins":60,"d":"The 4th-century citadel on the ridge over the Old Town. Important: the fortress itself has been fenced off for restoration since 2023 and as of August 2026 there is still no confirmed reopening date — you cannot get inside the walls. The ridge path along the outside, the views over the Old Town and the walk west to Kartlis Deda all remain open and are most of the point anyway.","go":"Cable car from Rike Park (2.5 GEL each way) drops you 200 m from the walls. On foot, the Betlemi Street stairs from Lado Asatiani St in Sololaki is the nicer of the two climbs (~20 min from the Old Town); the Orbiri Street stairs from Abanotubani is steeper and shorter.","dist":"2.5 km · ~42 min walk from Fabrika, or ride up on the cable car","tip":"Check current status before you commit the climb — the closure has been extended more than once. Late afternoon light on the ridge is the best in Tbilisi.","links":[{"t":"Wander-Lush (closure status)","u":"https://wander-lush.org/narikala-fortress-tbilisi-georgia/"},{"t":"RFE/RL on the restoration","u":"https://www.rferl.org/a/tbilisi-narikala-fortress-restoration/32890646.html"}],"dy":[3]},{"id":"kartlis-deda","n":"Kartlis Deda (Mother of Georgia)","n2":"ქართლის დედა","k":"monument","ll":[41.68812,44.8046],"price":"Free","gbp":"Free","open":"Always open","win":"either","mins":30,"d":"The 20 m aluminium woman on the Sololaki ridge, up since 1958, holding a bowl of wine for friends and a sword for enemies. The terrace round her base is the classic Tbilisi panorama and it costs nothing.","go":"500 m west along the ridge path from the Narikala cable car top station — flat, five minutes. Or climb the Betlemi Street stairs from Lado Asatiani St in Sololaki.","dist":"2.4 km · ~41 min walk from Fabrika (or cable car + 5 min)","tip":"Best at sunset, and the walk back down Betlemi into Sololaki in the dark with the lights on is the good version of this.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/narikala-fortress-tbilisi-georgia/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.68812&mlon=44.80460#map=18/41.68812/44.80460"}],"dy":[3]},{"id":"metekhi","n":"Metekhi Church & the cliff","n2":"მეტეხის ღვთისმშობლის შობის ტაძარი","k":"monument","ll":[41.69015,44.81125],"price":"Free","gbp":"Free","open":"Church open daily during daylight; the cliff terrace outside is open 24h","win":"either","mins":30,"d":"A 13th-century church on a rock straight above the Mtkvari, with Elguja Amashukeli's 1961 bronze of King Vakhtang Gorgasali on his horse in front of it. The terrace looks straight across at Abanotubani and up at Narikala — the best free view in the Old Town and the one that comes out well at night when everything is lit.","go":"Cross Metekhi Bridge from Gorgasali Square and climb the short ramp. From Fabrika: metro Marjanishvili → Avlabari (Line 1, 1 GEL), then 10 min downhill.","dist":"2.3 km · ~39 min walk, or metro to Avlabari + 10 min","tip":"Come back here after dark — it is a different place lit up, and it is on the way home from the Old Town.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d459963-Reviews-Metekhi_Cathedral-Tbilisi.html"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Metekhi"}],"dy":[3]},{"id":"sioni-cathedral","n":"Sioni Cathedral","n2":"სიონის ღვთისმშობლის მიძინების ტაძარი","k":"monument","ll":[41.69131,44.80752],"price":"Free","gbp":"Free","open":"Open daily for services and visitors; free","win":"D3 day","mins":20,"d":"The 6th–13th century cathedral by the river that was the seat of the Georgian Patriarch until Sameba was built. Dark, candle-smoked, frescoed, and holds the grapevine cross of St Nino — the founding relic of Georgian Christianity.","go":"On Sioni St in the Old Town, 100 m off Kote Abkhazi St. Walk down the right bank from Fabrika.","dist":"2.1 km · ~35 min walk from Fabrika","tip":"Shoulders and knees covered; women are expected to cover their hair — scarves are usually in a basket by the door.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Sioni_Cathedral_of_the_Dormition"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69131&mlon=44.80752#map=18/41.69131/44.80752"}],"dy":[3]},{"id":"anchiskhati-shavteli","n":"Anchiskhati Basilica & the Gabriadze clock tower","n2":"ანჩისხატის ბაზილიკა","k":"monument","ll":[41.6955,44.80687],"price":"Free (both)","gbp":"Free","open":"Basilica roughly 10:00–17:00, free · clock tower puppet show at 12:00 and 19:00 daily","win":"D3 day","mins":30,"d":"Two things 100 m apart on Shavteli Street. Anchiskhati is the oldest surviving church in Tbilisi, a plain 6th-century basilica. Rezo Gabriadze's leaning, tile-covered clock tower next door is the opposite — a hand-built folly where an angel comes out and strikes the bell on the hour, and a 40-second puppet play called 'Circle of Life' runs at noon and 7pm.","go":"Shavteli St, off Baratashvili St — the first bit of Old Town you hit walking south from Fabrika. Genuinely the shortest walk of anything down here.","dist":"1.6 km · ~27 min walk from Fabrika","tip":"Time your walk to be on Shavteli St at 12:00 or 19:00 for the puppet show — it's free, it takes a minute, and a crowd gathers.","links":[{"t":"Georgia Travel (official)","u":"https://georgia.travel/anchiskhati-basilica"},{"t":"TripAdvisor — Gabriadze Theatre","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d3844183-Reviews-Rezo_Gabriadze_Marionette_Theater-Tbilisi.html"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/rezo-gabriadze-marionette-theater/"}],"dy":[3]},{"id":"peace-bridge-rike","n":"Bridge of Peace & Rike Park","n2":"მშვიდობის ხიდი","k":"monument","ll":[41.69298,44.80806],"price":"Free","gbp":"Free","open":"Always open; LED light sequence runs after dark","win":"either","mins":25,"d":"Michele De Lucchi's glass-and-steel wave over the Mtkvari, thoroughly resented by half of Tbilisi and thoroughly photographed by everyone else. It lands you in Rike Park on the left bank, which has the cable car station, lawns, a chess board and the two unfinished tubes of the abandoned concert hall.","go":"Walk south along the right bank from Fabrika via Baratashvili Bridge, or metro Marjanishvili → Avlabari (1 GEL) and walk down.","dist":"1.9 km · ~32 min walk from Fabrika, or 5–8 GEL by Bolt","tip":"Cross it after dark — the 30,000 LEDs run a message in Morse code, and it is the obvious link between the Old Town and the cable car.","links":[{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69298&mlon=44.80806#map=18/41.69298/44.80806"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/cable-car/"}],"dy":[3]},{"id":"sameba","n":"Sameba (Holy Trinity Cathedral)","n2":"წმინდა სამების საკათედრო ტაძარი","k":"monument","ll":[41.69755,44.81652],"price":"Free","gbp":"Free","open":"Daily, roughly 08:00–20:00 (some sources 07:00–22:00)","win":"D3 day","mins":40,"d":"The enormous gold-domed cathedral on Elia Hill, finished in 2004 and the third-tallest Orthodox church in the world. Divisive, deliberately monumental, and the terrace in front of it gives you the whole city laid out. Free.","go":"Metro Marjanishvili → Avlabari (Line 1, 1 GEL, 2 stops), then a 10 min uphill walk. Or walk the left bank from Fabrika in about 30 min.","dist":"1.7 km · ~30 min walk, or metro to Avlabari + 10 min uphill","tip":"Shoulders and knees covered, women cover hair. Best combined with Avlabari on the way to or from Metekhi rather than as its own trip.","links":[{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/holy-trinity-cathedral-of-tbilisi/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=41.69755&mlon=44.81652#map=17/41.69755/44.81652"}],"dy":[3]},{"id":"freedom-square-cash","n":"Freedom Square, Rustaveli & the cash run","n2":"თავისუფლების მოედანი","k":"sight","ll":[41.69365,44.80115],"price":"Free · ATM: TBC charges nothing at its own machines, Bank of Georgia 3 GEL per withdrawal","gbp":"Free · BoG fee ≈£0.85","open":"Square always open; bank branches roughly 10:00–18:00 weekdays","win":"D3 day","mins":40,"d":"The gold St George column, the old city hall, and the head of Rustaveli Avenue running north past the Parliament, the Opera and the National Museum. It is also the densest cluster of bank branches and ATMs in the city, which is why it matters today.","go":"Metro Marjanishvili → Liberty Square (Line 1, 2 stops, 1 GEL). Or walk 30 min down the right bank.","dist":"1.8 km · ~30 min walk, or 2 metro stops (1 GEL)","tip":"Draw all your Sva
