d outside services","win":"Either — D7 evening for the interior, D8 dawn for the setting","mins":75,"d":"The picture-postcard one: a 9th–10th c. hall church with a Svan tower in its enclosure wall, standing alone on a knoll at 2,156 m at the top end of Zhibiani looking straight up the valley at Shkhara. Named for Lamaria, the Svan goddess of fertility and the hearth, over-written as the Mother of God. Two layers of frescoes inside, 10th and 13th century, including a Dormition and a Christ Pantocrator, plus graffiti spanning the 10th to 18th centuries. It is still a working church and the seat of the Bishop of Mestia and Zemo Svaneti.","go":"East out of Chazhashi on the main track, through Chvibiani (0.4 km) and Zhibiani (0.7 km), then bear left off the road and up the last 330 m onto the knoll. Total about 1.3 km on the ground for 73 m of climb.","dist":"1.3 km · +73 m · 22–25 min up, 15 min down","tip":"Women are expected to cover their hair — scarves are usually in a box by the door. If you go on D7 leave Chazhashi by 18:15 so you get the church with the sun still on it, and drop into Cafe Shumeri on the way back down. If you go on D8 you are there for the shape of it against the sky, not the interior.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Lamaria_Church"},{"t":"Georgia.travel","u":"https://georgia.travel/lamaria-ushguli-mother-of-god-church"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g6888424-d12625135-Reviews-LaMaria_Church-Ushguli_Samegrelo_Zemo_Svaneti_Region.html"}],"dy":[7,8]},{"id":"murkmeli","n":"Murkmeli — the abandoned hamlet","n2":"მურყმელი","k":"sight","ll":[42.91373,42.99936],"price":"Free","gbp":"Free","open":"Always","win":"Either — but you will already have walked through it","mins":40,"d":"The lowest and emptiest of the four hamlets at 2,064 m: about a dozen roofless machubi — fortified Svan house complexes of stone, all listed as part of the UNESCO property — standing among a handful of still-lived-in houses and towers. Two churches: the 11th–12th c. Church of the Saviour, a slate hall church with fragments of 12th c. frescoes on the west wall and 12th–13th c. icons, hidden behind a garden fence, and St Barbara's 350 m further west.","go":"West along the main road out of Chazhashi. Flat to gently downhill the whole way — the only walk in Ushguli that costs you nothing in height.","dist":"0.75 km · −19 m · 12 min each way","tip":"Important: coming over the Chkhutnieri Pass from Adishi you arrive down the main road from the west, so Murkmeli is the first of the four hamlets you walk into — you will have seen it at about 17:15 with your pack on. Don't spend precious D7 evening light doing it twice. Look properly on the way in instead. Ask before entering the Saviour's yard; there is a drinking-water tap at 42.91351, 42.99810.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Ushguli"},{"t":"Monkey's Tale","u":"https://monkeystale.ca/2025/10/24/mestia-to-ushguli-trekking-guide/"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91373&mlon=42.99936#map=17/42.91373/42.99936"}],"dy":[7,8]},{"id":"enguri-valley-viewpoint","n":"Enguri Valley Viewpoint","n2":"ენგურის ხეობის ხედი","k":"view","ll":[42.92058,43.02342],"price":"Free","gbp":"Free","open":"Always","win":"D7 evening if the legs are fresh — too far for the dawn hour","mins":90,"d":"A flat grass plateau on a low hill at 2,172 m off the Shkhara jeep track beyond Lamaria, and the cleanest north-east panorama in Ushguli: the whole Patara Enguri valley leading the eye to Shkhara, with the Lamaria tower in the near frame. Wander-Lush rates it the best photographic spot in the village and prefers it at sunrise, roughly an hour after nominal sunrise, because the sun takes that long to clear the peaks.","go":"Follow the Lamaria route, then keep on the dirt track another 400 m east-north-east past the Shkhara trail signboards; the track up onto the plateau is obvious on the left.","dist":"1.7 km · +89 m · 30 min up, 22 min down","tip":"Almost an hour of walking for it. Realistically this is a swap for Lamaria on D7 rather than an addition, and on D8 you cannot get there and back inside the hour — the knoll at Lamaria is the sensible dawn compromise. There is a marked camp spot by the river below it.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/visit-ushguli-georgia-travel-guide/"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.92058&mlon=43.02342#map=16/42.92058/43.02342"}],"dy":[7]},{"id":"shkhara-glacier-trail","n":"Shkhara Glacier trail (first stretch only)","n2":"შხარას მყინვარის ბილიკი","k":"nature","ll":[42.9294,43.03021],"price":"Free","gbp":"Free","open":"Always; season June–October","win":"Neither window fits the real hike. A 30-min out-and-back at dusk on D7 is the only version that works","mins":60,"d":"The famous Ushguli day walk: 16 km return up the Enguri valley on a jeep track from Lamaria to the snout of the Shkhara glacier at 2,390–2,430 m, about 540 m of cumulative climb, 5–6 hours. Flat and easy for the first 7.5 km, then a 220 m pull to the moraine. There is a café by a bridge roughly two-thirds of the way up.","go":"The trailhead is the signboard cluster on the jeep track 400 m beyond Lamaria at 42.92940, 43.03021 — 2.4 km and about 40 minutes from Old House.","dist":"Trailhead 2.4 km · full hike 16 km return","tip":"Say it plainly: the glacier walk does not fit. Five to six hours does not go into two hours of evening light, and it certainly does not go into a 60-minute pre-dawn slot before a 07:00 jeep — you would still be walking out at midday. Even reaching the trailhead and turning straight round is 80 minutes of your 95 minutes of D7 daylight. Cross it off and come back another year, or walk the first ten minutes past Lamaria at dusk purely for the valley view and turn round.","links":[{"t":"Caucasus Trekking","u":"https://www.caucasus-trekking.com/treks/shkhara"},{"t":"Backpack Adventures","u":"https://www.backpackadventures.org/shkhara-glacier/"},{"t":"Georgia.travel","u":"https://georgia.travel/ushguli-shkhara-glacier"}],"dy":[7]},{"id":"lamaria-knoll","n":"Lamaria Knoll — towers-and-Shkhara","n2":"ლამარიის ბორცვი","k":"view","ll":[42.91913,43.01848],"price":"Free","gbp":"Free","open":"Always","win":"D8 dawn — the single best use of the hour","mins":60,"d":"The open grass shoulder immediately north of Lamaria at 2,125 m. Turn your back on the church and you have the whole strung-out line of Zhibiani, Chvibiani and Chazhashi towers below you; face north-east and the Patara Enguri valley runs clean to Shkhara. Terrain sightline checked: Shkhara's summit sits 14.5 degrees above the horizontal from here, on a bearing of 40 degrees, and clears every intervening ridge by six degrees, so it really is a clean line — weather permitting, since Shkhara is habitually in cloud.","go":"Same route as the church — 1.3 km east and up through Chvibiani and Zhibiani, then the knoll. Leave Old House by 06:05 with head torches and you are standing on it by 06:30, in time for civil twilight to build and the top of Shkhara to catch fire around 06:35–06:50. Turn round at 06:50 and you are back at the jeep for 07:00 with three minutes to spare.","dist":"1.3 km · +42 m · 22 min each way","tip":"It is genuinely tight. Bags packed and by the door the night before, torches on, no coffee. If you would rather not gamble, the low rise 200 m east of Old House at 42.91542, 43.01097 gives a lesser version of the same composition for a five-minute walk.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/visit-ushguli-georgia-travel-guide/"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91913&mlon=43.01848#map=17/42.91913/43.01848"}],"dy":[8]},{"id":"shkhara-alpenglow","n":"Dawn line on Shkhara — open ground east of Chazhashi","n2":"შხარა","k":"view","ll":[42.91542,43.01097],"price":"Free","gbp":"Free","open":"Always","win":"D8 dawn — the whole point of getting up","mins":40,"d":"The nearest place you can stand and see Georgia's highest peak clean. A patch of open ground on the low rise just east of Chazhashi, marked on OSM as a photo spot, looking up the side valley on a bearing of 41 degrees to Shkhara — 5,203 m on Wikipedia, still widely quoted at the older Soviet 5,193 m — 12.5 km away. Checked against SRTM terrain: the summit sits 13.9 degrees above the horizontal from here and the highest intervening ridge only 6.8 degrees, a 7.2 degree margin, which is the cleanest line anywhere in Ushguli and better than either Lamaria or the Enguri viewpoint. Because the summit stands 3,100 m above the village it catches the sun at roughly 06:35-06:50 while the valley floor stays in shadow until about 08:00.","go":"East out of the door along the main lane through the Chazhashi towers, past the crossroads, and 220 m on to the open ground before the river track bends towards Chvibiani. Flat the whole way, no climb, no route-finding in the dark.","dist":"0.22 km · flat · 4 min","tip":"This is the no-gamble dawn option: leave at 06:20, be standing there for 06:25, and you still get the alpenglow with 30 minutes in hand before the jeep. The Lamaria knoll is the better composition because it puts towers in the frame, but it costs 44 minutes of walking and leaves no margin. Look out of the window at 05:55 first — Shkhara is in cloud more often than not, and if it is, take the extra hour of sleep.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Shkhara"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91542&mlon=43.01097#map=18/42.91542/43.01097"}],"dy":[8]},{"id":"guesthouse-dinner","n":"Guesthouse supra at Old House","n2":"სასტუმრო სახლის ვახშამი","k":"eat","ll":[42.91479,43.00842],"price":"Dinner 30–35 GEL pp, breakfast 20–25 GEL pp; or ~80 GEL pp for bed, dinner and breakfast","gbp":"Dinner ≈ £8.50–10 pp","open":"Dinner normally served 19:00–20:00, by arrangement in the morning","win":"D7 evening","mins":90,"d":"Ushguli guesthouses feed their guests and this is what almost every trekker eats: a table-filling Svan spread of kubdari (the spiced meat pie), tashmijabi (potato mashed with molten sulguni), chvishtari, lobio, tomato-cucumber salad, matsoni, and homemade chacha handed round. Prices across Svaneti in 2025 were consistently 20–25 GEL for breakfast and 30–35 GEL for dinner, or roughly 80 GEL per person for half board.","go":"You sleep here. Confirm dinner the moment you arrive at 17:30 so it is being cooked while you are out with the towers, and ask them to fix the 4×4 for 07:00 at the same time.","dist":"0 km","tip":"Say yes to it. Cooking finishes around 19:00–20:00 and it is far and away the best value food in the village. Ask the same evening whether they will do a packed breakfast for the jeep — a lot of houses will for about 20 GEL, which matters when you leave at 07:00 and nothing else in Ushguli is open.","links":[{"t":"Beyond Wild Places","u":"https://beyondwildplaces.com/complete-guide-to-the-mestia-to-ushguli-trek/"},{"t":"Monkey's Tale","u":"https://monkeystale.ca/2025/10/24/mestia-to-ushguli-trekking-guide/"},{"t":"Wikivoyage","u":"https://en.wikivoyage.org/wiki/Ushguli"}],"dy":[7]},{"id":"cafe-koshki","n":"Cafe Koshki","n2":"კოშკი","k":"eat","ll":[42.91521,43.01356],"price":"Beer 6 GEL · kebab 16–18 GEL · mains roughly 15–25 GEL","gbp":"Beer ≈ £1.70 · kebab ≈ £4.50–5","open":"No hours published; in practice a daytime and early-evening place, busiest when the jeeps are parked outside","win":"D7 evening","mins":60,"d":"The best-known café in Ushguli, in Chvibiani where the jeeps park, with a terrace and a proper view. Kubdari, khachapuri, tashmijabi, chvishtari, grilled vegetables, soups, and pork or chicken kebab with salad. It serves alcohol — beer at 6 GEL is the cheapest confirmed pint-equivalent in the village.","go":"East from Old House along the main track, past the Chazhashi crossroads and on into Chvibiani. Gentle uphill.","dist":"0.5 km · +27 m · 8 min","tip":"Service is famously slow and reviews are mixed — go for the beer and the terrace rather than the cooking, and eat at the guesthouse. It sits in a cluster: Murkvam (best kubdari in Svaneti, per TripAdvisor), Cafe Svaneti, Malat, Mariami and Polo are all within 100 m of it, so if one is shut another will not be.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g6888424-d11817271-Cafe_Koshki-Ushguli_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"Ushguli restaurants","u":"https://www.tripadvisor.com/Restaurants-g6888424-Ushguli_Samegrelo_Zemo_Svaneti_Region.html"}],"dy":[7]},{"id":"cafe-shumeri","n":"Cafe Shumeri","n2":"შუმერი","k":"cafe","ll":[42.91706,43.02084],"price":"Mains roughly 15–25 GEL · tea a few GEL","gbp":"Mains ≈ £4–7","open":"Mo–Su 09:00–23:30 (OpenStreetMap) — the latest posted hours in Ushguli","win":"D7 evening — the natural stop on the way down from Lamaria","mins":45,"d":"A small upper-Zhibiani café near the top of the village, known for omelettes, Svan mountain flower tea and simple hot food. Cafe Lemi, with its garden and hut, is 25 m away at 42.91760, 43.02089, and there are toilets at 42.91764, 43.02109.","go":"It is 250 m short of Lamaria on the same track — you pass the door both ways.","dist":"1.1 km · +35 m · 18 min","tip":"Those 23:30 hours are the only late opening confirmed anywhere in Ushguli, and it is the one place that is plausibly still serving when you come off the Lamaria knoll at 19:30 in the afterglow. Treat OSM hours as indicative — it is a village of 200 people and things shut when the owner goes home.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/visit-ushguli-georgia-travel-guide/"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91706&mlon=43.02084#map=18/42.91706/43.02084"}],"dy":[7]},{"id":"cafe-bar-enguri","n":"Cafe Bar Enguri","n2":"ენგურის კოშკი","k":"drink","ll":[42.9157,43.01101],"price":"Natakhtari Gold 0.5 l — 8 GEL · chacha shot 7 GEL · homemade lemonade 10 GEL","gbp":"Beer ≈ £2.25 · chacha ≈ £2 · lemonade ≈ £2.80","open":"No published hours; reviews describe evening visits, so it does run into the evening","win":"D7 evening","mins":60,"d":"The nearest thing Ushguli has to a bar: a modern wooden building by the river at the Chazhashi end of the village, with a lounge downstairs, a terrace looking at the mountains and a small cinema room upstairs. Beer, chacha, homemade lemonade, plus lobio and cornbread, ojakhuri, shkmeruli, kharcho, khachapuri and pizza.","go":"270 m east-north-east of Old House on the riverside track between Chazhashi and Chvibiani — the closest drink to your bed.","dist":"0.27 km · 4 min","tip":"Be honest about the drinking here: there is no bar scene. This and Cafe Koshki are it, plus whatever chacha your guesthouse pours you for free, and the Chacha Time café at 42.91589, 43.00963 by the marshrutka bridge. Reviews of Enguri are mixed on value at 3.0/5, but 8 GEL for a half-litre after 27 km is not the point.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g6888424-d12852615-Reviews-Cafe_Bar_Enguri-Ushguli_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91570&mlon=43.01101#map=18/42.91570/43.01101"}],"dy":[7]},{"id":"cinema-dede","n":"Cinema Dede","n2":"დედე","k":"night","ll":[42.91784,43.01547],"price":"Not published — expect a small charge, cash only","gbp":"Unconfirmed","open":"Screenings daily at 13:00, 15:00, 17:00, 19:00 and 21:00","win":"D7 evening — the 19:00 show","mins":105,"d":"A one-room village cinema in Zhibiani that loops Dede, Mariam Khatchvani's 2017 feature about a Svan woman's forced marriage, shot on location in Ushguli with local people. About 97 minutes. There is a second small screening room upstairs at Cafe Bar Enguri showing Georgian films.","go":"0.67 km east-north-east up the main track into Zhibiani, past the Chvibiani cafés.","dist":"0.67 km · +35 m · 12 min","tip":"Listed for completeness and because it is the only organised evening thing in the village, but be realistic: the 19:00 show swallows your last hour of golden light and puts you back at the guesthouse at 21:00 with a 05:55 alarm. Skip it. The 21:00 screening after dinner is the only version that costs you nothing.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/visit-ushguli-georgia-travel-guide/"},{"t":"OSM","u":"https://www.openstreetmap.org/?mlat=42.91784&mlon=43.01547#map=18/42.91784/43.01547"}],"dy":[7]},{"id":"shop-and-practicals","n":"Tekla shop & the practicalities","n2":"თეკლა","k":"market","ll":[42.91488,43.01598],"price":"Snacks a few GEL · Svan salt 10–15 GEL · water 2–3 GEL","gbp":"Svan salt ≈ £3–4","open":"Mo–Su 08:00–23:00 (OpenStreetMap) — shut during your D8 window","win":"D7 evening","mins":25,"d":"The main convenience shop, in the Lamjurishi/Zhibiani strip, doubling as a café. Two more small shops at 42.91518, 43.01347 in Chvibiani and 42.91508, 43.01762. Stock is thin, prices are inflated, and beyond biscuits, water, beer and Svan salt or wool socks there is not much.","go":"0.62 km east along the main track, past Chvibiani.","dist":"0.62 km · +25 m · 11 min","tip":"Everything practical in one place. There is NO ATM in Ushguli and no card acceptance worth relying on — the nearest cash machine is in Mestia, so carry every lari you need. Free drinking-water taps at 42.91759, 43.01506 in Zhibiani and 42.91351, 42.99810 in Murkmeli; public toilets at 42.91611, 43.01262 in Chvibiani. Magti and Geocell both give a usable 4G signal in the village centre, patchy outside it. There is no entrance fee, ticket or parking charge for Ushguli or the UNESCO area — walkers pay nothing to arrive. The 4×4s and shared taxis to Mestia (about 50 GEL a head, 1.5–2 hours) gather at the bridge at the Chazhashi end beside the Chacha Time café, 42.91589, 43.00963, and at the informal bus stop in Chvibiani at 42.91611, 43.01382 — both under 500 m from Old House, so a 07:00 departure means leaving the door at about 06:52.","links":[{"t":"Wander-Lush","u":"https://wander-lush.org/visit-ushguli-georgia-travel-guide/"},{"t":"Monkey's Tale","u":"https://monkeystale.ca/2025/10/24/mestia-to-ushguli-trekking-guide/"},{"t":"Wikivoyage","u":"https://en.wikivoyage.org/wiki/Ushguli"}],"dy":[7]}]},"zugdidi":{"n":"Zugdidi","anchor":[42.51046,41.86018],"anchorName":"Zugdidi Station","days":[4,8],"win":"Fri 13:36–14:15 (40 min) · Tue 14:30–17:30 (3 h)","note":"Treat the two windows completely differently. On D4 you have 40 minutes and the town centre is 1.5 km away, so do not attempt it: the Mestia marshrutkas wait at the bus station 90 m from the platform (down the stairs at the far left-hand end), there are toilets on the platform and a 24/7 ATM about 150 m south on Kuji Street. Put your bags in the van and claim a seat FIRST, then walk three minutes east to Crimean Cheburek at Rustaveli 174 for hot chebureki at 1–10 GEL, with the 24/7 Smart supermarket two minutes away as the guaranteed fallback. Be back by 14:05 — drivers leave when full, though in practice they often wait until nearer 15:00. On D8 you have three hours and the whole point is the Dadiani complex, which is one walled site holding the palace museum, the Blachernae cathedral 80 m away and the botanical garden gate four minutes beyond. The rucksack problem is real: the station has a left-luggage office (Wander-Lush reports staff take bags at the security desk), so ask on arrival, dump the packs, then take a Bolt or station taxi to the palace for 5–7 GEL rather than walking 20 minutes with 15 kg. That buys about 90 minutes across all three sites and gets you back by 17:15 for the 17:50 train. Two traps: the museum shuts at 17:30 and the garden has only two gates, so do not walk its full length. If the luggage office is shut, the fallback is the bazaar — 13 minutes on the direct route into town, packs on, food and real Samegrelo life, then walk back.","items":[{"id":"station-practicals","n":"Zugdidi Bus Station — Mestia marshrutkas, toilets, ATM, left luggage","n2":"ავტოსადგური ზუგდიდი","k":"sight","ll":[42.50967,41.86012],"price":"Marshrutka to Mestia 35–40 GEL · taxi to town centre 5–7 GEL (2–4 GEL on Bolt)","gbp":"≈£10–11 to Mestia","open":"Vans to Mestia time their departure to the train arrival in season; sources say anywhere from 14:00 to 15:00 — plan for 14:15 but expect to wait","win":"either","mins":10,"d":"The single most important 90 metres of your trip. The Mestia vans park on Kuji Street right outside: leave the train, walk over the tracks to the main platform, go to the far left-hand end past the small pavilion, and take the stairs down onto the road. Toilets are on the platform, a 24/7 ATM and a 24/7 Smart convenience store are about 150 m south, and there is a pharmacy open 09:00–23:00.","go":"90 m from the platform — under two minutes.","dist":"90 m · 2 min walk","tip":"Drivers leave when the van is full, not at a fixed time, so put your bags in and claim a seat FIRST, then buy food. Several guides say the Mestia vans actually pull out nearer 15:00 than 14:15, so you may well get more than 40 minutes — but never bank on it. Smart supermarket at Rustaveli 167 is open 24/7, two minutes away, and is the guaranteed fallback for churchkhela, water and beer. For D8, ask at the station security desk about the left-luggage office before you commit to going into town.","links":[{"t":"Wander-Lush: Tbilisi–Zugdidi train","u":"https://wander-lush.org/tbilisi-to-zugdidi-train/"},{"t":"Wander-Lush: getting to Mestia","u":"https://wander-lush.org/tbilisi-to-svaneti-how-to-get-to-mestia/"}],"dy":[4,8]},{"id":"dadiani-palace","n":"Dadiani Palaces Historical and Architectural Museum","n2":"დადიანების სასახლეთა სახელმწიფო ისტორიულ-არქიტექტურული მუზეუმი","k":"museum","ll":[42.51222,41.87417],"price":"17 GEL adult (official site, dadianipalaces.ge) · botanical garden 5 GEL extra","gbp":"≈£4.80","open":"Tue–Sun 10:00–17:30, CLOSED MONDAYS — confirmed open on your Tuesday","win":"D8 3h","mins":75,"d":"Seat of the Dadianis, the ruling family of Mingrelia, remodelled in neo-Gothic by the English architect Edwin Race and a museum since 1921. Around 41,000 objects, and the reason to come: one of only three genuine death masks of Napoleon, brought here by Achille Murat — grandson of Caroline Bonaparte — when he married Princess Salome Dadiani.","go":"1.5 km, about 20 min walk east on Rustaveli then up Zviad Gamsakhurdia Avenue to no. 1 — but with packs take a Bolt or a station taxi, 5–7 GEL and about 6 min.","dist":"1.5 km · 20 min walk (or 5–7 GEL taxi)","tip":"The main Queen Ekaterine palace is under restoration until about 2028, so expect scaffolding and some halls shut. The collection, death mask included, is shown in the restored Niko Dadiani palace 150 m south-west at 42.51093, 41.87463 (listed separately as Tue–Sun 11:00–18:00, 5 GEL, though the official 17 GEL adult ticket is described elsewhere as covering both buildings — ask at the desk). It shuts at 17:30, so arrive by 16:00. Phone +995 595 28 76 76.","links":[{"t":"Official site","u":"https://dadianipalaces.ge/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Dadiani_Palace"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g2156155-d6945126-Reviews-Dadiani_Palaces_Historical_and_Architectural_Museum-Zugdidi_Samegrelo_Zemo_Svane.html"}],"dy":[8]},{"id":"zugdidi-cathedral","n":"Cathedral of the Blachernae Icon of the Mother of God","n2":"ზუგდიდის ვლაქერნის ღმრთისმშობლის საკათედრო ტაძარი","k":"sight","ll":[42.5122,41.87473],"price":"Free","gbp":"Free","open":"Active cathedral, conventionally open through daylight hours — no posted hours found anywhere, so not guaranteed","win":"D8 3h","mins":15,"d":"The Dadianis' court church, 80 m across the courtyard from the museum door, so it costs nothing but the walk. Built 1825–1830 under Levan V Dadiani and funded by Tsar Alexander I, who returned the Blachernae icon to Samegrelo and ordered a church to house it. It holds the relic said to be the robe of the Virgin, venerated by thousands at Vlakernoba each 15 July.","go":"Same walled complex as the palace — cross the courtyard from the museum entrance.","dist":"1.6 km from station · 80 m from the palace museum","tip":"Seat of the Zugdidi and Tsaishi metropolitan and a working church, not a museum. No Zugdidi-specific dress code is published, but at a metropolitan seat assume the norm: shoulders and knees covered, a scarf for women. Carry one rather than rely on the door basket.","links":[{"t":"Wikipedia (Zugdidi)","u":"https://en.wikipedia.org/wiki/Zugdidi"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=42.51224&mlon=41.87470#map=18/42.51224/41.87470"}],"dy":[8]},{"id":"drama-theatre","n":"Shalva Dadiani Zugdidi State Academic Drama Theatre","n2":"შალვა დადიანის სახელობის ზუგდიდის დრამატული თეატრი","k":"monument","ll":[42.50757,41.87603],"price":"Free to look at from outside","gbp":"Free","open":"Exterior any time","win":"D8 3h","mins":15,"d":"Founded 1932 and named for the novelist Shalva Dadiani. The reason to come is not the theatre but the outdoor Soviet mosaic wall and fountain by Apolon Kharebava at 42.50714, 41.87636, 50 m south on Tsotne Dadiani Street — tile combined with bas-relief for a three-dimensional composition. Free, in the open, visible any time.","go":"1.7 km from the station, 21 min walk, or 5–7 GEL by taxi. On Theatre Street south of the palace, so easiest folded into the walk back from Dadiani rather than made a separate trip.","dist":"1.7 km · 21 min walk","tip":"This is the only good Soviet mosaic within walking range: the celebrated Olympic one at the derelict sports complex is 3.1 km out on Besarion Janashia Street, about 40 min each way on foot, so it is a taxi job or a skip. One report calls the theatre wall overgrown, so temper expectations.","links":[{"t":"Wikipedia (Zugdidi)","u":"https://en.wikipedia.org/wiki/Zugdidi"},{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"}],"dy":[8]},{"id":"gamsakhurdia-boulevard","n":"Zviad Gamsakhurdia Avenue and the city boulevard","n2":"ზვიად გამსახურდიას გამზირი","k":"sight","ll":[42.50549,41.87021],"price":"Free","gbp":"Free","open":"Any time","win":"D8 3h","mins":30,"d":"The main street and the spine of any walk through Zugdidi, running from the centre up to the palace gates. Tall trees, a park strip, Soviet apartment blocks with mosaic tiling, and traditional Mingrelian oda houses with carved wooden balconies tucked down the side streets.","go":"About 1.3 km from the station — this is simply the route you walk into town, so it costs nothing extra.","dist":"1.2 km · 16 min walk","tip":"Note the naming trap: Zviad Gamsakhurdia AVENUE (გამზირი) is this central boulevard; Zviad Gamsakhurdia STREET is a different road out by the station. There is a Bank of Georgia branch on the main street with reasonable withdrawal fees. Despite the name, no statue of Gamsakhurdia could be found in any map database — the avenue is the memorial.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=42.50733&mlon=41.87217#map=17/42.50733/41.87217"}],"dy":[8]},{"id":"botanical-garden","n":"Zugdidi Botanical Garden","n2":"ზუგდიდის ბოტანიკური ბაღი","k":"nature","ll":[42.51061,41.87509],"price":"5 GEL (free 06:00–09:00 and 21:00–23:00 daily, and on the last Friday of the month)","gbp":"≈£1.41","open":"06:00–23:00 daily; open Tuesday afternoon","win":"D8 3h","mins":35,"d":"Laid out in 1840 by Prince David Dadiani and stocked by his wife Ekaterine Chavchavadze, 26 hectares of arboretum behind the palaces with over eighty genera of exotics from Japan, India, the Mediterranean and the Americas. Shaded, quiet and a good place to sit before a five-and-a-half-hour train.","go":"The main gate is at 42.51061, 41.87509, four minutes on from the cathedral — so chain palace, cathedral and garden rather than making a separate trip. 22 min on foot from the station, or 5–7 GEL by taxi.","dist":"1.6 km to the main gate · 22 min walk","tip":"Roughly 25 hectares with only TWO gates, so going deep means committing to the full length or doubling back — with a train to catch, stay near the western end. Paying window: entry is only free 06:00–09:00 and 21:00–23:00, so your afternoon costs 5 GEL each. Bring mosquito spray; the whole Samegrelo lowland is subtropical.","links":[{"t":"Official site","u":"https://zbg.ge/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Zugdidi_Botanical_Garden"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g2156155-d7205034-Reviews-Zugdidi_Botanical_Garden-Zugdidi_Samegrelo_Zemo_Svaneti_Region.html"}],"dy":[8]},{"id":"crimean-cheburek","n":"Crimean Cheburek Zugdidi","n2":"ყირიმის ჩებურეკი","k":"cafe","ll":[42.50961,41.86217],"price":"Chebureki, a few GEL each — no menu prices published on the delivery listing","gbp":"≈£1–3","open":"10:00–20:00 every day (Wolt) — open at 13:36 on the Friday and right through the Tuesday window","win":"D4 40min","mins":15,"d":"Hot cheese and meat chebureki fried to order at 174 Rustaveli Avenue, three minutes from the platform. Run by Elena Gorbenko and listed as a bakery; scores 9.6 on Wolt. This is the best answer to the forty minutes: real hot food, eaten on the road, for pocket change.","go":"240 m east along Rustaveli from the station — three minutes.","dist":"240 m · 3 min walk","tip":"The 9.6 rating rests on only ten reviews, so treat it as promising rather than proven. It is the same spot as the unnamed tone bakery mapped at Rustaveli 163, so look for the oven. If it is shut, the Smart supermarket by the station is open 24/7. Take small notes — nobody will change a 100 GEL bill.","links":[{"t":"Wolt listing","u":"https://wolt.com/en/geo/zugdidi/restaurant/crimean-cheburek-zugdidi"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=42.50961,41.86217"}],"dy":[4]},{"id":"kvarabia-bakery","n":"Kvarabia bakery","n2":"კვარაბია","k":"cafe","ll":[42.50748,41.85626],"price":"1–20 GEL a head; Google 4.8 from 59 reviews","gbp":"≈£0.30–6","open":"10:00–23:00 daily (three sources agree) — open Tuesday afternoon and at 13:36 on Friday","win":"D4 40min","mins":15,"d":"The best actual food near the station and a proper local favourite: khachapuri, kubdari, khinkali, eclairs and kada. Busiest at 2pm, which is exactly when you arrive on the Friday.","go":"500 m west along Rustaveli from the station to no. 209 — seven minutes, so a 14-minute round trip.","dist":"500 m · 7 min walk","tip":"Phone +995 558 58 58 42. Cards accepted, beer served, indoor seating. Only worth it if you move straight off the train — if the marshrutka is filling, take the 3-minute cheburek option instead.","links":[{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/node/12209381447"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=42.50748,41.85626"}],"dy":[4]},{"id":"diaroni","n":"Restaurant Diaroni","n2":"დიარონი","k":"eat","ll":[42.50694,41.8733],"price":"Published menu: Megrelian khachapuri 20 GEL (small 15), walnut kharcho 25, gebzhalia 18, elarji 15, chvishtari 25, ghomi 5, khinkali 2 each, shoti 3, draught Staropramen 0.5 L 10 — PLUS 12% service. Two sharing khachapuri, elarji, gebzhalia and two beers ≈ 87 GEL","gbp":"≈£24–25 for two, or ≈£6–8 a head if you share","open":"10:00–23:00 every day, confirmed on their own site — open right through your window","win":"D8 3h","mins":75,"d":"Ranked first of 31 restaurants in Zugdidi and the name everyone gives you for Mingrelian food: kharcho with walnut, elarji, ghomi, gebzhalia, Megrelian kupati, chvishtari. Big indoor room and a summer terrace.","go":"1.3 km from the station, 18 min walk, or 5–7 GEL by taxi. Meunargia St 9, just south of the palace — combine it with the Dadiani visit.","dist":"1.3 km · 18 min walk (or 5–7 GEL taxi)","tip":"The 12% service charge is printed on every page of their menu, so factor it in. Reviewers single out the walnut kharcho and the elarji. Service is slow, so order the moment you sit and ask for the bill early — you have a 17:50 train. Phone +995 415 22 11 22.","links":[{"t":"Official menu","u":"http://diaroni.ge"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g2156155-d7204884-Reviews-Restaurant_Diaroni-Zugdidi_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"RestaurantGuru","u":"https://restaurantguru.com/Diaroni-Zugdidi"}],"dy":[8]},{"id":"the-host","n":"The Host (Mendzel)","n2":"მასპინძელი","k":"eat","ll":[42.5042,41.86745],"price":"Around 20–30 GEL a head at lunch; one reviewed bill of 75 GEL covered soup, clay-pot pork and two beers","gbp":"≈£6–9 a head","open":"10:00–22:00 daily — open Tuesday afternoon","win":"D8 3h","mins":70,"d":"Fourth of 31 on TripAdvisor and the other serious Mingrelian option — megruli khachapuri, gebzhalia, elarji, ghomi, chakhokhbili with walnuts, beef stew, served in a slightly daft castle-like interior. Kostava St 34.","go":"1.5 km from the station, 20 min walk south-east — the furthest of the three, so take a taxi for 5–7 GEL. Merab Kostava St 34.","dist":"1.5 km · 20 min walk (or 5–7 GEL taxi)","tip":"Gebzhalia, elarji, chakhokhbili with walnuts, ghomi and the 'royal' Dadiani khachapuri. Castle-ish interior with stained glass. Reviews repeatedly flag hour-long waits and heavy, oily cooking — a real risk with a train to catch.","links":[{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Restaurant_Review-g2156155-d6976676-Reviews-Host-Zugdidi_Samegrelo_Zemo_Svaneti_Region.html"},{"t":"RestaurantGuru","u":"https://restaurantguru.com/Mendzel-Zugdidi"}],"dy":[8]},{"id":"kolkhuri","n":"Kolkhuri","n2":"კოლხური","k":"eat","ll":[42.50637,41.86906],"price":"Canteen prices, no published per-dish figures — the cheapest proper meal in town","gbp":"≈£3–6 a head","open":"09:00–23:00 daily (one directory says 19:00 close); open across your window either way","win":"D8 3h","mins":35,"d":"Kolkhuri saojakho samzareulo, 'Kolkhuri family kitchen' — a home-cooking canteen with its own bakery: hot and cold dishes behind glass, pastries, coffee. Point at what you want; no menu and no English needed.","go":"1.1 km east from the station along Rustaveli, 14 min — the closest proper restaurant to the platform, no taxi needed. Merab Kostava St 54.","dist":"1.1 km · 14 min walk","tip":"Much the fastest sit-down option and the least walking, and it pairs naturally with the bazaar three minutes away. Phone +995 595 21 68 68.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=42.50635&mlon=41.86902#map=19/42.50635/41.86902"}],"dy":[8]},{"id":"tamtini-bakery","n":"Tamtini Bakery","n2":"თამთინი","k":"cafe","ll":[42.50668,41.87212],"price":"Around 10–20 GEL a head for cake and coffee","gbp":"≈£3–6","open":"Mon–Sun 09:00–21:00 (OSM re-surveyed May 2026) — open, and 16:00 is its busiest hour of the week","win":"D8 3h","mins":30,"d":"The best-verified cafe in town and a genuine local institution with 24k followers: fruit tarts, tortes, medoki honey cake, cinnamon rolls, khachapuri and proper coffee, with courtyard seating. The reliable stop between the palace and the train.","go":"1.2 km from the station, 15 min walk, or a couple of lari by Bolt. Rustaveli St 87A, on the way back from the palace.","dist":"1.2 km · 15 min walk","links":[{"t":"Facebook","u":"https://www.facebook.com/tamtini.in.zugdidi"},{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"}],"dy":[8]},{"id":"cafe-botanico","n":"Cafe Botanico","n2":"კაფე ბოტანიკო","k":"cafe","ll":[42.511,41.87645],"price":"Around 30–40 GEL a head — the priciest option here — plus the 5 GEL garden entry","gbp":"≈£8–11 a head","open":"11:00–23:00 (Google); open Tuesday afternoon","win":"D8 3h","mins":30,"d":"Georgian and European food inside the botanical garden itself, so you can turn the garden stop into a sit-down without walking anywhere else. Summer DJ nights, though not at four in the afternoon.","go":"Inside the Zugdidi Botanical Garden, behind the palaces — 1.7 km from the station.","dist":"1.8 km · 24 min walk (or 5–7 GEL taxi)","tip":"Only worth it because you are already paying to be in the garden — otherwise it is the furthest and dearest thing on this list. Phone +995 598 38 23 82.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=42.51100&mlon=41.87645#map=19/42.51100/41.87645"}],"dy":[8]},{"id":"garden-palace-terrace","n":"Garden Palace rooftop terrace","n2":"გარდენ პალასის ტერასა","k":"drink","ll":[42.50781,41.87299],"price":"Hotel-bar prices; not published","gbp":"≈£2–4 a drink","open":"Terrace hours not verified — phone +995 557 32 30 28 before making the walk","win":"D8 3h","mins":40,"d":"Five storeys up at 1 Theatri Street, looking over the botanical garden and the city, with Samegrelo dishes and pizza alongside the drinks. Zugdidi's only rooftop bar, and 100 m from Diaroni so the two combine in one trip.","go":"1.3 km from the station, 17 min walk, or 5–7 GEL by taxi.","dist":"1.3 km · 17 min walk (or 5–7 GEL taxi)","tip":"Important: Mego Bar, the place every blog recommends for a cheap beer in Zugdidi, does NOT open until 18:00 — half an hour after you need to be back at the station. Do not walk out there. This terrace, or the beer hall by the station, are the workable alternatives.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=42.50781,41.87299"}],"dy":[8]},{"id":"beer-on-rustaveli","n":"Beer on Rustaveli (ludi Rustavelze)","n2":"ლუდი რუსთაველზე","k":"drink","ll":[42.50956,41.86267],"price":"Draught beer; no published prices","gbp":"≈£1–2 a beer","open":"Opens 09:30","win":"D8 3h","mins":30,"d":"A draught beer hall at Rustaveli 155, three minutes from the platform — the practical answer to wanting a pint before the 17:50 train without gambling on getting back across town in time. Rated 5.0 on Google, though on only nine reviews.","go":"250 m east along Rustaveli from the station.","dist":"250 m · 3 min walk","tip":"Phone +995 577 59 16 34. Note the OSM-listed 'Sanapiro' pub nearby comes from a 2010 bulk import with no reviews and may no longer exist — this one is current.","links":[{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=42.50956,41.86267"},{"t":"OpenStreetMap area","u":"https://www.openstreetmap.org/#map=18/42.50956/41.86267"}],"dy":[8]},{"id":"kera-spices","n":"Kera spice shop","n2":"კერა","k":"market","ll":[42.50953,41.86402],"price":"Small bags of ajika and spice blends, a few GEL each","gbp":"≈£1–3","open":"Small family shop, normal retail hours — no published hours found, so not guaranteed","win":"either","mins":15,"d":"A proper spice shop at Rustaveli 137, five minutes from the station on the way into town — wet and dry ajika, marigold, fenugreek, kondari mountain oregano, plus wooden spoons and mortars. The best edible souvenir of Samegrelo and far easier than haggling at the bazaar.","go":"420 m east along Rustaveli from the station.","dist":"360 m · 5 min walk","tip":"Red sign, English-speaking staff. Just about doable in the 40-minute window if you are quick and the bakery is your only other stop.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=42.50953&mlon=41.86402#map=19/42.50953/41.86402"}],"dy":[4,8]},{"id":"zugdidi-bazaar","n":"Zugdidi Bazaar (central agrarian market)","n2":"ზუგდიდის ბაზარი","k":"market","ll":[42.50757,41.8672],"price":"Free to walk round","gbp":"Free","open":"Daily from 08:00 until late; busiest in the morning but trading on a Tuesday afternoon","win":"D8 3h","mins":45,"d":"One of the biggest food markets in Georgia and the best free thing in Zugdidi — stalls of wet and dry ajika, khmeli suneli, Svan salt, sulguni, churchkhela, hazelnuts and the region's produce. It is also the single most honest look at Samegrelo you will get in three hours.","go":"13 min walk from the station, straight out and east along Rustaveli. It sits directly on the walking route into the centre, so it costs no detour.","dist":"0.97 km · 13 min walk","tip":"Honest caveat: mornings and weekends are the best of it, so a Tuesday at 15:00 will be trading but quieter than the photos suggest. Still the best free thing in town, and the best plan-B if the left-luggage office is shut, because you can do it with packs on. Cash only; there are exchange desks inside where families from Abkhazia change roubles. If you buy ajika, double-bag it or it will perfume everything you own.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/zugdidi-georgia-guide/"},{"t":"OpenStreetMap","u":"https://www.openstreetmap.org/?mlat=42.50751&mlon=41.86727#map=18/42.50751/41.86727"}],"dy":[8]}]},"tbilisi-vera":{"n":"Tbilisi · last day","anchor":[41.70687,44.78867],"anchorName":"ibis budget Tbilisi Center","days":[9],"win":"Wed 08:00–18:30, bags at the hotel","note":"Ten hours, no rucksacks, and the hotel sits in Vera at 22 Giorgi Akhvlediani St — 7 minutes from Rustaveli metro and 3 minutes from Vera Park. A sane shape: coffee in Vera at 08:00, out to the Chronicle of Georgia early, back by noon, Dry Bridge Market on the way in, a long lunch, one museum in the afternoon, shopping, one drink, then Bolt to the airport at 18:30 (~35 GEL, 30–40 min; the airport wants you there two hours before a 21:30 flight). The Chronicle is worth it, with a caveat: entry is free and the thing itself is genuinely staggering, but it is 9 km north of the centre and by metro-plus-bus-plus-uphill-walk it is 50–70 minutes each way, so the round trip eats 3–3.5 hours. Bolt at least one leg (20–30 GEL) and it becomes a 2.5-hour outing that still leaves the whole afternoon. One live warning: Rustaveli Avenue is closed to traffic and being dug up from 23 July until end-November 2026 — roadway milled, pavements being relaid between Chovelidze St and Freedom Square. The museums, Opera and Kashveti are all open and reachable on foot, but it is a building site, not a boulevard, so budget the avenue as a functional walk rather than a highlight. For things to take home: spices, Svan salt and churchkhela at local prices from Dezerter Bazaar (not the tourist shops, where pre-packed spice sets are marked up hard); wine and chacha from 8000 Vintages behind the Opera; Soviet junk, ceramics and paintings from Dry Bridge — but genuinely old icons, carpets and coins can need an export permit, so keep to bric-a-brac. All bottles go in the hold.","items":[{"id":"chronicle-of-georgia","n":"Chronicle of Georgia","n2":"საქართველოს მატიანე","k":"monument","ll":[41.7705,44.81044],"price":"Free; transport 2 GEL return by metro+bus, or 20–30 GEL each way by Bolt","gbp":"Free · £0.60 or £6–8 each way","open":"Open-air, 24/7, no gate, no ticket","win":"D9 morning — leave by 08:30","mins":60,"d":"Zurab Tsereteli's unfinished 1985 megalith on Keeni Hill above the Tbilisi Sea: sixteen bronze pillars 30–35 m tall, kings and queens and heroes on the upper halves, the life of Christ below, plus St Nino's grapevine cross and a chapel, all at the top of a huge flight of steps. Empty, silent, and the scale does not come across in photographs.","go":"Metro red line from Rustaveli to Ghrmaghele (6 stops, ~15 min, 1 GEL), then bus 360 from the stop by the station to the Cadet Corps / Military School stop (~20 min, every ~15 min, free within the 90-min transfer window), then 850 m uphill on foot (10–15 min) — either the road or a stairway shortcut. Some guides say bus 60 instead of 360; check the Bolt or TTC app on the day. Total 50–70 min each way. Bolt straight there is 30–40 min and 20–30 GEL.","dist":"9 km north of the hotel","tip":"The honest maths: 3–3.5 hours round trip on public transport, 2.5 hours if you Bolt. Do it first thing while you're fresh and it costs you the morning, not the day. Bolt back from the monument works — drivers do pick up there — but confirm a car appears before you dismiss the bus.","links":[{"t":"Wander-Lush · 10 things to know","u":"https://wander-lush.org/chronicles-of-georgia-tbilisi/"},{"t":"Journal of Nomads · how to get there","u":"https://www.journalofnomads.com/chronicles-of-georgia-tbilisi/"},{"t":"Kathmandu & Beyond · independent visit","u":"https://www.kathmanduandbeyond.com/visit-chronicle-of-georgia-tbilisi/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Chronicle_of_Georgia"}],"dy":[9]},{"id":"janashia-national-museum","n":"Simon Janashia Museum of Georgia","n2":"სიმონ ჯანაშიას სახელობის საქართველოს მუზეუმი","k":"museum","ll":[41.69604,44.80022],"price":"40 GEL foreign adult, 15 GEL student","gbp":"≈£11 / £4.25","open":"Tue–Sun 10:00–18:00, last entry 17:30; closed Mondays. Open Wed 9 Sep","win":"D9 afternoon","mins":100,"d":"The main national museum, at 3 Rustaveli beside Parliament. Two things matter: the Archaeological Treasury in the basement — pre-Christian Colchian and Iberian goldwork, some of the finest in the world — and the Museum of Soviet Occupation upstairs, a bleak, unsentimental account of 1921–1991 built around execution lists, a bullet-riddled railway carriage and the files of the repressed.","go":"Walk down Kostava onto Rustaveli Ave and continue southeast past the Gallery and Parliament; the museum is the columned building on the left before Freedom Square.","dist":"1.5 km · 22 min walk","tip":"40 GEL is steep by Georgian standards and it is the single most expensive ticket on this list — if you only do one, the Soviet Occupation floor is the part that justifies it. Prices and hours are on the official site; 9 September is not one of the museum's listed closure days.","links":[{"t":"museum.ge · ticket prices","u":"https://museum.ge/index.php?m=319&lang_id=ENG"},{"t":"museum.ge · working hours","u":"https://museum.ge/index.php?m=318&lang=eng"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d671258-Reviews-Georgian_National_Museum-Tbilisi.html"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/georgian-national-museum/"}],"dy":[9]},{"id":"national-gallery","n":"National Gallery (the Blue Gallery)","n2":"დიმიტრი შევარდნაძის სახელობის ეროვნული გალერეა","k":"museum","ll":[41.6983,44.79882],"price":"25 GEL adult","gbp":"≈£7","open":"Tue–Sun 10:00–18:00; closed Mondays. Open Wed 9 Sep","win":"D9 afternoon","mins":60,"d":"The 1888 'Blue Gallery' at 11 Rustaveli, reopened in spring 2026 after a long refit. The reason to go is Pirosmani: four rooms, 54 canvases, the feast scenes and animals and the lesser-known portraits — the largest collection of him anywhere. Lado Gudiashvili and David Kakabadze fill out the Georgian modernists.","go":"Straight down Kostava onto Rustaveli Ave; it is set back behind trees just past the Parliament, opposite the Marriott.","dist":"1.3 km · 20 min walk","tip":"Cheaper, smaller and more rewarding per lari than the National Museum if you want one art thing rather than one history thing. Pirosmani canvases do travel on loan, so a few of the famous ones may be out.","links":[{"t":"Wander-Lush · Tbilisi museums","u":"https://wander-lush.org/best-tbilisi-museums-galleries/"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d3641171-Reviews-National_Gallery-Tbilisi.html"},{"t":"In Your Pocket","u":"https://www.inyourpocket.com/georgia/tbilisi/venues/the-national-gallery"}],"dy":[9]},{"id":"museum-of-fine-arts","n":"Georgian Museum of Fine Arts (MFA)","n2":"ქართული სახვითი ხელოვნების მუზეუმი","k":"museum","ll":[41.69721,44.79955],"price":"18 GEL standard, 9 GEL student (some special exhibitions 30 GEL)","gbp":"≈£5 / £2.50","open":"≈10:00–19:00, ticket desk closes 18:30; most sources say closed Mondays. Open Wed 9 Sep","win":"D9 afternoon","mins":75,"d":"A private five-floor museum at 7 Rustaveli, directly opposite Parliament, purpose-built in 2013 to hold the Kordzaia family collection — over 3,500 works, roughly 100 contemporary Georgian artists alongside twentieth-century names. Big, bright, uncrowded, and the best-value serious art ticket on the avenue.","go":"Down Kostava onto Rustaveli Ave, southeast past the Gallery; it is on the right-hand side facing Parliament, entrance on Rustaveli (the building backs onto Lado Gudiashvili St).","dist":"1.4 km · 22 min walk","tip":"The Museum café on the ground floor does a decent cappuccino for about 10 GEL and a pistachio croissant — a useful stop even if you skip the galleries.","links":[{"t":"Official site · visit","u":"https://finearts.ge/visit"},{"t":"Wander-Lush · Tbilisi museums","u":"https://wander-lush.org/best-tbilisi-museums-galleries/"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/georgian-museum-of-fine-arts/"}],"dy":[9]},{"id":"writers-house","n":"Writers' House of Georgia","n2":"მწერალთა სახლი","k":"museum","ll":[41.6902,44.79968],"price":"Museum of Repressed Writers 7 GEL; house and garden free","gbp":"≈£2 / Free","open":"House Mon–Fri 11:00–19:00; Repressed Writers museum Tue–Fri 11:00–18:00. Open Wed 9 Sep","win":"D9 late morning or afternoon","mins":50,"d":"The 1905 art-nouveau mansion the cognac magnate David Sarajishvili built at 13 Machabeli St, later the Soviet Writers' Union headquarters and the place where the writer Paolo Iashvili shot himself in 1937. The small Museum of Repressed Writers inside is a quiet, human counterpart to the big Soviet Occupation display; the Litera café in the garden is one of the nicest places to sit in central Tbilisi.","go":"Down Rustaveli Ave to Freedom Square, then up into Sololaki along Machabeli St — the mansion is on the left with wrought-iron gates.","dist":"2.1 km · 30 min walk","tip":"Weekdays only — this is one to fit in on a Wednesday precisely because it is shut at weekends. Litera's garden is a good half-hour with a glass of wine if the museum is closed for an event.","links":[{"t":"Wander-Lush · Tbilisi museums","u":"https://wander-lush.org/best-tbilisi-museums-galleries/"},{"t":"Eurasia.travel","u":"https://eurasia.travel/georgia/tbilisi/writers-house/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Writers%27_House_of_Georgia"}],"dy":[9]},{"id":"photo-museum-stamba","n":"Tbilisi Photography & Multimedia Museum","k":"museum","ll":[41.70568,44.78792],"price":"Free","gbp":"Free","open":"Mon–Fri 12:00–19:00, Sat–Sun 14:00–20:00. Open Wed 9 Sep","win":"D9 afternoon","mins":40,"d":"A free contemporary photography and video space inside Stamba, the old Soviet printing house at 14 Merab Kostava St that is now a hotel. Two or three rooms of rotating exhibitions, and the atrium of the building itself — cast-iron printing presses, a vertical garden, an indoor farm — is worth walking into on its own.","go":"Two minutes: out of the ibis, right onto Kostava St, Stamba is the big brick block on the same side.","dist":"150 m · 2 min walk","tip":"The closest thing to the hotel on this whole list, and free. Stamba's ground floor also has a design shop and Café Stamba if you want somewhere civilised to kill an hour before the airport run.","links":[{"t":"Wander-Lush · Tbilisi museums","u":"https://wander-lush.org/best-tbilisi-museums-galleries/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70568,44.78792"}],"dy":[9]},{"id":"rustaveli-avenue-walk","n":"Rustaveli Avenue walk","n2":"შოთა რუსთაველის გამზირი","k":"sight","ll":[41.70122,44.79422],"price":"Free","gbp":"Free","open":"Any time","win":"D9 — link the museums together","mins":45,"d":"The 1.5 km spine of the city, from the top of Kostava down to Freedom Square: the Academy of Sciences at 52, the Opera at 25, Prospero's bookshop at 34, the Rustaveli Theatre at 17, the National Gallery at 11, the Parliament at 8 with its steps that every Georgian protest has used, the Vorontsov Palace at 6 and the National Museum at 3.","go":"The avenue begins where Kostava St ends, 450 m / 7 min from the hotel by Rustaveli metro.","dist":"Starts 450 m · 7 min from the hotel","tip":"Reality check for September 2026: the whole avenue between Chovelidze St and Freedom Square is closed to traffic and under full rehabilitation from 23 July to end-November — asphalt milled, utilities replaced, pavements being torn up and relaid in stone. Everything is open and walkable but it is dusty and hoarded. Bus 337 to the airport is diverted, so do not count on catching it here.","links":[{"t":"Wikipedia · Rustaveli Avenue","u":"https://en.wikipedia.org/wiki/Rustaveli_Avenue"},{"t":"Civil.ge · avenue closed for rehabilitation","u":"https://civil.ge/archives/745219"},{"t":"Georgia Today · works begin 23 July","u":"https://georgiatoday.ge/rustaveli-avenue-rehabilitation-begins-july-23-traffic-restrictions-imposed/"}],"dy":[9]},{"id":"opera-house","n":"Georgian National Opera Theatre","n2":"ოპერისა და ბალეტის თეატრი","k":"sight","ll":[41.70131,44.79617],"price":"Free to look; tickets from ≈20 GEL","gbp":"Free · from ≈£6","open":"Exterior any time; box office and season resume in September","win":"D9 — on the Rustaveli walk","mins":15,"d":"The 1896 Moorish-revival opera house at 25 Rustaveli, all striped brick and horseshoe arches, restored in 2016 and one of the handsomest buildings in the Caucasus. The interior is a gilded confection if you can get in.","go":"Down Kostava onto Rustaveli Ave; it is the striped building on the right-hand side about 500 m along.","dist":"900 m · 13 min walk","tip":"The new season typically opens in September — if something is on that evening it will be starting long after your 18:30 airport run, so this is a look-at-the-outside stop.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Tbilisi_Opera_and_Ballet_Theatre"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70131,44.79617"}],"dy":[9]},{"id":"kashveti-church","n":"Kashveti Church of St George","n2":"ქაშვეთის წმინდა გიორგის ეკლესია","k":"sight","ll":[41.69795,44.79932],"price":"Free","gbp":"Free","open":"Daily, roughly daylight hours; a working church","win":"D9 — on the Rustaveli walk","mins":15,"d":"The 1910 white limestone church directly opposite Parliament, modelled on the eleventh-century cathedral at Samtavisi. Worth stepping inside for Lado Gudiashvili's 1947 apse fresco, which got him expelled from the Communist Party for painting it.","go":"On Rustaveli Ave between the Gallery and Parliament; a small garden in front.","dist":"1.3 km · 20 min walk","tip":"Shoulders and knees covered; women are given headscarves at the door. Free and takes ten minutes — the best-value stop on the avenue.","links":[{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Kashveti_Church"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.69795,44.79932"}],"dy":[9]},{"id":"mtatsminda-pantheon","n":"Mtatsminda Pantheon","n2":"მთაწმინდის პანთეონი","k":"monument","ll":[41.69583,44.78889],"price":"Free","gbp":"Free","open":"Daily 09:30–18:00","win":"D9 morning (the alternative to the Chronicle)","mins":50,"d":"The writers' and public figures' cemetery cut into the hillside beside the Mamadaviti church, straight up the slope from Vera. Ilia Chavchavadze, Niko Pirosmani, Vazha-Pshavela, Galaktion Tabidze and the Russian playwright Griboyedov are all here, under the terrace with one of the best free views over the city.","go":"Uphill on foot: from the hotel take Kostava down to Polikarpe Kakabadze St and follow Mama Daviti Rise, a steep switchback street with a pedestrian path and benches — about 30–35 min from the ibis, 15 min from Rustaveli metro. Or take the funicular one stop from the lower station.","dist":"1.6 km · 30–35 min uphill walk","tip":"If you skip the Chronicle of Georgia, this plus the funicular is the natural substitute — a hillside morning that costs nothing and puts you back in Vera by lunchtime. It is a genuinely steep climb; do it before the day heats up.","links":[{"t":"Wander-Lush · Mtatsminda guide","u":"https://wander-lush.org/mtatsminda-tbilisi-tv-tower-hike/"},{"t":"Wikipedia","u":"https://en.wikipedia.org/wiki/Mtatsminda_Pantheon"}],"dy":[9]},{"id":"funicular-mtatsminda","n":"Tbilisi Funicular & Mtatsminda Park","n2":"თბილისის ფუნიკულიორი","k":"view","ll":[41.69521,44.79073],"price":"10–12 GEL one way, plus a 2 GEL rechargeable Mtatsminda card; 3 GEL Pantheon-to-top","gbp":"≈£3–3.50 + £0.60","open":"Daily ≈09:00–24:00 in summer (some sources 09:45–23:30)","win":"D9 morning or late afternoon","mins":60,"d":"The 1905 funicular climbs from a handsome brick station at 22 Daniel Chonkadze St to Mtatsminda Park at 770 m in three to eight minutes, with an intermediate stop at the Pantheon. The top has a Ferris wheel, a park and the widest view in Tbilisi — Sameba, Narikala and the whole river bend at once.","go":"≈20 min walk from the ibis: Kostava to Rustaveli metro, then up through Mtatsminda's streets to Chonkadze St and the lower station.","dist":"1.3 km · 20 min walk to the lower station","tip":"You have to buy the 2 GEL plastic card before you can load a fare, but one card works for two people. Tell the staff at the bottom if you want to get off at the Pantheon — not every car stops, and re-boarding to continue up costs another 3 GEL.","links":[{"t":"Tbilisi Local Guide · funicular","u":"https://tbilisilocalguide.com/tbilisi/funicular-railway/"},{"t":"Wander-Lush · Mtatsminda guide","u":"https://wander-lush.org/mtatsminda-tbilisi-tv-tower-hike/"}],"dy":[9]},{"id":"vera-park","n":"Vera Park","n2":"ვერის ბაღი","k":"nature","ll":[41.7085,44.78801],"price":"Free","gbp":"Free","open":"Always open","win":"D9 any time — it is on the doorstep","mins":25,"d":"The neighbourhood's green heart, three minutes from the hotel between Kostava and Nikoladze streets by the Philharmonia concert hall. Sixty-odd species of tree including cedars and oaks, fountains, benches, a chess palace and outdoor gym kit, and cafés around the edges. Built over an eighteenth-century estate and a nineteenth-century cemetery.","go":"Out of the ibis and 200 m north along Kostava St.","dist":"200 m · 3 min walk","tip":"The obvious place to sit for twenty minutes with a coffee at 08:00 before deciding what the day is, or to kill the last half-hour before you collect the bags.","links":[{"t":"In Your Pocket","u":"https://www.inyourpocket.com/tbilisi/vera-park_113582v"},{"t":"Georgian Travel Guide","u":"https://georgiantravelguide.com/en/vera-park"}],"dy":[9]},{"id":"shavi-coffee-roasters","n":"Shavi Coffee Roasters (The Original)","n2":"შავი","k":"cafe","ll":[41.7041,44.78402],"price":"Cappuccino 10–12 GEL; beans by the bag","gbp":"≈£3","open":"Daily 08:00–21:00","win":"D9 08:00 — first stop of the day","mins":40,"d":"Tbilisi's best-known specialty roastery, at 40 Zandukeli St in Vera — bright, airy, Brooklyn-loft, roasting on site, with bar seating and a proper filter menu. This is the flagship of a small local chain and the standard against which the rest of the city's third-wave scene is measured.","go":"8 min on foot: Kostava St southwest, then Zandukeli — a straight run through the back streets of Vera.","dist":"500 m · 8 min walk","tip":"Open from 08:00, which very few good Tbilisi cafés are. A bag of their beans is a light, cheap, entirely un-touristy thing to take home in a rucksack.","links":[{"t":"Official site","u":"https://shavi.coffee"},{"t":"Wander-Lush · best cafes","u":"https://wander-lush.org/best-cafes-in-tbilisi-coffee-shops/"}],"dy":[9]},{"id":"pulp-vera","n":"Pulp","n2":"ფალფი","k":"cafe","ll":[41.70597,44.78154],"price":"Cappuccino 7–12 GEL; pastries and breakfast plates","gbp":"≈£2–3.50","open":"Daily, morning through early evening (exact hours unconfirmed)","win":"D9 08:00–09:30 breakfast","mins":45,"d":"A small Vera bakery-café at 22 Simon Janashia St doing laminated dough properly — croissants, kouign-amann, danishes — plus a rotating daily breakfast special and decent coffee at the cheapest end of the specialty range.","go":"10 min west through Vera: Kostava St, then left onto Simon Janashia St.","dist":"600 m · 10 min walk","tip":"Cheaper coffee than Shavi and much better pastry. Two croissants and two cappuccinos comes in around 30 GEL.","links":[{"t":"Wander-Lush · best cafes","u":"https://wander-lush.org/best-cafes-in-tbilisi-coffee-shops/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70597,44.78154"}],"dy":[9]},{"id":"prosperos-books","n":"Prospero's Books & Caliban's Coffee","n2":"პროსპეროს წიგნები","k":"cafe","ll":[41.70122,44.79422],"price":"Cappuccino ≈10 GEL; books at cover price","gbp":"≈£3","open":"Daily, roughly 10:00–20:00 (not independently confirmed)","win":"D9 — on the Rustaveli walk","mins":40,"d":"The English-language bookshop at 34 Rustaveli, down a courtyard off the avenue, with Caliban's Coffee in the garden behind. Strong Caucasus and Georgia section — history, translated fiction, cookbooks — and the courtyard is a genuine escape from the roadworks.","go":"Down Kostava onto Rustaveli Ave; the entrance is an easily-missed archway on the right.","dist":"800 m · 12 min walk","tip":"The best place in the city to buy something to read on the flight, and a Georgian cookbook or a Kapuscinski-ish Caucasus history packs flat in a rucksack better than ceramics do.","links":[{"t":"Wander-Lush · best cafes","u":"https://wander-lush.org/best-cafes-in-tbilisi-coffee-shops/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70122,44.79422"}],"dy":[9]},{"id":"khinkali-house-rustaveli","n":"Khinkali House (Rustaveli 37)","n2":"ხინკლის სახლი","k":"eat","ll":[41.70376,44.79069],"price":"13–26 GEL per person","gbp":"≈£3.70–7.40","open":"Daily 10:00–01:00","win":"D9 lunch","mins":60,"d":"The cheap, unfussy khinkali and khachapuri house at 37 Rustaveli, directly opposite the Rustaveli metro entrance and six minutes from the hotel. Two floors, live music sometimes on the first, and the dumplings are perfectly good.","go":"Out of the ibis, down Kostava to where it becomes Rustaveli Ave; it is on the left by the metro.","dist":"400 m · 6 min walk","tip":"The genuinely budget option: ten khinkali, a plate of pkhali and two beers lands around 50–60 GEL for two. Order khinkali in units of five, hold them by the topknot, don't eat the knot, and never use a fork.","links":[{"t":"Restaurant Guru","u":"https://restaurantguru.com/Khinkali-House-Rustaveli-Tbilisi"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70376,44.79069"}],"dy":[9]},{"id":"tbilisi-vera-salobie-bia","n":"Salobie Bia","n2":"სალობიე ბია","k":"eat","ll":[41.6996,44.79743],"price":"20–70 GEL per person","gbp":"≈£6–20","open":"Daily 12:00–22:30","win":"D9 lunch — the proper last Georgian meal","mins":90,"d":"An underground cellar beneath the Rustaveli Theatre at 17 Rustaveli that feels half restaurant, half antique shop: a short menu of a dozen or so dishes done seriously — lobio in a clay pot, kharcho, mushroom dishes, heirloom tomato salad, tkemali sorbet. Georgia's most consistently praised traditional kitchen in the centre.","go":"Down Kostava onto Rustaveli Ave; the entrance is at street level beside the theatre and you go down.","dist":"1.1 km · 16 min walk","tip":"If you want one proper sit-down Georgian lunch before the flight, make it this rather than an Old Town tourist supra. Book, or turn up at 12:00 when it opens.","links":[{"t":"Restaurant Guru","u":"https://restaurantguru.com/Salobie-Bia-Tbilisi"},{"t":"Wander-Lush · best restaurants","u":"https://wander-lush.org/tbilisi-georgia-food-best-restaurants-cafes-guide/"}],"dy":[9]},{"id":"sakhli-veraze","n":"Sakhli Veraze (House in Vera)","k":"eat","ll":[41.70651,44.78739],"price":"≈20–70 GEL per person","gbp":"≈£6–20","open":"Daily, lunch through evening (exact hours unconfirmed)","win":"D9 lunch or an early last supper","mins":75,"d":"A neighbourhood Georgian restaurant at 25 Merab Kostava St, two minutes from the hotel door — home-style cooking, beef khinkali, herb salads, homemade lemonade, outdoor tables in summer. Unpretentious and full of locals rather than tour groups.","go":"Turn right out of the ibis onto Kostava St; it is 120 m along.","dist":"120 m · 2 min walk","tip":"The one to keep in reserve. If the Chronicle trip overruns, or you simply cannot face another walk, this is a two-minute stagger from the hotel and still a proper Georgian meal.","links":[{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70651,44.78739"},{"t":"Wander-Lush · Vera neighbourhood","u":"https://wander-lush.org/where-to-stay-in-tbilisi-neighbourhoods-map/"}],"dy":[9]},{"id":"8000-vintages","n":"8000 Vintages wine shop & tasting","n2":"8000 მოსავალი","k":"drink","ll":[41.70198,44.79666],"price":"Tasting 35–45 GEL pp with charcuterie; bottles from ≈25 GEL","gbp":"≈£10–13 pp; bottles from ≈£7","open":"Tastings Mon–Sat 13:00–19:00, book ahead; shop open longer","win":"D9 late afternoon — buying wine to take home","mins":75,"d":"Over a thousand hand-picked Georgian labels at 27 Revaz Tabukashvili St, just behind the Opera. Sit-down tastings pair four wines with a charcuterie board and someone who can actually explain qvevri, saperavi and the difference between an amber wine and an oxidised one. They also sell chacha and will pack bottles for a flight.","go":"13 min: down Kostava onto Rustaveli Ave, then right behind the Opera onto Tabukashvili St.","dist":"850 m · 13 min walk","tip":"The most reliable place to buy bottles to take home — taste first, then buy what you liked. Book the tasting a day ahead. Every bottle must go in the hold, so leave room in the rucksacks and wrap them in dirty trekking socks.","links":[{"t":"Wander-Lush · Tbilisi wine guide","u":"https://wander-lush.org/tbilisi-wine-guide-bars-shops/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70198,44.79666"}],"dy":[9]},{"id":"wine-not-vera","n":"Wine Not? — the last drink","n2":"ვაინ ნოთ?","k":"drink","ll":[41.70806,44.78109],"price":"Glasses from ≈10 GEL; 5 GEL off bottles bought to take away","gbp":"From ≈£3","open":"Evenings (exact hours unconfirmed) — check on the day","win":"D9 17:00–18:15, before the airport run","mins":60,"d":"A small Vera wine bar at 6 Vasil Petriashvili St with live piano in the evenings, Georgian bottles by the glass and a discount if you buy a bottle to carry out. Ten minutes from the hotel, so you can have a last glass and still be back for the bags with time in hand.","go":"10 min west through Vera along Kostava and Petriashvili St. Wine Factory N1, a whole complex of bars and restaurants in a converted wine works, is 150 m further along at Petriashvili 1 if this is shut.","dist":"650 m · 10 min walk","tip":"Leave by 18:15 at the latest. Bags from the ibis, then Bolt to the airport: ≈35 GEL and 30–40 minutes, which puts you at TBS around 19:15 for a 21:30 departure. Do not rely on bus 337 — it is diverted while Rustaveli is closed.","links":[{"t":"Wander-Lush · Tbilisi wine guide","u":"https://wander-lush.org/tbilisi-wine-guide-bars-shops/"},{"t":"Wander-Lush · getting to the airport","u":"https://wander-lush.org/tbilisi-airport/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.70806,44.78109"}],"dy":[9]},{"id":"tbilisi-vera-dry-bridge-market","n":"Dry Bridge Market","n2":"მშრალი ხიდის ბაზრობა","k":"market","ll":[41.70124,44.80331],"price":"Free to browse; cash only","gbp":"Free","open":"Daily ≈09:00–17:00 (best 10:00–14:00); thins out badly in rain","win":"D9 late morning / early afternoon","mins":75,"d":"The Soviet-junk flea market strung along the Mtkvari embankment by the Dry Bridge and spilling into Dedaena and 9 March parks: war medals, Lenin busts, vintage cameras, caviar tins, vinyl, Russian books, brass doorknobs, porcelain, drinking horns, panduri, Pirosmani knock-offs. There is also an underground antiques section down a set of stairs with chandeliers and ceramics, and an artists' garden of original paintings alongside.","go":"≈25 min walk: down Kostava onto Rustaveli Ave, then left at the National Gallery through 9 April Park to the river embankment. Faster with the works on: metro Rustaveli → Liberty Square (1 stop, 1 GEL on a 2 GEL Metromoney card) then 850 m on foot.","dist":"1.4 km · 22–25 min walk","tip":"Wednesday is a weekday market — perhaps two-thirds of the weekend stalls, but calmer and easier to haggle. Bring small lari notes; cards are unreliable. Haggle politely, buy several things from one seller for a better price, and expect a tourist premium. Georgian law regulates the export of genuinely old icons, carpets, coins and manuscripts — stick to badges, cameras and bric-a-brac and you're fine.","links":[{"t":"Wander-Lush guide","u":"https://wander-lush.org/dry-bridge-market-tbilisi-flea-market/"},{"t":"Tbilisi Local Guide","u":"https://tbilisilocalguide.com/tbilisi/dry-bridge-flea-market/"},{"t":"TripAdvisor","u":"https://www.tripadvisor.com/Attraction_Review-g294195-d6426434-Reviews-Dry_Bridge_Market-Tbilisi.html"}],"dy":[9]},{"id":"tbilisi-vera-dezerter-bazaar","n":"Dezerter Bazaar","n2":"დეზერტირების ბაზრობა","k":"market","ll":[41.7212,44.7942],"price":"Svan salt + utskho suneli ≈15 GEL the pair; churchkhela 2–5 GEL each","gbp":"≈£4 / £0.60–1.40","open":"Daily, roughly 08:00–18:00; busiest in the morning","win":"D9 late afternoon — the shopping run","mins":60,"d":"The big chaotic food market by the railway station: mounds of spices sold loose, sulguni and guda cheese, walnut oil, dried tklapi fruit leather, adjika, and churchkhela hung in rows. This is where Georgians buy, so it is a fraction of the price of the tourist shops and the vendors will let you smell and taste before you commit.","go":"25 min walk north along Kostava and Tsinamdzghvrishvili St, or metro Rustaveli → Station Square (2 stops, 1 GEL) and 400 m on foot. A Bolt is ≈8–10 GEL.","dist":"1.7 km · 25 min walk","tip":"This is the answer to 'where do we buy Svan salt, spices and churchkhela without paying tourist prices'. Bring cash and a bag. Ask for it double-wrapped — loose spice in a rucksack for a four-hour flight is a mistake you make once. Taste the churchkhela: a good one bends and has visible walnut halves.","links":[{"t":"Wander-Lush · souvenir shops & markets","u":"https://wander-lush.org/gift-shop-tbilisi-souvenirs/"},{"t":"Google Maps","u":"https://www.google.com/maps/search/?api=1&query=41.72120,44.79420"}],"dy":[9]}]},"copenhagen":{"n":"Copenhagen","anchor":[55.66963,12.57091],"anchorName":"Next House / København H","days":[10],"win":"Thu 09:00–20:15, bags in a locker at Central","note":"Rate used throughout: 1 DKK ≈ £0.115 (0.1147 on 31 Aug 2026), so 100 DKK ≈ £11.50. Bags: the DSB self-service lockers are in the Central Station basement by the Istedgade exit — 70 DKK (~£8) small, 80 DKK (~£9) large, per 24h, open 05:30–01:00 Mon–Sat. One large locker shared between two of you is £4.50 each for the whole day; do it first thing and walk out unencumbered. Transport: do NOT buy a City Pass in the morning. Copenhagen's core is genuinely walkable — everything from Central to Nyhavn to Christianshavn is inside a 35-minute walk — and a single 2-zone ticket is only 24 DKK (~£2.75). You need one guaranteed journey: the metro M2 out to Kastrup at ~20:15. If you also want the harbour bus 991/992 (a full-length harbour cruise on a normal bus ticket — the single best-value thing in the city), then two singles each ≈ 48 DKK still beats the 100 DKK 24h City Pass Small. Buy the City Pass Small only if you end up making four or more trips. A sane shape for the day: lockers → pastry → walk Strøget to Rundetårn → Torvehallerne or Domhusets for lunch → Amalienborg guard change at 12:00 → harbour bus north → Kastellet/Little Mermaid → harbour bus back → Christianshavn and Christiania → Christiansborg tower (free, open till 21:00) at dusk → one beer → metro. Realistic food budget, being careful: bakery breakfast 60–80 DKK, a proper cheap lunch 50–100 DKK, dinner 100–150 DKK, one beer 30–50 DKK — call it 250–350 DKK (£29–40) per person for the day. That is achievable but only if you deliberately avoid Nyhavn's waterfront terraces, where a beer is 110–130 DKK.","items":[{"id":"kobenhavn-h-lockers","n":"Left-luggage lockers, Copenhagen Central Station","n2":"Bagageopbevaring, Københavns Hovedbanegård","k":"sight","ll":[55.67276,12.56468],"price":"70 DKK small (35×45×90 cm) / 80 DKK large (35×60×90 cm), per 24h. Staffed desk 75/85 DKK","gbp":"~£8 / ~£9 per locker per 24h","open":"Mon–Sat 05:30–01:00; Sun & holidays 06:00–01:00","win":"D10 — first thing, ~09:00","mins":15,"d":"DSB self-service coin/card lockers in the station basement, by the exit towards Istedgade — from the main hall turn left and head for the corner near the stairs down to platforms 11 and 12. Two backpacks fit in one large locker.","go":"Next House is directly behind the station; cross Bernstorffsgade and enter the main hall.","dist":"0.3 km · 4 min walk from Next House","tip":"Share ONE large locker between the two of you — 80 DKK total, £4.50 each for the whole day. Closing at 01:00 is irrelevant to you but note the 24h clock starts on insertion, so there is no part-day discount. Nearby app-based alternatives (Stasher, Nannybag, Radical) start around €3.90–5 per bag per day and are sometimes marginally cheaper for two bags, but they are in shops with their own opening hours, whereas the station lockers are 40 seconds from your metro.","links":[{"t":"VisitCopenhagen — luggage storage (prices confirmed here)","u":"https://www.visitcopenhagen.com/node/1297"},{"t":"VisitCopenhagen — basic need-to-know info","u":"https://www.visitcopenhagen.com/copenhagen/planning/travel-info/basic-need-to-know-information"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67276,12.56468"}],"dy":[10]},{"id":"transport-ticket","n":"The transport ticket that actually makes sense","n2":"Billetter — City Pass Small / enkeltbillet","k":"sight","ll":[55.67276,12.56468],"price":"Single 2 zones 24 DKK (22 DKK in the Rejsekort app); City Pass Small 24h 100 DKK; City Pass Large 24h 200 DKK","gbp":"Single ~£2.75; City Pass Small ~£11.50","open":"Ticket machines at Central Station and every metro station; Rejsebillet / DOT app","win":"D10 — buy as needed","mins":10,"d":"City Pass Small covers zones 1–4: all bus, metro, S-train, regional train AND the harbour buses, and crucially it includes Copenhagen Airport, so there is no airport surcharge. City Pass Large (zones 1–99) is pointless for a single day in the city.","go":"Machines are in the Central Station concourse and on the metro level.","dist":"0 km · at the station","tip":"The honest maths: your one compulsory journey is the M2 metro to Kastrup at ~20:15, which is a 3-zone ticket (~36 DKK). If you add two harbour-bus hops that is still under 100 DKK, so buy singles. The City Pass Small only wins from about four journeys up, or if it rains and you start hopping on buses. Whatever you do, buy the airport ticket BEFORE you get on the metro — there is no on-board sale and the fines are large.","links":[{"t":"DOT — City Pass (official)","u":"https://www.publictransport.dk/tickets/citypass"},{"t":"DOT — all tickets and prices","u":"https://www.publictransport.dk/tickets"},{"t":"VisitCopenhagen — need to know","u":"https://www.visitcopenhagen.com/copenhagen/planning/travel-info/basic-need-to-know-information"}],"dy":[10]},{"id":"marmorkirken","n":"Frederik's Church (the Marble Church)","n2":"Marmorkirken / Frederiks Kirke","k":"monument","ll":[55.68497,12.58955],"price":"Church free. Dome tour 50 DKK adult, under 12 free","gbp":"Free; dome ~£5.75","open":"Church Mon–Thu 10:00–17:00, Fri 12:00–17:00, Sat 10:00–17:00, Sun 13:00–17:00. Dome tour Sat & Sun 13:30 only","win":"D10 — late morning, right beside Amalienborg","mins":25,"d":"A vast green copper dome, 31 m across, the largest in Scandinavia, sitting on the axis that runs from Amalienborg's courtyard out to the Opera House. The interior is free and genuinely worth ten minutes — the coffered dome and the ring of statues of Danish churchmen.","go":"Walk up Bredgade or Store Kongensgade from Kongens Nytorv; it is one block behind Amalienborg.","dist":"2.7 km · 34 min walk","tip":"Flag: the dome climb is Saturdays and Sundays at 13:30 only outside high summer, so on Thursday 10 September it will almost certainly NOT be running — do not build your day around it. Some listings say 'daily in summer at 13:00', but the church's own site lists weekends only. Go inside for free, look up, and take your paid view at Vor Frelsers or your free one at Christiansborg instead. It is also thirty seconds from the Amalienborg guard change, so pair the two.","links":[{"t":"Marmorkirken (official)","u":"https://www.marmorkirken.dk/"},{"t":"VisitCopenhagen","u":"https://www.visitcopenhagen.com/copenhagen/planning/the-marble-church-gdk414142"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.68497,12.58955"}],"dy":[10]},{"id":"nyhavn","n":"Nyhavn","n2":"Nyhavn","k":"sight","ll":[55.67974,12.59089],"price":"Free to walk","gbp":"Free","open":"Always open","win":"D10 — any time; best light in the morning","mins":30,"d":"The 17th-century canal with the row of ochre, red and blue merchants' houses and the wooden ships moored along it. Hans Christian Andersen lived at three different addresses here (numbers 20, 67 and 18). It is a postcard and it is also completely mobbed, but it is free and it takes fifteen minutes.","go":"Walk east along Strøget from the Rådhus to Kongens Nytorv, and the canal opens on your right.","dist":"2.4 km · 30 min walk","tip":"Do NOT eat or drink on the sunny north side — a beer on those terraces runs 110–130 DKK (£13–15), roughly four times what you will pay in a bodega twenty minutes away. Sit on the quay edge with a bakery pastry instead, which is what half the locals are doing. The harbour-bus pier is at the far (harbour) end, so use Nyhavn as your boarding point rather than a destination.","links":[{"t":"Wikipedia — Nyhavn","u":"https://en.wikipedia.org/wiki/Nyhavn"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.67974,12.59089"}],"dy":[10]},{"id":"little-mermaid","n":"The Little Mermaid","n2":"Den Lille Havfrue","k":"monument","ll":[55.69287,12.59929],"price":"Free","gbp":"Free","open":"Always open","win":"D10 — early afternoon, on a loop with Kastellet","mins":20,"d":"Edvard Eriksen's 1913 bronze, commissioned by Carl Jacobsen of Carlsberg after he saw a ballet of the Andersen story. She is 1.25 m tall and sits on a rock a couple of metres offshore on the Langelinie promenade.","go":"Walk north along the harbour from Amalienborg through Kastellet, or take harbour bus 992 to Nordre Toldbod and walk 10 minutes.","dist":"4.1 km · 51 min walk (or harbour bus 992 + 10 min)","tip":"The honest word: she is small, she is 50 minutes' walk from Central Station, and there are usually forty people with phones in front of her. She is NOT worth a dedicated pilgrimage on an eleven-hour day. She IS worth it as the far point of one good loop — Amalienborg at noon, the Marble Church, then Kastellet's ramparts, then the Mermaid, then harbour bus 991 back south. Done that way the walk is the pleasure and she is just the turning point. If you are short of time, skip her without guilt.","links":[{"t":"Wikipedia — The Little Mermaid (statue)","u":"https://en.wikipedia.org/wiki/The_Little_Mermaid_(statue)"},{"t":"Map","u":"https://www.google.com/maps/search/?api=1&query=55.69287,12.59929"}],"dy":[10]},{"id":"amalienborg-guard-change","n":"Amalienborg and the Changing of the Guard","n2":"Amalienborg — Vagtskifte","k":"monument","ll":[55.68397,12.59322],"price":"Free to watch. Amalienborg Museum 125 DKK (not needed)","gbp":"Free","open":"Guard change daily at 12:00; the parade
