var LMFAMLBL = { see:'See', view:'Views', eat:'Eat', drink:'Drink', shop:'Shop' };
var LMFAMORD = ['see','view','eat','drink','shop'];
var LMKLBL = { sight:'Sight', monument:'Monument', museum:'Museum', view:'Viewpoint',
               nature:'Outdoors', eat:'Restaurant', cafe:'Café', drink:'Bar',
               night:'Nightlife', market:'Market' };

var lmLayer = L.layerGroup().addTo(map);
var lmOn = true;          // header toggle
var lmFilter = 'all';     // 'all' | family key
var lmOpen = null;        // id of the POI whose card is showing
var lmNoteOpen = {};      // cluster -> is its briefing expanded
var LMBY = {};            // id -> { it, ck }

(function indexLM(){
  var poi = D.poi || {};
  Object.keys(poi).forEach(function(ck){
    (poi[ck].items || []).forEach(function(it){ LMBY[it.id] = { it: it, ck: ck }; });
  });
})();

function lmClustersForDay(dn){
  var poi = D.poi || {};
  var seq = (D.poiSeq || {})[dn];
  if (seq) return seq.filter(function(ck){ return !!poi[ck]; });
  return Object.keys(poi).filter(function(ck){ return (poi[ck].days || []).indexOf(dn) >= 0; });
}
/* an item shows on a day if it has no day hint, or names that day */
function lmOnDay(it, dn){ return !it.dy || it.dy.indexOf(dn) >= 0; }

/* clusters to draw: the selected day's, plus any whose anchor is in view once zoomed in */
function lmActiveClusters(){
  var poi = D.poi || {};
  var keys = lmClustersForDay(state.day ? state.day.d : -1).slice();
  if (state.zoom >= 11.2){
    var b = map.getBounds();
    Object.keys(poi).forEach(function(ck){
      if (keys.indexOf(ck) < 0 && b.contains(L.latLng(poi[ck].anchor))) keys.push(ck);
    });
  }
  return keys;
}

function buildLM(){
  lmLayer.clearLayers();
  if (!lmOn || !D.poi) return;
  if (state.zoom < 10.4) return;                 // keep the wide views clean
  var dn = state.day ? state.day.d : -1;
  /* dedupe by id AND by position — a few places (Sameba, Dry Bridge, Dezerter) are written
     up once per day with day-specific advice, and must not stack two pins on one spot.
     The selected day's own clusters come first, so first-wins picks the right framing. */
  var seen = {};
  lmActiveClusters().forEach(function(ck){
    var forDay = lmClustersForDay(dn).indexOf(ck) >= 0;
    (D.poi[ck].items || []).forEach(function(it){
      var spot = it.ll[0].toFixed(4) + ',' + it.ll[1].toFixed(4);
      if (seen[it.id] || seen[spot]) return;
      if (forDay && !lmOnDay(it, dn)) return;
      if (it.fit === 0) return;
      if (lmFilter !== 'all' && LMFAM[it.k] !== lmFilter) return;
      seen[it.id] = 1; seen[spot] = 1;
      var fam = LMFAM[it.k] || 'see';
      var sel = lmOpen === it.id;
      var m = L.marker(it.ll, {
        icon: L.divIcon({ className: '', iconSize: [19,19], iconAnchor: [9.5,9.5],
          html: '<div class="lm' + (sel ? ' sel' : '') + '" style="--c:var(--f-' + fam + ')">' +
                '<div class="lm-d">' + svg(it.k) + '</div>' +
                (state.zoom >= 13.4 || sel ? '<div class="lm-t">' + esc(it.n) + '</div>' : '') +
                '</div>' }),
        zIndexOffset: sel ? 1500 : 300, title: it.n, riseOnHover: true
      });
      m.on('click', function(ev){ L.DomEvent.stop(ev); openLM(it.id, false); });
      m.addTo(lmLayer);
    });
  });
}

function lmFlyTo(ll){
  var z = Math.max(map.getZoom(), 14.6);
  var pd = mapPad();
  var off = (pd.br[1] - pd.tl[1]) / 2;
  var pt = map.project(ll, z).add([0, -off]);
  map.flyTo(map.unproject(pt, z), z, { animate: true, duration: 0.75 });
}
function fitCluster(ck){
  var c = (D.poi || {})[ck]; if (!c) return;
  var dn = state.day ? state.day.d : -1;
  var pts = (c.items || []).filter(function(it){ return lmOnDay(it, dn); })
                           .map(function(it){ return it.ll; });
  pts.push(c.anchor);
  var pd = mapPad();
  map.flyToBounds(L.latLngBounds(pts).pad(0.16),
    { animate: true, duration: 0.85, maxZoom: 15.5,
      paddingTopLeft: pd.tl, paddingBottomRight: pd.br });
}

function openLM(id, fly){
  var rec = LMBY[id]; if (!rec) return;
  lmOpen = id;
  if (!lmOn){ lmOn = true; $('#btn-lm').classList.add('on'); $('#btn-lm').setAttribute('aria-pressed','true'); }
  renderLMCard(rec);
  buildLM();
  markLMRow(id);
  if (fly) lmFlyTo(rec.it.ll);
}
function closeLM(){
  if (!lmOpen) return;
  lmOpen = null;
  $('#lm-card').classList.remove('show');
  buildLM();
  markLMRow(null);
}
function markLMRow(id){
  var rows = document.querySelectorAll('#sheet-body .lm-row');
  for (var i = 0; i < rows.length; i++)
    rows[i].classList.toggle('sel', id != null && rows[i].getAttribute('data-lm') === id);
}

function renderLMCard(rec){
  var it = rec.it, c = D.poi[rec.ck], fam = LMFAM[it.k] || 'see';
  var na = function(v){ return !v || /^n\/?a$/i.test(String(v).trim()); };
  var facts = '';
  if (!na(it.price)){
    var cap = (it.gbp && it.gbp !== it.price &&
               !(/^free/i.test(it.gbp) && /free/i.test(it.price))) ? esc(it.gbp) : 'Cost';
    facts += '<div' + (it.price.length > 40 ? ' class="wide"' : '') + '><b>' +
            esc(it.price) + '</b><span>' + cap + '</span></div>';
  }
  if (!na(it.dist))  facts += '<div><b>' + esc(it.dist.split('·')[0].trim()) + '</b><span>From ' +
    esc(c.anchorName) + '</span></div>';
  if (it.mins)  facts += '<div><b>' + it.mins + ' min</b><span>Allow</span></div>';
  var warn = it.fit === 0 ? '<div class="lm-c-warn">' + svg('warn') +
    '<p>Does not fit your window here — listed so you know not to plan around it. ' +
    esc(it.win) + '</p></div>' : '';

  var blocks = '';
  if (it.go) blocks += '<div class="lm-c-blk">' + svg('compass') +
    '<div><b>Getting there</b><p>' + esc(it.go) +
    (it.dist ? ' <span class="lm-c-dist">(' + esc(it.dist) + ')</span>' : '') + '</p></div></div>';
  if (it.open || it.win) blocks += '<div class="lm-c-blk">' + svg('clock') +
    '<div><b>When</b><p>' + esc([it.open, it.fit === 0 ? '' : it.win].filter(Boolean).join(' · ')) + '</p></div></div>';
  if (it.tip) blocks += '<div class="lm-c-blk tip">' + svg('bulb') +
    '<div><b>Tip</b><p>' + esc(it.tip) + '</p></div></div>';

  var links = (it.links || []).map(function(L2){
    return '<a href="' + esc(L2.u) + '" target="_blank" rel="noopener">' + esc(L2.t) + svg('ext') + '</a>';
  }).join('');

  var card = $('#lm-card');
  card.style.setProperty('--c', 'var(--f-' + fam + ')');
  card.innerHTML =
    '<div class="lm-c-hd">' +
      '<div class="lm-c-ic">' + svg(it.k) + '</div>' +
      '<div class="lm-c-tt"><div class="lm-c-n">' + esc(it.n) + '</div>' +
      '<div class="lm-c-s">' + esc(LMKLBL[it.k] || it.k) + ' · ' + esc(c.n) +
        (it.n2 ? ' · ' + esc(it.n2) : '') + '</div></div>' +
      '<button class="lm-c-x" id="lm-close" aria-label="Close">' + svg('x') + '</button>' +
    '</div>' +
    '<div class="lm-c-body">' +
      warn + (facts ? '<div class="lm-c-facts">' + facts + '</div>' : '') +
      '<p class="lm-c-d">' + esc(it.d) + '</p>' + blocks +
      (links ? '<div class="lm-c-links">' + links + '</div>' : '') +
    '</div>';
  card.classList.add('show');
  card.querySelector('#lm-close').onclick = closeLM;
  card.querySelector('.lm-c-body').scrollTop = 0;
}

function lmSection(){
  if (!D.poi) return '';
  var dn = state.day.d;
  var keys = lmClustersForDay(dn);
  if (!keys.length) return '';

  /* filter chips from everything available today */
  var pool = [];
  keys.forEach(function(ck){
    (D.poi[ck].items || []).forEach(function(it){ if (lmOnDay(it, dn) && it.fit !== 0) pool.push(it); });
  });
  if (!pool.length) return '';
  var counts = {};
  pool.forEach(function(it){ var f = LMFAM[it.k] || 'see'; counts[f] = (counts[f] || 0) + 1; });
  var chips = '<button class="lm-f' + (lmFilter === 'all' ? ' on' : '') + '" data-lmf="all">All ' +
              pool.length + '</button>';
  LMFAMORD.forEach(function(f){
    if (!counts[f]) return;
    chips += '<button class="lm-f' + (lmFilter === f ? ' on' : '') + '" data-lmf="' + f +
             '" style="--c:var(--f-' + f + ')"><i></i>' + LMFAMLBL[f] + ' ' + counts[f] + '</button>';
  });

  var html = '<div class="sec-lbl"><span class="eyebrow">Worth your time</span></div>' +
             '<div class="lm-fits">' + chips + '</div>';

  keys.forEach(function(ck){
    var c = D.poi[ck];
    var items = (c.items || []).filter(function(it){
      return lmOnDay(it, dn) && (lmFilter === 'all' || LMFAM[it.k] === lmFilter);
    });
    var any = (c.items || []).some(function(it){ return lmOnDay(it, dn); });
    if (!any) return;
    html += '<div class="lm-hd"><b>' + esc(c.n) + '</b>' +
            '<button class="lm-explore" data-lmfit="' + esc(ck) + '">' + svg('fit') + 'Explore</button></div>' +
            '<div class="lm-hd" style="margin:-4px 0 7px"><span class="lm-win">' + esc(c.win) + '</span></div>';
    if (c.note && lmFilter === 'all'){
      var big = c.note.length > 300, op = !!lmNoteOpen[ck];
      html += '<div class="lm-note' + (big && !op ? ' clamp' : '') + '"><p>' + esc(c.note) + '</p></div>';
      if (big) html += '<button class="lm-more" data-lmnote="' + esc(ck) + '">' +
        (op ? 'Show less' : 'Read the full briefing') + '</button>';
    }
    var fits = items.filter(function(it){ return it.fit !== 0; });
    var nof  = items.filter(function(it){ return it.fit === 0; });
    if (!fits.length && !nof.length){
      html += '<div class="lm-empty">Nothing in this category here.</div>';
      return;
    }
    if (!fits.length) html += '<div class="lm-empty">Nothing in this category fits this window.</div>';
    html += '<div class="lm-list">';
    fits.forEach(function(it){
      var fam = LMFAM[it.k] || 'see';
      var meta = [];
      if (it.price) meta.push('<em>' + esc(it.gbp && it.gbp !== 'Free' ? it.gbp : it.price) + '</em>');
      if (it.dist)  meta.push(esc(it.dist.split('·').slice(0, 2).join(' ·').trim()));
      if (it.mins)  meta.push(it.mins + ' min');
      if (it.win)   meta.push(esc(it.win));
      html += '<button class="lm-row' + (lmOpen === it.id ? ' sel' : '') + '" data-lm="' + esc(it.id) +
        '" style="--c:var(--f-' + fam + ')">' +
        '<div class="lm-ic">' + svg(it.k) + '</div>' +
        '<div class="lm-rt"><div class="lm-n">' + esc(it.n) + '</div>' +
        '<div class="lm-s">' + esc(it.d) + '</div>' +
        '<div class="lm-meta">' + meta.join(' <s>·</s> ') + '</div></div></button>';
    });
    html += '</div>';
    if (nof.length){
      html += '<div class="lm-nofit-h">Here, but not in your window</div><div class="lm-list">';
      nof.forEach(function(it){
        var fam2 = LMFAM[it.k] || 'see';
        html += '<button class="lm-row nofit' + (lmOpen === it.id ? ' sel' : '') +
          '" data-lm="' + esc(it.id) + '" style="--c:var(--f-' + fam2 + ')">' +
          '<div class="lm-ic">' + svg(it.k) + '</div>' +
          '<div class="lm-rt"><div class="lm-n">' + esc(it.n) + '</div>' +
          '<div class="lm-s">' + esc(it.d) + '</div>' +
          '<div class="lm-meta">' + esc(it.win) + '</div></div></button>';
      });
      html += '</div>';
    }
  });
  return html;
}

function renderSheet(keepScroll){
  var day = state.day, live = state.live;
  $('#sheet-day').textContent = 'Day ' + day.d + ' · ' + day.dow + ' ' +
    new Date(day.date + 'T12:00:00Z').toLocaleDateString('en-GB', { day:'numeric', month:'short', timeZone:'UTC' });
  $('#sheet-title').textContent = day.title;

  var html = '';
  // stats
  var stats = [];
  (day.legs || []).forEach(function(id){
    var rt = D.routes[id];
    if (!rt || rt.mode === 'transfer') return;
    var lbl = { air:'Flown', rail:'By rail', road:'By road', hike:'On foot' }[rt.mode];
    stats.push('<div class="stat"><b>' + (rt.km >= 1000 ? Math.round(rt.km).toLocaleString() : rt.km) +
      ' km</b><span>' + lbl + '</span></div>');
  });
  if (day.trek){
    var t = D.routes[day.trek];
    stats.push('<div class="stat"><b>+' + t.gain.toLocaleString() + ' m</b><span>Ascent</span></div>');
    stats.push('<div class="stat"><b>&minus;' + t.loss.toLocaleString() + ' m</b><span>Descent</span></div>');
  }
  if (stats.length) html += '<div class="stat-row">' + stats.join('') + '</div>';

  html += '<p style="margin:0 0 4px;font-size:13.5px;color:var(--mist);line-height:1.5">' +
          esc(day.where) + '</p>';

  html += '<div class="sec-lbl"><span class="eyebrow">The day</span></div>';
  html += '<div class="tl">';
  (day.events || []).forEach(function(e){
    var hot = live && live.phase === 'during' && live.liveIndex === state.dayIndex &&
              live.moving && e.k && ['air','hike','rail','van','bus','walk'].indexOf(e.k) >= 0 &&
              live.moving.r && routeMatchesEvent(live.moving.r, e);
    html += '<div class="ev' + (hot ? ' hi' : '') + (e.k === 'warn' ? ' warn' : '') + '">' +
      '<div class="ev-dot">' + svg(e.k) + '</div>' +
      '<span class="ev-t">' + esc(e.t) + '</span>' +
      '<div class="ev-h">' + esc(e.h) + '</div>' +
      '<div class="ev-s">' + esc(e.s) + '</div>' +
      (e.link ? '<a class="ev-l" href="' + esc(e.link) + '" target="_blank" rel="noopener">' +
        esc(e.linkText || 'Open') + svg('ext') + '</a>' : '') +
      '</div>';
  });
  html += '</div>';

  if (day.trek){
    var rt = D.routes[day.trek];
    html += '<div class="prof"><div class="prof-h"><b>Elevation profile</b>' +
      '<span>' + rt.km + ' km · high point ' + rt.maxEle.toLocaleString() + ' m</span></div>' +
      profileSVG(rt) + '</div>';
  }

  html += lmSection();

  if (day.stay){
    html += '<div class="sec-lbl"><span class="eyebrow">Tonight</span></div>' + stayCard(day.stay, false);
  } else {
    html += '<div class="sec-lbl"><span class="eyebrow">Tonight</span></div>' +
      '<div class="stay"><div class="stay-h"><div class="stay-ic">' + svg('bed') + '</div>' +
      '<div><div class="stay-n">Home</div><div class="stay-s">Own beds, finally</div></div></div></div>';
  }
  if (day.ghost) html += stayCard(day.ghost, true);

  html += '<div id="credit">Terrain from SRTM via open-elevation · roads, trails, rivers and glaciers ' +
    'from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ' +
    '(ODbL) · coastlines from Natural Earth · flight and rail times are scheduled, ' +
    'road and trail times are estimates.</div>';

  var sb = $('#sheet-body'), keep = keepScroll ? sb.scrollTop : 0;
  sb.innerHTML = html;
  sb.scrollTop = keep;
  if (lmOpen) markLMRow(lmOpen);
}
function routeMatchesEvent(routeId, e){
  var m = { air:'fly', rail:'train', van:'road', bus:'xfer', walk:'walk', hike:'hike' }[e.k];
  return m ? routeId.indexOf(m) === 0 : false;
}

/* ---------------- rail (day chips) ---------------- */
function renderRail(){
  var rail = $('#rail'), live = state.live;
  rail.innerHTML = '';
  D.days.forEach(function(day, i){
    var b = document.createElement('button');
    var isToday = live && live.phase === 'during' && live.liveIndex === i;
    var done = live && (live.phase === 'after' || i < live.liveIndex);
    b.className = 'chip' + (i === state.dayIndex ? ' sel' : '') + (isToday ? ' today' : '') +
                  (done ? ' done' : '');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', i === state.dayIndex ? 'true' : 'false');
    var prog = done ? 1 : (isToday ? dayProgress(day) : 0);
    b.innerHTML = '<div class="chip-d">' + (isToday ? 'TODAY' : 'DAY ' + day.d) + '</div>' +
      '<div class="chip-t">' + esc(day.chip) + '</div>' +
      '<div class="chip-bar"><i style="width:' + Math.round(prog*100) + '%"></i></div>';
    b.onclick = function(){ select(i, true); };
    rail.appendChild(b);
  });
  var sel = rail.children[state.dayIndex];
  if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}
function dayProgress(day){
  var t = now().getTime(), a = day.t0.getTime(), b = day.t1.getTime();
  return Math.max(0, Math.min(1, (t - a)/(b - a)));
}

/* ---------------- header ---------------- */
function renderHeader(){
  var live = state.live, lbl = $('#status-label'), where = $('#status-where');
  var d = D.days[live.liveIndex];
  if (live.phase === 'before'){
    var days = Math.ceil((TRIP_START - now())/86400e3);
    lbl.textContent = days <= 0 ? 'Departing today' : days + (days === 1 ? ' day to go' : ' days to go');
    where.textContent = 'Manchester to Istanbul on ' +
      TRIP_START.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    $('#pulse').style.background = cssv('--glacier');
  } else if (live.phase === 'after'){
    lbl.textContent = 'Trip complete';
    where.textContent = 'Home. 10 days, 4 flights, 2 trains and 55 km on foot.';
    $('#pulse').style.background = cssv('--glacier');
  } else {
    lbl.textContent = 'Day ' + d.d + ' of ' + D.days.length + ' · live';
    where.textContent = live.moving ? movingText(live.moving, d) : d.where;
    $('#pulse').style.background = cssv('--amber');
  }
  var t = now();
  $('#status-clock').textContent =
    t.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone: tzFor(live) }) +
    ' ' + tzLabel(live);
}
function tzFor(live){
  if (live.phase !== 'during') return 'Europe/London';
  return D.days[live.liveIndex].tz || 'Asia/Tbilisi';
}
function tzLabel(live){
  var tz = tzFor(live);
  return { 'Europe/London':'Manchester', 'Europe/Istanbul':'Istanbul',
           'Asia/Tbilisi':'Georgia', 'Europe/Copenhagen':'Copenhagen' }[tz] || '';
}
function movingText(mv, day){
  var rt = D.routes[mv.r];
  var names = {
    'fly-man-saw':'In the air — Manchester to Istanbul',
    'fly-saw-tbs':'In the air — Istanbul to Tbilisi',
    'fly-tbs-cph':'In the air — Tbilisi to Copenhagen',
    'fly-cph-man':'In the air — Copenhagen to Manchester',
    'train-tb-zug':'On the train — Tbilisi to Zugdidi',
    'train-zug-tb':'On the train — Zugdidi to Tbilisi',
    'road-zug-mestia':'Marshrutka up the Enguri gorge to Mestia',
    'road-mestia-zug':'Marshrutka down from Mestia to Zugdidi',
    'road-ushguli-mestia':'On the rough road out of Ushguli',
    'hike-mestia-zhabeshi':'Walking — Mestia to Zhabeshi',
    'hike-zhabeshi-adishi':'Walking — Zhabeshi to Adishi',
    'hike-adishi-ushguli':'Walking — Adishi to Ushguli over the pass'
  };
  var base = names[mv.r] || day.where;
  if (rt && rt.mode === 'hike'){
    var f = state.live.legFrac[mv.r] || 0;
    base += ' · ' + (rt.km * f).toFixed(1) + ' of ' + rt.km + ' km';
  }
  return base;
}

/* ---------------- selection ---------------- */
function select(i, userAction){
  state.dayIndex = Math.max(0, Math.min(D.days.length-1, i));
  state.day = D.days[state.dayIndex];
  state.legFrac = state.live ? state.live.legFrac : {};
  if (userAction){
    state.follow = (state.live && state.live.liveIndex === state.dayIndex &&
                    state.live.phase === 'during');
    $('#btn-live').classList.toggle('on', state.follow);
    closeLM();
  }
  renderSheet(); renderRail(); refreshMap();
  if (userAction) fitDay(state.day, true);
}

function tick(firstRun){
  state.live = computeLive();
  state.legFrac = state.live.legFrac;
  if (state.follow || firstRun){
    state.dayIndex = state.live.liveIndex;
    state.day = D.days[state.dayIndex];
  }
  renderHeader(); renderRail(); renderSheet(); refreshMap();
}

/* ---------------- boot ---------------- */
function boot(){
  buildLand(); buildRelief(); buildDetail(); buildLabels(); buildPOI();
  Object.keys(labelGroups).forEach(function(k){});
  tick(true);
  fitDay(state.day, false);
  applyZoom();
  setInterval(function(){
    state.live = computeLive();
    state.legFrac = state.live.legFrac;
    if (state.follow && state.live.liveIndex !== state.dayIndex){
      state.dayIndex = state.live.liveIndex; state.day = D.days[state.dayIndex];
      renderSheet(); fitDay(state.day, true);
    }
    renderHeader(); renderRail(); refreshMap();
  }, 30000);
  setInterval(renderHeader, 1000);
}

map.on('zoomend', function(){ refreshMap(); });
map.on('moveend', function(){ if (map.getZoom() !== state.zoom) refreshMap(); else buildLM(); });
map.on('click', function(){ closeLM(); });

/* landmark interactions (delegated — the sheet is rebuilt often) */
$('#sheet-body').addEventListener('click', function(e){
  var row = e.target.closest && e.target.closest('[data-lm]');
  if (row){ openLM(row.getAttribute('data-lm'), true); return; }
  var chip = e.target.closest && e.target.closest('[data-lmf]');
  if (chip){ lmFilter = chip.getAttribute('data-lmf'); renderSheet(true); buildLM(); return; }
  var fit = e.target.closest && e.target.closest('[data-lmfit]');
  if (fit){ fitCluster(fit.getAttribute('data-lmfit')); return; }
  var nt = e.target.closest && e.target.closest('[data-lmnote]');
  if (nt){ var k = nt.getAttribute('data-lmnote');
           lmNoteOpen[k] = !lmNoteOpen[k]; renderSheet(true); return; }
});
$('#btn-lm').onclick = function(){
  lmOn = !lmOn;
  this.classList.toggle('on', lmOn);
  this.setAttribute('aria-pressed', lmOn ? 'true' : 'false');
  if (!lmOn) closeLM();
  buildLM();
};
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLM(); });

$('#btn-live').onclick = function(){
  state.follow = true;
  this.classList.add('on');
  state.live = computeLive();
  state.dayIndex = state.live.liveIndex; state.day = D.days[state.dayIndex];
  renderHeader(); renderRail(); renderSheet(); refreshMap();
  fitDay(state.day, true);
};
$('#btn-legend').onclick = function(){
  var on = $('#legend').classList.toggle('show');
  this.classList.toggle('on', on);
};

/* sheet snapping (mobile) */
(function(){
  var sheet = document.getElementById('sheet'), grab = document.getElementById('grab');
  var snap = 1, startY = 0, startH = 0, dragging = false;
  function isMobile(){ return window.innerWidth < 900; }
  function setSnap(n){
    snap = Math.max(0, Math.min(2, n));
    sheet.style.height = '';
    sheet.setAttribute('data-snap', snap);
    setTimeout(function(){ map.invalidateSize({ animate:false }); }, 320);
  }
  grab.addEventListener('click', function(){ if (isMobile() && !dragging) setSnap(snap === 2 ? 0 : snap + 1); });
  grab.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setSnap(snap === 2 ? 0 : snap + 1); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); setSnap(snap + 1); }
    if (e.key === 'ArrowDown'){ e.preventDefault(); setSnap(snap - 1); }
  });
  grab.addEventListener('pointerdown', function(e){
    if (!isMobile()) return;
    dragging = false; startY = e.clientY;
    startH = sheet.getBoundingClientRect().height;
    grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove', function(e){
    if (!startH || !isMobile()) return;
    var dy = startY - e.clientY;
    if (Math.abs(dy) < 5) return;
    dragging = true;
    sheet.style.transition = 'none';
    sheet.style.height = Math.max(92, Math.min(window.innerHeight*0.88, startH + dy)) + 'px';
  });
  function end(e){
    if (!startH) return;
    var h = sheet.getBoundingClientRect().height;
    sheet.style.transition = '';
    startH = 0;
    if (dragging){
      var hs = [92, Math.min(360, window.innerHeight*0.42), window.innerHeight*0.86];
      var best = 0, bd = 1e9;
      hs.forEach(function(v, i){ var d = Math.abs(v - h); if (d < bd){ bd = d; best = i; } });
      setSnap(best);
      setTimeout(function(){ dragging = false; }, 60);
    }
  }
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
  window.addEventListener('resize', function(){ map.invalidateSize({ animate:false }); });
})();

/* theme changes */
if (window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  var onTheme = function(){ buildLand(); buildRelief(); buildDetail(); refreshMap(); renderHeader(); };
  if (mq.addEventListener) mq.addEventListener('change', onTheme);
}
new MutationObserver(function(){
  buildLand(); buildRelief(); buildDetail(); refreshMap(); renderHeader();
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

boot();
})();
